<!doctype html>
<html><head><meta charset="utf-8"><title>RUNNING</title></head>
<body>
<video id="v" muted style="width:320px"></video>
<pre id="log"></pre>
<script>
'use strict';
const QS = new URLSearchParams(location.search);
const ITEM = QS.get('item') || '52';
const SEEK_AT = parseFloat(QS.get('seekAt') || '2');   // wall-seconds into test when to seek
const SEEK_T = parseFloat(QS.get('t') || '1800');      // media time to seek to
const PLAY_SECS = parseFloat(QS.get('secs') || '14');

const v = document.getElementById('v');
const R = { seekT: SEEK_T, ua: navigator.userAgent.slice(0, 80),
  mime: null, duration: null, events: {}, appends: 0, appendedBytes: 0,
  firstFrameMs: null, seekStartMs: null, seekFirstFrameMs: null,
  frameGapJitterMs: null, droppedVideoFrames: null, totalVideoFrames: null,
  currentTimeSamples: [], stallLog: [], hidden: document.hidden,
  fatal: null, done: false, pumpErr: null, trace: [] };

const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

['waiting','stalled','canplay','playing','error'].forEach(ev => {
  R.events[ev] = 0;
  v.addEventListener(ev, () => {
    R.events[ev]++;
    if (ev === 'error') R.fatal = 'video error ' + (v.error && v.error.code);
    if (ev === 'waiting' || ev === 'stalled') {
      let end = -1;
      try { if (v.buffered.length) end = +v.buffered.end(v.buffered.length-1).toFixed(2); } catch (e) {}
      R.stallLog.push({ ev, t: +v.currentTime.toFixed(2), bufEnd: end, ms: Math.round(performance.now() - T0) });
    }
  });
});

let ms = null, sb = null, gen = 0, segs = new Map(), doneAll = false, appended = new Set();
window.R = R;
const T0 = performance.now();

function rafTracking() {
  if (v.requestVideoFrameCallback) {
    let lastM = null, lastN = null;
    const cb = (now, meta) => {
      if (R.firstFrameMs == null) R.firstFrameMs = Math.round(now - T0);
      if (R.seekStartMs != null && R.seekFirstFrameMs == null && meta.mediaTime >= R.seekT - 0.5) {
        R.seekFirstFrameMs = Math.round(now - R.seekStartMs);
      }
      if (lastM != null) R._gaps.push((meta.mediaTime - lastM) - (now - lastN) / 1000);
      lastM = meta.mediaTime; lastN = now;
      if (!R._stop) v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
  }
}
R._gaps = [];

function appendBuf(data) {
  return new Promise((resolve, reject) => {
    const arm = () => {
      const onEnd = () => { sb.removeEventListener('updateend', onEnd); resolve(); };
      const onErr = () => { sb.removeEventListener('updateend', onEnd);
        reject(new Error('append error: ' + (sb.error && sb.error.name))); };
      sb.addEventListener('updateend', onEnd);
      sb.addEventListener('error', onErr);
      try { sb.appendBuffer(data); } catch (e) { reject(e); }
    };
    if (sb.updating) {
      const onUpd = () => { sb.removeEventListener('updateend', onUpd); arm(); };
      sb.addEventListener('updateend', onUpd);
    } else arm();
  });
}

async function fetchPart(name) {
  const r = await fetch('/mse/' + ITEM + '/' + name);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('fetch ' + name + ': ' + r.status);
  return await r.arrayBuffer();
}

async function main() {
  gen = 1;
  // 1) manifest: wait for segments to exist
  let info = null;
  for (;;) {
    info = await fetch('/api/library/' + ITEM + '/stream').then(r => r.json());
    if (info.error) throw new Error(info.error);
    if (info.mime && info.segments.length) break;
    await sleep(500);
  }
  R.mime = info.mime;
  R.duration = info.duration;
  for (const s of info.segments) segs.set(s.n, s.t);
  doneAll = !!info.done;

  ms = new MediaSource();
  const url = URL.createObjectURL(ms);
  await new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('sourceopen timeout')), 5000);
    ms.addEventListener('sourceopen', () => { clearTimeout(t); res(); }, { once: true });
    v.src = url;
  });
  sb = ms.addSourceBuffer(info.mime);
  rafTracking();

  const init = await fetchPart('init');
  if (!init) throw new Error('no init');
  await appendBuf(init); appended.add(0);
  if (info.duration && isFinite(info.duration)) { try { ms.duration = info.duration; } catch (e) {} }

  // 2) pump: keep SEG_AHEAD of the playhead appended
  const KEEP_BEHIND = 30, AHEAD = 60;
  async function evict() {
    if (sb.updating) return;
    try {
      const b = sb.buffered;
      const cut = Math.max(0, v.currentTime - KEEP_BEHIND);
      if (!b.length || b.start(0) >= cut) return;
      await new Promise((res) => {
        const on = () => { sb.removeEventListener('updateend', on); res(); };
        sb.addEventListener('updateend', on);
        sb.remove(b.start(0), cut);
      });
    } catch (e) {}
  }
  let seekDone = false;
  R.trace = [];
  const pump = (async () => {
    for (;;) {
      const anchor = v.currentTime || 0;
      const want = [];
      const arr = [...segs.entries()].sort((a, b) => a[0] - b[0]);
      for (let i = 0; i < arr.length; i++) {
        const [n, t] = arr[i];
        if (appended.has(n)) continue;
        // want segments OVERLAPPING the window: start < anchor+ahead, end > anchor-2
        const end = i + 1 < arr.length ? arr[i + 1][1] : t + 30;
        if (t < anchor + AHEAD && end > anchor - 2) want.push([n, t]);
      }
      let any = false;
      for (const [n] of want) {
        R.trace.push('f' + n);
        const buf = await fetchPart('seg/' + n);
        if (buf === null) { R.trace.push('n404-' + n); break; }
        R.trace.push('a' + n);
        try { await appendBuf(buf); } catch (e) { R.pumpErr = 'append ' + n + ': ' + (e.message || e); return; }
        appended.add(n); any = true;
        R.appends++; R.appendedBytes += buf.byteLength;
      }
      if (any) { v.play().catch(() => {}); await evict(); continue; }
      if (doneAll && appended.size >= segs.size + 1) {
        try { ms.endOfStream(); } catch (e) {}
      }
      await sleep(300);
      if (gen === 0) return;
    }
  })();

  // 3) manifest poller
  const poll = (async () => {
    for (;;) {
      await sleep(1000);
      if (gen === 0) return;
      try {
        const i = await fetch('/api/library/' + ITEM + '/stream').then(r => r.json());
        for (const s of i.segments) segs.set(s.n, s.t);
        doneAll = !!i.done;
        if (i.duration && isFinite(i.duration) && ms.duration !== i.duration) { try { ms.duration = i.duration; } catch (e) {} }
      } catch (e) {}
    }
  })();

  pump.catch(e => { R.pumpErr = R.pumpErr || ('pump: ' + (e.message || e)); });
  // 4) drive: play, then seek mid-movie, measure
  const tEnd = performance.now() + PLAY_SECS * 1000;
  while (performance.now() < tEnd) {
    await sleep(250);
    R.currentTimeSamples.push([Math.round(performance.now() - T0), +v.currentTime.toFixed(2)]);
    if (!seekDone && (performance.now() - T0) >= SEEK_AT * 1000 && R.firstFrameMs != null) {
      seekDone = true;
      R.seekStartMs = performance.now();
      v.currentTime = R.seekT;
    }
  }
  R.playedSecs = +v.currentTime.toFixed(2);
  const dump = (b) => { const out = []; for (let i = 0; i < b.length; i++) out.push([+b.start(i).toFixed(2), +b.end(i).toFixed(2)]); return out; };
  R.diag = { vbuffered: dump(v.buffered), sbbuffered: dump(sb.buffered), seekable: dump(v.seekable), readyState: v.readyState, paused: v.paused, msDuration: ms.duration, sbUpdating: sb.updating, sbErr: sb.error && sb.error.name };
  R._stop = true; gen = 0;
  await Promise.race([pump, sleep(2000)]);
  try { const q = v.getVideoPlaybackQuality(); R.droppedVideoFrames = q.droppedVideoFrames; R.totalVideoFrames = q.totalVideoFrames; } catch (e) {}
  if (R._gaps.length) {
    const g = R._gaps.map(x => Math.abs(x)).sort((a, b) => a - b);
    R.frameGapJitterMs = { n: g.length, p50: +(g[Math.floor(g.length/2)]*1000).toFixed(1), p95: +(g[Math.floor(g.length*0.95)]*1000).toFixed(1) };
  }
  R.trace = (R.trace || []).slice(0, 40);
  R.done = true;
  document.title = 'DONE';
  log(JSON.stringify(R));
}

main().catch(e => { R.fatal = e.message || String(e); R.done = true; document.title = 'DONE'; log('FATAL ' + R.fatal); });
</script>
</body></html>
