<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadTorrent</title>
</head>
<body>
<style>
  :root {
    --bg: #000000; --panel: #0e0e0e; --panel2: #181818; --line: #3a3a3a;
    --line-hi: #636363; --text: #d4d4d4; --muted: #8a8a8a;
    --accent: #272727; --accent-ink: #e0e0e0;
    --danger: #ff6b6b; --ok: #4ade80; --warn: #f5b544;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .floats { position: fixed; top: 14px; right: 18px; z-index: 40; display: flex; gap: 10px; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .btn { background: var(--panel2); border: 0.5px solid var(--line);
         padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
             stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { border-color: var(--line-hi); }
  .btn.primary { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  main { max-width: 1200px; margin: 0 auto; padding: 26px 22px 60px; }
  main[hidden] { display: none; }
  #view-library { max-width: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line);
 overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-3px); border-color: var(--line-hi); }
  .card.sel { border-color: var(--line-hi); box-shadow: 0 0 0 2px rgba(216,216,216,.28); }
  .poster { width: 100%; aspect-ratio: 2/3; background: var(--panel2); display: flex;
            align-items: center; justify-content: center; overflow: hidden; }
  .card .poster img, .bigposter img { width: 100%; height: 100%; object-fit: cover; }
  .poster .ph { font-size: 34px; opacity: .45; }
  .card .meta { padding: 9px 11px; }
  .card .meta .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .y { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: var(--accent-ink);
           font-size: 11px; font-weight: 700; padding: 2px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  .back { background: none; border: none; color: var(--muted); padding: 0 0 14px; font-size: 14px; }
  .back:hover { color: var(--text); }
  .movie-head { display: flex; gap: 26px; margin-bottom: 30px; flex-wrap: wrap; }
  .bigposter { width: 210px; aspect-ratio: 2/3; overflow: hidden;
               background: var(--panel2); border: 1px solid var(--line); flex-shrink: 0;
               display: flex; align-items: center; justify-content: center; }
  .bigposter .ph { font-size: 56px; opacity: .4; }
  .mv-info h1 { margin: 0 0 6px; font-size: 28px; }
  .mv-info .sub { color: var(--muted); margin-bottom: 18px; }
  .mv-info label { display: inline-flex; align-items: center; gap: 8px; margin-right: 14px; cursor: pointer; }
  section { margin: 26px 0; }
  section h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--panel);
         border: 0.5px solid var(--line); padding: 10px 14px; }
  #mv-torrents .row { min-height: 68px; }
  .row:hover { background: var(--panel2); border-color: var(--line-hi); }
  .row.sel { background: var(--panel2); border-color: var(--line-hi); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .row .nm { flex: 1; min-width: 0; }
  .row .nm .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .s { color: var(--muted); font-size: 12px; }
  .row .nm .s .se { color: var(--ok); font-weight: 600; }
  .row .nm .s .le { color: var(--danger); font-weight: 600; }
  .dl { display: block; margin-top: 8px; }
  .dl[hidden] { display: none; }
  .dl .bar { display: flex; height: 4px; background: var(--panel2); overflow: hidden; }
  .dl .bar b { flex: 1; min-width: 1px; display: block; height: 100%; background: transparent; }
  .dl .txt { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .chip { font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ready { color: var(--ok); border-color: var(--ok); }
  .chip.wait { color: var(--warn); border-color: var(--warn); }
  .row .btn { padding: 6px 12px; font-size: 13px; }
  .row label.seq { display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
                   font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
                   user-select: none; }
  .row label.seq input { accent-color: var(--line-hi); cursor: pointer; }
  .row .ibtn { width: 30px; height: 30px; padding: 0; flex-shrink: 0; display: inline-flex;
              align-items: center; justify-content: center; background: var(--panel2);
              border: 0.5px solid var(--line); color: var(--text); }
  .row .ibtn:hover { border-color: var(--line-hi); }
  .row .ibtn.primary { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); }
  .row .ibtn.primary:hover { filter: brightness(1.1); }
  .row .ibtn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .row .ibtn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
                   stroke-linecap: round; stroke-linejoin: round; }
  .formline { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text], input[type=url] { flex: 1; background: var(--panel); color: var(--text);
         border: 1px solid var(--line); padding: 9px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--line-hi); }
  #am-search { width: 100%; display: block; flex: none; }
  label.k { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .panel.confirm { max-width: 380px; }
  .cf-msg { color: var(--text); margin: 0 0 20px; line-height: 1.5; white-space: pre-line; }
  .cf-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72);
           display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           width: 620px; max-width: 100%; max-height: 86vh; overflow: auto; padding: 18px; }
  .phead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .phead span { font-weight: 700; font-size: 16px; }
  .x { background: none; border: none; color: var(--muted); font-size: 18px; }
  .x:hover { color: var(--text); }
  .srow { display: flex; gap: 12px; padding: 10px; align-items: center; }
  .srow:hover { background: var(--panel2); }
  .srow.sel { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .srow .poster { width: 46px; height: 69px; aspect-ratio: 2/3; flex-shrink: 0; }
  .srow .poster img, .srow .poster .ph { width: 100%; height: 100%; object-fit: cover; }
  .srow .poster .ph { display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .srow .info { flex: 1; min-width: 0; }
  .srow .info .t { font-weight: 600; font-size: 14px; }
  .srow .info .s { color: var(--muted); font-size: 12px; }
  .divider { border-top: 1px solid var(--line); margin: 16px 0; }

  .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
               margin: 0 0 4px; }
  .kb-table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
  .kb-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .kb-table th.sort { cursor: pointer; user-select: none; }
  .kb-table th.sort:hover { color: var(--text); }
  .kb-table th[data-dir="asc"]::after { content: ' ▲'; font-size: 9px; }
  .kb-table th[data-dir="desc"]::after { content: ' ▼'; font-size: 9px; }
  .kb-table td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .kb-table tbody tr:hover { background: var(--panel2); }
  .kb-key { width: 150px; padding: 5px 10px; border: 1px solid var(--line);
            background: var(--panel2); color: var(--text); font: inherit; font-size: 13px;
            text-align: center; outline: none; cursor: pointer; flex-shrink: 0; }
  .kb-key:hover { border-color: var(--line-hi); }
  .kb-key.rec { border-color: var(--line-hi); box-shadow: 0 0 0 1px var(--line-hi); background: rgba(216,216,216,.10); }
  .kb-ctx { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kb-label { font-size: 14px; min-width: 0; }
  .kb-table select { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text);
                     border: 1px solid var(--line); padding: 5px 9px;
                     font: inherit; font-size: 14px; }
  .kb-table select.placeholder { color: var(--muted); }
  .kb-table select option { padding: 5px 9px; background: var(--panel2); color: var(--text);
                            font: inherit; font-size: 14px; }
  #kb-table tfoot td:nth-child(2), #kb-table tfoot td:nth-child(3) { padding: 5px 12px 5px 0; }
  #nb-key { color: var(--muted); }
  #nb-key.rec { color: var(--text); }
  .kb-table th:last-child, .kb-table td.kb-del { width: 40px; }
  .kb-table td.kb-del { text-align: right; }
  .kb-table .ibtn { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center;
                    justify-content: center; background: transparent; border: 1px solid var(--line);
 color: var(--muted); }
  .kb-table .ibtn:hover { color: var(--danger); border-color: var(--danger); }
  .kb-table .ibtn#nb-add:hover { color: var(--line-hi); border-color: var(--line-hi); }
  .kb-table .ibtn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none;
                        stroke-linecap: round; stroke-linejoin: round; }
  .kb-actions { display: flex; justify-content: flex-start; gap: 10px; margin-top: 2px; }
  /* Settings + Add-to-library panels: fixed height; header bar (title / close /
   * search input) stays put, only the main area scrolls. */
  #settings-modal .panel, #add-modal .panel {
    height: min(88vh, 760px); display: flex; flex-direction: column; overflow: hidden;
  }
  #settings-modal .panel { width: 720px; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding-right: 10px; }
  .am-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; }

  #player-modal { padding: 0; background: #000; }
  #player-modal[hidden] { display: none; }
  .pwrap { position: relative; width: 100vw; height: 100vh; background: #000; }
  #player { display: block; width: 100vw; height: 100vh; background: #000; pointer-events: none; object-fit: contain; }
  .buf { position: absolute; left: 0; right: 0; top: 0; bottom: 48px; z-index: 5; display: flex; flex-direction: column; gap: 12px;
         align-items: center; justify-content: center; background: rgba(0,0,0,.45); pointer-events: none; }
  .buf .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2);
               border-top-color: #fff; animation: spin .8s linear infinite; }
  .buf span { color: #fff; font-size: 14px; letter-spacing: .4px; }
  .suboverlay { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
                display: flex; justify-content: center; padding: 0 2%; pointer-events: none; }
  .suboverlay span { max-width: 100%; text-align: center; white-space: pre-line; color: #fff;
                     line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pback { position: absolute; top: 10px; left: 10px; z-index: 6; background: rgba(0,0,0,.6);
           border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 6px 14px; font-size: 14px;
           opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .pback.on { opacity: 1; pointer-events: auto; }
  .pback.on:hover { border-color: #fff; }
  .ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px 10px; display: none; z-index: 7; }
  .strip { display: flex; align-items: center; gap: 10px; }
  .pb { cursor: pointer; padding: 0; width: 32px; height: 32px; background: none; border: none;
        flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .pb.on svg { stroke: var(--ok); }
  .pb svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .tm { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
        flex-shrink: 0; letter-spacing: .3px; }
  .seek { flex: 1; height: 5px; min-width: 0; appearance: none; -webkit-appearance: none;
          background-color: rgba(255,255,255,.15);
          cursor: pointer; border: none; outline: none; }
  .skwrap { flex: 1; display: flex; height: 5px; min-width: 0; position: relative; }
  .sktip { position: absolute; bottom: 12px; transform: translateX(-50%);
           background: rgba(0,0,0,.75); color: #fff; font-size: 12px; line-height: 1;
           padding: 4px 7px; pointer-events: none; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  .seek::-webkit-slider-thumb, .seek::-moz-range-thumb {
          appearance: none; -webkit-appearance: none; height: 0; width: 0;
          background: transparent; border: none; cursor: pointer; }
  .sv { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .subwrap { position: relative; }
  .subpanel { position: absolute; bottom: calc(100% + 12px); right: -10px; width: 400px; max-width: 82vw;
              max-height: 55vh; overflow: auto; background: rgba(10,10,10,.96); border: 1px solid rgba(255,255,255,.25);
              padding: 10px 12px; display: none; z-index: 20; }
  .subpanel.open { display: block; }
  .subpanel h4 { margin: 8px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); font-weight: 600; }
  .subpanel h4:first-child { margin-top: 0; }
  .subrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer; font-size: 13px;
            color: var(--text); border: 1px solid transparent; }
  .subrow:hover { background: var(--panel2); }
  .subrow.active { border-color: var(--line-hi); background: var(--panel2); }
  .subrow .flag { font-size: 16px; flex-shrink: 0; }
  .subrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subrow .dl { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .subpanel .empty { color: var(--muted); font-size: 12px; padding: 4px 8px; }
  .substyle { display: flex; flex-direction: column; gap: 8px; padding: 2px 8px 10px; }
  .substyle label { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .substyle label span { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .substyle input[type=range] { flex: 1; height: 8px; appearance: none; -webkit-appearance: none;
            background: linear-gradient(to right, #fff var(--val, 50%), #555 0); cursor: pointer;
            border: none; outline: none; }
  .substyle input[type=range]::-webkit-slider-thumb, .substyle input[type=range]::-moz-range-thumb {
            appearance: none; -webkit-appearance: none; height: 0; width: 0; background: transparent; border: none; }

  /* subtitle sync overlay: time-scaled subtitle timeline on the right edge */
  .subsync { position: absolute; top: 0; right: 0; bottom: 48px; width: min(420px, 86vw); z-index: 8;
             display: flex; flex-direction: column;
             background: linear-gradient(to left, rgba(10,10,10,.94), rgba(10,10,10,.8));
             border-left: 1px solid rgba(255,255,255,.16); }
  .ss-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
  .ss-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .ss-delay { margin-left: auto; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ss-mini { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--text);
             font-size: 11px; padding: 3px 10px; flex-shrink: 0; }
  .ss-mini:hover { border-color: #fff; color: #fff; }
  .ss-scrollwrap { position: relative; flex: 1; min-height: 0; }
  .ss-list { position: absolute; inset: 0; overflow-y: auto; touch-action: none;
             user-select: none; -webkit-user-select: none;
             scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
  .ss-list::-webkit-scrollbar { width: 8px; }
  .ss-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); border-radius: 4px; }
  .ss-list::-webkit-scrollbar-track { background: transparent; }
  .ss-track { position: relative; }
  .ss-empty { color: var(--muted); font-size: 12px; padding: 24px 18px; }
  .ss-line { position: absolute; left: 8px; right: 26px; display: flex; gap: 9px; align-items: flex-start;
             padding: 4px 8px; font-size: 12.5px; line-height: 1.35; color: #fff; opacity: .35;
             cursor: grab; transition: opacity .18s ease; border-radius: 3px; }
  .ss-line:hover { opacity: .7; }
  .ss-line.near { opacity: .55; }
  .ss-line.on { opacity: 1; background: rgba(255,255,255,.09); }
  .ss-t { flex-shrink: 0; width: 46px; color: var(--muted); font-size: 10px; padding-top: 2.5px;
          font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .ss-line.on .ss-t { color: rgba(255,255,255,.85); }
  .ss-x { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
          overflow: hidden; min-width: 0; }
  .ss-cursor { position: absolute; left: 6px; right: 18px; height: 0; border-top: 2px solid #fff;
               z-index: 3; pointer-events: none; box-shadow: 0 1px 5px rgba(0,0,0,.65); }
  .ss-pill { position: absolute; right: 0; top: -12px; background: #fff; color: #000; font-size: 10.5px;
             font-weight: 700; padding: 3px 7px; border-radius: 3px; font-variant-numeric: tabular-nums;
             letter-spacing: .4px; user-select: none; -webkit-user-select: none; }
  .sv svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .vl { width: 70px; height: 5px; appearance: none; -webkit-appearance: none;
        background: linear-gradient(to right, #fff var(--val, 0%), #555 0); cursor: pointer;
        border: none; outline: none; }
  .vl::-webkit-slider-thumb, .vl::-moz-range-thumb {
        appearance: none; -webkit-appearance: none; height: 0; width: 0;
        background: transparent; border: none; cursor: pointer; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- watch party ---------- */
  #btn-party.on { border-color: var(--ok); }
  #btn-party.on svg { stroke: var(--ok); }
  .pt-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 420px; max-width: 560px; }
  .pt-join { display: flex; gap: 8px; }
  .pt-join input { flex: 1; min-width: 0; background: var(--panel2); border: 0.5px solid var(--line);
                    color: var(--text); padding: 8px 10px; font: inherit; font-size: 13px; }
  .pt-hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .pt-head { display: flex; flex-direction: column; gap: 2px; }
  .pt-head .t { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt-conn { color: var(--muted); font-size: 12px; }
  .pt-conn.ok { color: var(--ok); }
  .pt-conn.err { color: var(--warn); }
  .pt-invite { display: flex; gap: 8px; }
  .pt-invite input { flex: 1; min-width: 0; background: var(--panel2); border: 0.5px solid var(--line);
                     color: var(--muted); padding: 8px 10px; font: 12px ui-monospace, monospace; }
  .pt-roster { gap: 6px; }
  .pt-roster .row { padding: 7px 12px; min-height: 0; }
  .pt-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-hi); flex-shrink: 0; }
  .pt-row .dot.ok { background: var(--ok); }
  .pt-row.wait .dot { background: var(--warn); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .pt-row .nm { flex: 1; min-width: 0; }
  .pt-row .nm .t { font-size: 13.5px; }
  .pt-row .nm .s { color: var(--muted); font-size: 11.5px; }
  .pt-row .nm .you { color: var(--muted); font-weight: 400; }
  .pt-row .pt-pos { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pt-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .ppwrap .subpanel { width: 380px; }
  .ppwrap .subpanel.open { display: flex; flex-direction: column; gap: 8px; }
  .ppwrap .pt-invite input { font-size: 10px; }
  .ppwrap .pt-conn { font-size: 11px; }
</style>

<div class="floats">
  <button class="btn primary" id="btn-add"><svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg>Add</button>
  <button class="btn" id="btn-party" title="Watch party"><svg viewBox="0 0 24 24"><use href="#ic-users"/></svg>Party</button>
  <button class="btn" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg>Settings</button>

</main>

<main id="view-movie" hidden>
  <button class="back" id="btn-back">← Library</button>
  <div class="movie-head">
    <div class="bigposter" id="mv-poster"></div>
    <div class="mv-info">
      <h1 id="mv-title"></h1>
      <div class="sub" id="mv-sub"></div>

        <button class="ss-mini" id="ss-close" title="Close (the sync is kept)">Done</button>

      <div class="ss-scrollwrap">
        <div class="ss-list" id="ss-list">
          <div class="ss-cursor" id="ss-cursor" hidden><span class="ss-pill" id="ss-pill">0:00</span></div>

    </div>
    <button class="pback" id="pback" title="Back">← Back</button>
    <div class="ctrl" id="ctrl">
      <div class="strip">

          <svg id="ppicon" viewBox="0 0 24 24"><use href="#ic-play"/></svg>
        </button>
        <div class="tm" id="tm">0:00 / 0:00</div>
        <div class="skwrap"><input class="seek" id="seekbar" type="range" min="0" max="1000" value="0"><div class="sktip" id="seektth" hidden></div></div>

          <svg id="vicon" viewBox="0 0 24 24"><use href="#ic-vol-hi"/></svg>
          <input class="vl" id="volbar" type="range" min="0" max="100" value="100">
          <div class="subwrap ppwrap">
            <button class="pb" id="partybtn" title="Watch party">
              <svg viewBox="0 0 24 24"><use href="#ic-users"/></svg>
            </button>
            <div class="subpanel" id="partypop"></div>
          </div>
          <div class="subwrap">
            <button class="pb" id="subsbtn" title="Subtitles">
              <svg viewBox="0 0 24 24"><use href="#ic-subs"/></svg>

          <button class="pb" id="fsbtn" title="Fullscreen">

<script>
const $ = (id) => document.getElementById(id);
const v = $('player');
const wrap = $('videowrap');
var items = [], currentId = null, seeking = false, currentMovie = null, pollBusy = 0, dlState = {};
var searchResults = [], curRep = null, searchPending = new Map(), pendingRows = new Map();
let fullDur = 0; // declared here; player session state lives with the player below
var libSel = -1, mvSelIdx = -1;

const TMDB_IMG = 'https://image.tmdb.org/t/p';
const POSTER_IDX = 'w342';
const POSTER_MD = 'w500';

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
}

function confirmBox(msg, yesLabel) {
  return new Promise((resolve) => {
    $('cf-msg').textContent = msg;
    $('cf-yes').textContent = yesLabel || 'Delete';
    $('confirm-modal').hidden = false;
    function done(v) {
      $('confirm-modal').hidden = true;
      $('cf-yes').onclick = null;
      $('cf-no').onclick = null;
      $('cf-cancel').onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    $('cf-yes').onclick = () => done(true);
    $('cf-no').onclick = () => done(false);
    $('cf-cancel').onclick = () => done(false);
    document.addEventListener('keydown', onKey);
  });
}

/* ---------- library grouping & grid ---------- */
function groupKey(it) {
  return it.tmdb_id ? (it.media_type || 'movie') + ':' + it.tmdb_id : 'r' + it.id;
}
function groupItems(list) {
  const g = new Map();
  for (const it of list) {
    const k = groupKey(it);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(it);
  }
  return g;
}
function posterURL(p, size) { return TMDB_IMG + '/' + size + p; }
function placeholder(phText) { return '<div class="ph">' + phText + '</div>'; }
function posterTag(src) { return '<img loading="lazy" src="' + src + '" alt="" onerror="this.onerror=null;this.outerHTML=placeholder(\'▷\')">'; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function movieName(it) {
  if (it.title) return it.title;
  if (it.magnet) return it.magnet.slice(0, 40);
  return 'Movie';
}
function movieYear(it) {
  if (it.year) return String(it.year);
  if (it.magnet) { const m = it.magnet.match(/20\d{2}/); return m ? m[0] : ''; }
  return '';
}
function kindLabel(it) { return it.tmdb_id ? (it.media_type === 'tv' ? 'TV' : 'Movie') : ''; }

function movieRep(rows) {
  return rows.find(r => r.tmdb_id && !r.magnet) || rows.find(r => r.tmdb_id) || rows[0];
}
function infoHash(mag) {
  const m = (mag || '').match(/btih:([0-9a-fA-F]{40})/);
  return m ? m[1].toLowerCase() : null;
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const g = groupItems(items);
  for (const [k, rows] of g) {
    const rep = movieRep(rows);
    const card = document.createElement('div');
    card.className = 'card';
    const count = rows.filter(r => r.magnet).length;
    const posterHtml = rep.poster_path
      ? posterTag(posterURL(rep.poster_path, POSTER_IDX))
      : placeholder('▷');
    card.innerHTML =
      '<div class="poster">' + posterHtml + '</div>' +
      (count ? '<span class="badge">' + count + '</span>' : '') +
      '<div class="meta"><div class="t">' + esc(movieName(rep)) + '</div>' +
      '<div class="y">' + esc(movieYear(rep)) + (kindLabel(rep) ? ' · ' + kindLabel(rep) : '') + '</div></div>';
    card.onclick = () => openMovie(k);
    grid.appendChild(card);
  }
  libHighlight();
}

function renderPieceBar(bar, have, total) {
  if (!bar) return;
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  let html = '';
  for (let b = 0; b < n; b++) {
    const start = b * per, end = Math.min(total, start + per);
    let c = 0;
    for (let i = start; i < end; i++) if (have[i]) c++;
    const f = (end - start) ? c / (end - start) : 0;
    html += '<b style="background:' + (f > 0 ? (f >= 1 ? '#3ddc97' : 'rgba(61,220,151,' + (0.15 + f * 0.8).toFixed(2) + ')') : 'transparent') + '"></b>';
  }
  bar.innerHTML = html;
}

function piecesToPct(p) {
  let have = [], total = 0, overall = null;
  if (p && p.total) {
    have = p.have; total = p.total;
    let got = 0;
    for (const b of have) if (b) got++;
    overall = (got / total) * 100;
  }
  return { have, total, pct: overall };
}

function applyDlRow(row, id, p, s) {
  const st = row.dataset.state;
  const { have, total, pct: opct } = piecesToPct(p);
  const pct = opct !== null ? opct : Math.max(0, Math.min(100, s.progress_pct || 0));
  const dl = row.querySelector('.dl');
  dl.hidden = false;
  renderPieceBar(dl.querySelector('.bar'), have, total);
  let text;
  if (st === 'paused') {
    text = 'Paused · ' + Math.round(pct) + '%';
  } else {
    const speed = s.download_speed_bps || 0;
    const remain = (s.total_bytes || 0) - (s.contiguous_bytes || 0);
    const eta = speed > 0 ? remain / speed : null;
    text = Math.round(pct) + '% · ' + fmtSpeed(speed) + (eta !== null ? ' · ETA ' + fmtEta(eta) : '');
  }
  dlState[id] = { pct, text, have, total };
  dl.querySelector('.txt').textContent = text;
}

async function warmDl(id) {
  try {
    const s = await api('/api/library/' + id + '/status');
    const p = await api('/api/library/' + id + '/pieces');
    const row = document.querySelector('#mv-torrents .row[data-id="' + id + '"]');
    if (row && row.dataset.state === 'paused') applyDlRow(row, id, p, s);
  } catch (e) { /* torrent may be gone; keep row as-is */ }
}

async function refreshLibrary() {
  try {
    let srv = await api('/api/library');
    for (const [pid, syn] of pendingRows) {
      const isLive = srv.some(i => infoHash(i.magnet) === infoHash(syn.magnet));
      if (!isLive) srv.push(syn);
    }
    items = srv;
    renderGrid();
    syncMovie();
    renderSearch();
    if (!bootRouted) { bootRouted = true; handleRoute(); }
  }
  catch (e) { console.error('refresh failed', e); }
}

function setView(isMovie) {
  $('view-library').hidden = isMovie;
  $('view-movie').hidden = !isMovie;
  $('btn-add').hidden = isMovie;
}

function syncMovie() {
  if (!currentMovie) return;
  currentMovie.rows = groupItems(items).get(currentMovie.key) || [];
  if (!currentMovie.rows.length) {
    currentMovie = null;
    setView(false);
  } else {
    renderMovie();
  }
}

/* ---------- movie detail page ---------- */
function openMovie(k, push = true) {
  const rows = groupItems(items).get(k) || [];
  if (!rows.length) return;
  currentMovie = { key: k, rows };
  dlState = {};
  setView(true);
  if (push) pushRoute(movieRoute());
  if (push) pushRoute(movieRoute());
  mvSelIdx = -1;
  $('mv-results').innerHTML = '';
  window.scrollTo(0, 0);
  renderMovie();
  const rep = movieRep(rows);
  if (rep.tmdb_id) findTorrents(rep);
}

const IC_PLAY = '<svg viewBox="0 0 24 24"><use href="#ic-play"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24"><use href="#ic-pause"/></svg>';
const IC_BIN = '<svg viewBox="0 0 24 24"><use href="#ic-bin"/></svg>';

function icBtn(inner, cls, onclick) {
  const b = document.createElement('button');
  b.className = 'ibtn' + (cls ? ' ' + cls : '');
  b.innerHTML = inner;
  b.onclick = onclick;
  b.title = cls || '';
  return b;
}

function renderMovie() {
  const rows = currentMovie.rows;
  const rep = movieRep(rows);
  const poster = $('mv-poster');
  poster.innerHTML = rep.poster_path
    ? posterTag(posterURL(rep.poster_path, POSTER_MD))
    : placeholder('▷');
  $('mv-title').textContent = movieName(rep);
  $('mv-sub').textContent = [movieYear(rep), kindLabel(rep)].filter(Boolean).join(' · ') || ' ';

  const list = $('mv-torrents');
  const torrentRs = rows.filter(r => r.magnet);
  // Update rows in place so the same DOM node transitions between states
  // (adding → downloading → ready) without a rebuild flash. Row boxes stay
  // the same height; only the inside content changes.
  const empty = list.querySelector('.empty');
  if (!torrentRs.length) {
    if (!empty) list.innerHTML = '<div class="empty" style="padding:12px 0">No content</div>';
  } else {
    if (empty) empty.remove();
    const existing = {};
    for (const el of list.querySelectorAll(':scope > .row')) existing[el.dataset.id] = el;
    const keep = new Set();
    for (const t of torrentRs) {
      keep.add(String(t.id));
      let el = existing[t.id];
      if (!el) {
        el = document.createElement('div');
        el.dataset.id = t.id;
        list.appendChild(el);
      }
      renderTorrentRow(el, t);
    }
    for (const id in existing) if (!keep.has(id)) existing[id].remove();
  }

  const sec = $('mv-searchsec');
  sec.hidden = !rep.tmdb_id;
  mvSyncSel();
}

function renderTorrentRow(el, t) {
  el.className = 'row';
  el.dataset.state = t.state || '';
  const isDown = t.state === 'downloading';
  const isPaused = t.state === 'paused';
  el.innerHTML =
    '<div class="nm"><div class="t">' + esc(t.title || t.magnet) + '</div>' +
    '<div class="dl"><div class="bar"></div><div class="txt"></div></div></div>';
  const bar = el.querySelector('.bar');
  const txt = el.querySelector('.txt');
  const done = t.state === 'ready';
  bar.style.display = done ? 'none' : '';
  if (isDown && dlState[t.id]) {
    renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
    txt.textContent = dlState[t.id].text;
  } else if (isDown) {
    txt.textContent = 'Starting…';
  } else if (t.state === '_pending' || t.state === 'connecting') {
    txt.textContent = 'Adding…';
  } else if (done) {
    txt.textContent = 'Ready';
  } else if (isPaused) {
    if (dlState[t.id]) {
      renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
      txt.textContent = dlState[t.id].text;
    } else {
      txt.textContent = 'Paused';
      warmDl(t.id);
    }
  } else if (t.state === 'error') {
    txt.textContent = 'Failed';
  } else {
    txt.textContent = 'Stopped';
  }
  const canPlay = t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'error';
  el.style.cursor = canPlay ? 'pointer' : 'default';
  el.onclick = (e) => {
    if (!canPlay) return;
    if (e.target.closest('button, label, input, a')) return;
    playTorrent(t);
  };
  if (isDown) {
    const pr = document.createElement('button');
    pr.className = 'ibtn'; pr.innerHTML = IC_PAUSE;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/pause', { method: 'POST' }); }
      catch (e) { console.error('pause failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  } else if (isPaused) {
    const pr = document.createElement('button');
    pr.className = 'ibtn primary'; pr.innerHTML = IC_PLAY;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/resume', { method: 'POST' }); }
      catch (e) { console.error('resume failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  }
  const del = document.createElement('button');
  del.className = 'ibtn danger'; del.innerHTML = IC_BIN;
  del.onclick = () => delItem(t);
  el.appendChild(del);
  const ptBtn = document.createElement('button');
  ptBtn.className = 'ibtn';
  ptBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-users"/></svg>';
  ptBtn.title = 'Watch party';
  ptBtn.onclick = (e) => {
    e.stopPropagation();
    if (party && party.item_id === t.id) openPartyModal();
    else partyCreate(t.id);
  };
  el.appendChild(ptBtn);
  if (t.state !== '_pending' && t.state !== 'connecting') {
    const seq = document.createElement('label');
    seq.className = 'seq'; seq.title = 'Download pieces in order';
    const box = document.createElement('input');
    box.type = 'checkbox'; box.checked = t.sequential !== false;
    seq.appendChild(box);
    seq.appendChild(document.createTextNode('SEQ'));
    box.onchange = async () => {
      box.disabled = true;
      try {
        await api('/api/library/' + t.id + '/sequential', {
          method: 'POST',

        });

    };

  }
}

async function delItem(t) {
  if (t.state === '_pending') {
    // Cancelling an optimistic add: drop it locally, no server call.
    const syn = pendingRows.get(t.id);
    if (syn && syn.abort) syn.abort();
    pendingRows.delete(t.id);
    items = items.filter(i => i.id !== t.id);
    syncMovie();
    renderSearch();
    return;
  }
  if (!(await confirmBox('Remove this torrent and delete all of its files?'))) return;
  try { await api('/api/library/' + t.id, { method: 'DELETE' }); }
  catch (e) { console.error('delete failed', e); }
  refreshLibrary();
}

$('mv-del').addEventListener('click', async () => {
  if (!(await confirmBox('Delete this movie and all of its contents from the library?'))) return;
  const rep = movieRep(currentMovie.rows);
  if (rep) {
    // Cancel any in-flight optimistic adds for this movie first.
    const dropPids = [], dead = [];
    for (const [pid, syn] of pendingRows) {
      if (rep.tmdb_id && syn.tmdb_id && syn.tmdb_id === rep.tmdb_id) {
        dropPids.push(pid);
        if (syn.abort) syn.abort();
        dead.push(pid);
      }
    }
    for (const pid of dropPids) pendingRows.delete(pid);
    items = items.filter(i => !dead.includes(i.id));
    try { await api('/api/library/' + rep.id + '?hard=1', { method: 'DELETE' }); }
    catch (e) { console.error('movie delete failed', e); }
    renderSearch();
  }
  if (currentId !== null) stopPlayback();
  currentMovie = null;
  setView(false);
  refreshLibrary();
});

let findSeq = 0;
async function findTorrents(rep) {
  const seq = ++findSeq;
  const box = $('mv-results');
  box.innerHTML = '<div class="empty" style="padding:10px 0">Searching…</div>';
  try {
    const res = await api('/api/torrents?q=' + encodeURIComponent(rep.title || ''));
    if (seq !== findSeq) return;   // a newer search started — discard stale results
    searchResults = res;
    curRep = rep;
    renderSearch();
  } catch (e) {
    if (seq !== findSeq) return;
    searchResults = [];
    box.innerHTML = '<div class="empty" style="padding:10px 0">' + esc(e.message) + '</div>';
  }
}

function renderSearch() {
  const box = $('mv-results');
  if (!box) return;
  // Stale-response guard: `searchResults`/`curRep` are globals shared across
  // movies. Only render when the search belongs to the movie currently open
  // (otherwise refreshLibrary ticks + background fetches would dump the
  // previous movie's torrent links into this one's "Find torrents" box, and
  // clicking one would attach it to the wrong movie).
  const rep = currentMovie ? movieRep(currentMovie.rows) : null;
  if (!curRep || !rep || curRep.tmdb_id !== rep.tmdb_id) return;
  box.innerHTML = '';
  if (!searchResults.length) {
    box.innerHTML = '<div class="empty" style="padding:10px 0">No results from the indexer.</div>';
    return;
  }
  const addedHashes = new Set(items.filter(i => i.magnet).map(i => infoHash(i.magnet)).filter(Boolean));
  for (const t of searchResults) {
    const row = document.createElement('div');
    row.className = 'row';
    const sz = t.size_bytes ? fmtBytes(t.size_bytes) : '';
    const se = '<span class="se">' + (t.seeders || 0) + '</span> seeders / <span class="le">' + (t.leechers || 0) + '</span> leechers';
    row.innerHTML =
      '<div class="nm"><div class="t">' + esc(t.name) + '</div>' +
      '<div class="s">' + sz + (sz ? ' · ' : '') + se + '</div></div>';
    const add = document.createElement('button');
    const h = infoHash(t.magnet);
    const isAdded = addedHashes.has(h);
    const pending = searchPending.has(h);
    add.className = 'btn' + (isAdded || pending ? '' : ' primary');
    add.disabled = isAdded || pending;
    add.textContent = isAdded ? '✓ Added' : (pending ? 'Adding…' : 'Add');
    if (!isAdded && !pending) add.onclick = () => addTorrentFromSearch(t);
    row.appendChild(add);
    box.appendChild(row);
  }
  mvSyncSel();
}

async function addTorrentFromSearch(t) {
  const h = infoHash(t.magnet);
  if (!h || searchPending.has(h)) return;
  const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rep = curRep || {};
  const ctl = new AbortController();
  const syn = {
    id: pid, magnet: t.magnet, title: t.name, state: '_pending',
    tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null,
    poster_path: rep.poster_path || null, year: rep.year || null,
    size_bytes: t.size_bytes || 0, abort: ctl
  };
  searchPending.set(h, pid);
  pendingRows.set(pid, syn);
  items.push(syn);
  renderSearch();
  syncMovie();
  try {
    await api('/api/library', {
      method: 'POST',
      signal: ctl.signal,
      body: JSON.stringify({
        magnet: t.magnet,
        year: rep.year || null, poster_path: rep.poster_path || null,
        tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null
      })
    });
  } catch (e) {
    if (e.name !== 'AbortError') console.error('add failed', e);
    pendingRows.delete(pid);
    items = items.filter(i => i.id !== pid);
  } finally {
    searchPending.delete(h);
    pendingRows.delete(pid);
  }
  refreshLibrary();
}

/* ---------- MSE segment player ----------
 * One pipeline for every item state. The server splits the file (finished or
 * still-downloading, never re-encoded) into fragmented-MP4 segments; the
 * client appends them to a SourceBuffer and lets the <video> element drive
 * everything. Seeking is a plain v.currentTime write: instant when the data
 * is buffered, otherwise the pump fetches the segment containing the target
 * and playback resumes once it lands (live download frontier => real wait
 * with progress shown, never a dead session). */
const SEG_KEEP_BEHIND = 30;   // seconds of played media to keep buffered
const SEG_AHEAD = 60;         // seconds to keep buffered ahead of the playhead
let segAbort = null, segMs = null, segBlobUrl = null, segSb = null, segGen = 0;
let segInfo = null;           // { mime, done, segs: Map(n -> t) }
let segEosDone = false;
let appendsTotal = 0;
let resumeAt = 0;
// Uncovered seek target we must restore after the data lands. Browsers clamp
// currentTime writes to the seekable range; when the manifest had no duration
// (Infinity until endOfStream) the seekable range ends at the buffered edge,
// so a frontier-past seek would silently snap back and be lost.
let pendSeek = null;
let appendingSince = 0;
/* diagnostics: rolling pump trace, dumped to the console ONLY when buffering */
let pumpLog = [], lastAppendAt = 0, bufferingSince = 0;
function bufDump(kind) {
  const ranges = (b) => { const o = []; try { for (let i = 0; i < b.length; i++) o.push([+b.start(i).toFixed(2), +b.end(i).toFixed(2)]); } catch (e) {} return o; };
  let sbRanges = [], sbErr = null;
  try { sbRanges = ranges(segSb.buffered); sbErr = segSb && segSb.error ? segSb.error.name : null; } catch (e) {}
  console.warn('[ct] ' + kind, JSON.parse(JSON.stringify({
    at: new Date().toISOString(), time: +v.currentTime.toFixed(2), paused: v.paused,
    readyState: v.readyState, networkState: v.networkState,
    videoBuffered: ranges(v.buffered), sbBuffered: sbRanges, sbUpdating: segSb && segSb.updating, sbErr,
    seekable: ranges(v.seekable),
    msReady: segMs && segMs.readyState,
    manifest: segInfo && { done: segInfo.done, segments: segInfo.segs.size },
    appendsTotal,
    segForCurrentTime: (function () {
      if (!segInfo) return null;
      let found = null;
      for (const [n, t] of segInfo.segs) if (t <= v.currentTime + 0.3 && (!found || n > found.n)) found = { n, t };
      return found && { n: found.n, t: found.t, appended: timeCovered(found.t + 0.05) };
    })(),
    lastAppendAgoMs: lastAppendAt ? Date.now() - lastAppendAt : null,
    pump: window.__pump,
    recentPump: pumpLog.slice(-14),
    activeSub: activeSub,
    tracks: [...v.textTracks].map(t => ({ label: t.label.slice(0, 30), mode: t.mode })),
  })));
}

const segSleep = (ms) => new Promise(r => setTimeout(r, ms));

async function playTorrent(item) {
  stopPlayback();
  currentId = item.id;
  // Resume where this torrent file left off (per torrent, not per movie).
  resumeAt = Math.max(0, item.playhead || 0);
  if (currentMovie) pushRoute(movieRoute() + '/' + torrentSlug(item));
  if (currentMovie) pushRoute(movieRoute() + '/' + torrentSlug(item));
  $('player-modal').hidden = false;
  $('ctrl').style.display = 'block';
  showBuf('Loading…');
  try {
    await startSegSession();
  } catch (e) {
    if (e.name === 'AbortError') return;
    hideBuf();
    showBuf('Playback error: ' + e.message);
  }
}

async function startSegSession() {
  const gen = ++segGen;
  const id = currentId;
  segMs = new MediaSource();
  segBlobUrl = URL.createObjectURL(segMs);
  segAbort = new AbortController();
  segEosDone = false;
  appendsTotal = 0;

  await new Promise((res, rej) => {
    const timer = setTimeout(() => rej(new Error('MediaSource timed out')), 5000);
    segMs.addEventListener('sourceopen', () => { clearTimeout(timer); res(); }, { once: true });
    segMs.addEventListener('error', () => { clearTimeout(timer); rej(new Error('MediaSource failed')); }, { once: true });
    v.src = segBlobUrl;
  });
  if (gen !== segGen) return;

  // Manifest: MIME + duration + which segments exist. Poll until the first
  // segment is cut — for a still-downloading torrent that means waiting for
  // the head pieces, which is exactly the buffering we want to show.
  let info = null;
  for (;;) {
    if (gen !== segGen) return;
    try {
      info = await api('/api/library/' + id + '/stream');
    } catch (e) {
      throw new Error(String(e.message || e).includes('not found') ? 'Item is gone' : 'Server unreachable');
    }
    if (info.error) throw new Error(info.error);
    if (info.state === 'error') throw new Error('Torrent failed to download');
    if (info.mime && info.segments.length) break;
    await segSleep(500);
  }
  if (gen !== segGen) return;

  fullDur = (info.duration && isFinite(info.duration)) ? info.duration : 0;
  segInfo = { mime: info.mime, done: !!info.done, segs: new Map(info.segments.map(s => [s.n, s.t])) };

  try {
    segSb = segMs.addSourceBuffer(segInfo.mime);
  } catch (e) {
    segSb = segMs.addSourceBuffer('video/mp4; codecs="avc1.640028,mp4a.40.2"');
  }

  // Init segment (ftyp+moov); retry until the segmenter has written it.
  for (;;) {
    if (gen !== segGen) return;
    const init = await fetchSegBuf(id, 'init');
    if (init) {
      try { await appendBuf(init); } catch (e) { return segFatal(e); }
      break;
    }
    await segSleep(500);
  }
  if (gen !== segGen) return;
  // Fragmented MP4 has no embedded duration (it stays Infinity until
  // endOfStream) and Firefox clamps currentTime writes to the seekable range
  // — so pin the duration from the manifest, or mid-movie seeks silently
  // snap back to the buffered edge.
  if (fullDur) { try { segMs.duration = fullDur; } catch (e) {} }

  // Fire-and-forget, but never silently: a rejected pump/poller is a real
  // playback failure and must surface (an unhandled rejection would stall
  // invisibly at 'Loading…').
  manifestPoller(gen, id).catch(e => segFatal(e));
  pumpLoop(gen, id).catch(e => segFatal(e));
  // restore the playhead after a session recovery
  // Restore the saved playhead (or the recovery point). Goes through seekTo
  // so an undownloaded resume point shows the spinner and pendSeek kicks in.
  // In a watch party the party position wins: start where everyone is
  // (anchor), and if the party is paused don't auto-play on data arrival.
  if (partyPlayerActive() && partyAnchor) {
    partyHoldPlay = !partyAnchor.playing;
    if (partyAnchor.t > 0.5) seekTo(partyAnchor.t);
    resumeAt = 0;
  } else if (resumeAt > 0.5) { seekTo(resumeAt); resumeAt = 0; }
  // re-attach the active subtitle track for this item's new session
  if (activeSub && activeSub.id === currentId) applySubTrack();
}

// Debug hook: inspect live session state from the console.
window.__seg = () => ({
  gen: segGen, segInfo, appendsTotal,
  sbUpdating: segSb && segSb.updating,
  sbErr: segSb && segSb.error && segSb.error.name,
  msReady: segMs && segMs.readyState,
  vErr: v.error && (v.error.code + ' ' + v.error.message),
  pump: window.__pump,
  sb: segSb,
  vBufLen: v.buffered && v.buffered.length,
  sbBufLen: segSb && segSb.buffered && segSb.buffered.length,
  sbBuf: (() => { try { const b = segSb && segSb.buffered; return b && b.length ? [b.start(0), b.end(b.length-1)] : null; } catch (e) { return 'err'; } })(),
  vPaused: v.paused, vTime: v.currentTime,
});

async function manifestPoller(gen, id) {
  while (gen === segGen) {
    await segSleep(1000);
    if (gen !== segGen) return;
    // stuck-append watchdog: setInterval survives background-tab throttling
    // (unlike the 12s appendBuf timer), so recovery works even for a
    // backgrounded player
    if (appendingSince && segSb && segSb.updating && Date.now() - appendingSince > 12000) {
      console.error('[ct] append stuck', Date.now() - appendingSince, 'ms — rebuilding session at playhead');
      await recoverSession();
      return;
    }
    let info = null;
    try {
      info = await api('/api/library/' + id + '/stream');
    } catch (e) { continue; }
    if (gen !== segGen) return;
    if (info.error) { segFatal(new Error(info.error)); return; }
    if (info.duration && isFinite(info.duration) && (!fullDur || info.duration > fullDur)) fullDur = info.duration;
    if (segInfo) {
      segInfo.done = !!info.done;
      for (const s of info.segments) segInfo.segs.set(s.n, s.t);
    }
    if (!fullDur && info.duration && isFinite(info.duration)) {
      fullDur = info.duration;
      if (segMs) { try { segMs.duration = fullDur; } catch (e) {} }
    }
  }
}

/* Is media time `t` actually covered by the SourceBuffer? The pump trusts
 * ONLY this — browsers (Firefox) may silently evict buffered-ahead data, so
 * "we appended it earlier" means nothing. */
function timeCovered(t) {
  try {
    const b = segSb.buffered;
    for (let i = 0; i < b.length; i++) {
      if (t >= b.start(i) - 0.05 && t <= b.end(i) + 0.05) return true;
    }
  } catch (e) {}
  return false;
}

/* Full session rebuild at the current playhead — used by the poller watchdog
 * when an append never completes (Firefox can wedge SourceBuffer.updating).
 * Capped at 3 attempts per minute; past that we stop trying and leave the
 * diagnostics in the console. */
let recoveries = [];
async function recoverSession() {
  const now = Date.now();
  recoveries = recoveries.filter(r => now - r < 60000);
  if (recoveries.length >= 3) {
    console.error('[ct] recovery attempted 3x in the last minute — giving up (see [ct] dumps above)');
    return;
  }
  recoveries.push(now);
  const t = v.currentTime || 0;
  showBuf('Recovering…');
  segGen++;                 // invalidate old loops
  teardownSeg();
  resumeAt = t;
  await startSegSession();
}

async function pumpLoop(gen, id) {
  let firstPlay = true;
  window.__pump = { stage: 'start', n: 0, at: Date.now() };
  const mark = (stage, n) => {
    window.__pump.stage = stage; window.__pump.n = n || 0; window.__pump.at = Date.now();
    pumpLog.push({ at: Date.now(), stage, n: n || 0 });
    if (pumpLog.length > 14) pumpLog.shift();
  };
  while (gen === segGen) {
    const anchor = pendSeek != null ? pendSeek : (v.currentTime || 0);
    const want = [];
    const arr = [...segInfo.segs.entries()].sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < arr.length; i++) {
      const [n, t] = arr[i];
      // The last existing segment's true end is unknown until its successor
      // is cut. NEVER let it span to fullDur: on a live torrent that phantom
      // range "covers" any seek target past the frontier, so the pump would
      // re-append the frontier segment forever (hammering hideBuf and killing
      // the buffering overlay). Segments are cut at ~10-20s; 60s is a safe
      // ceiling for the estimate.
      const end = i + 1 < arr.length
        ? arr[i + 1][1]
        : (segInfo.done ? (fullDur || t + 60) : t + 60);
      // A segment is wanted when it OVERLAPS the playhead window AND the
      // SourceBuffer does not actually cover it (evicted / never appended /
      // partially dropped).
      if (t >= anchor + SEG_AHEAD || end <= anchor - 2) continue;
      const cEnd = Math.min(end, anchor + SEG_AHEAD);
      if (timeCovered(t + 0.05) && timeCovered(cEnd - 0.05)) continue;
      want.push([n, t]);
    }

    let appended = false;
    for (const [n] of want) {
      if (gen !== segGen) return;
      mark('fetching', n);
      const buf = await fetchSegBuf(id, 'seg/' + n);
      if (gen !== segGen) return;
      if (buf === null) { mark('404', n); break; } // vanished? treat as frontier, poller refills
      mark('appending', n);
      appendingSince = Date.now();
      try {
        await appendBuf(buf);
      } catch (e) { mark('append-error', n); return segFatal(e); }
      appendingSince = 0;
      mark('appended', n);
      appendsTotal++;
      lastAppendAt = Date.now();
      appended = true;
    }
    if (!appended) {
      mark('idle', 0);
      // starved silently? playhead at the buffered edge, nothing appended for
      // 15s while we should be fetching -> dump context (no spinner logic here,
      // just diagnostics)
      const be = (() => { try { const b = sb.buffered; return b.length ? b.end(b.length - 1) : 0; } catch (e) { return 0; } })();
      if (!v.paused && be - v.currentTime < 10 && Date.now() - lastAppendAt > 15000
          && (!bufferingSince || Date.now() - bufferingSince > 15000)) {
        bufferingSince = bufferingSince || Date.now();
        bufDump('pump-starved');
      }
    }

    if (appended) {
      // Data is flowing again: never leave the party reporting "buffering"
      // because a transient starve flag was set. Only the playback-events
      // recovery path clears it otherwise, and that never fires when the
      // pump quietly catches up without an actual element stall.
      if (bufferingSince) {
        console.warn('[ct] pump recovered after ' + (Date.now() - bufferingSince) + ' ms');
        bufferingSince = 0;
      }
      // Target of a clamped seek now buffered? Re-issue it — the original
      // currentTime write snapped back to the buffered edge.
      if (pendSeek != null && timeCovered(pendSeek + 0.05)) {
        const t = pendSeek; pendSeek = null;
        try { v.currentTime = t; } catch (e) {}
      }
      // Never clear the spinner while the seek target still has no data.
      if (pendSeek == null) hideBuf();
      if (firstPlay) { firstPlay = false; if (v.paused && !partyHoldPlay) v.play().catch(() => {}); }
      continue;
    }

    await evictBehind();
    if (gen !== segGen) return;
    // End of movie: everything appended => close the stream.
    if (segInfo.done && !segEosDone && segInfo.segs.size && fullDur &&
        timeCovered(fullDur - 0.3)) {
      segEosDone = true;
      try { if (segMs.readyState === 'open') segMs.endOfStream(); } catch (e) {}
    }
    await segSleep(300);
  }
}

async function fetchSegBuf(id, name) {
  const r = await fetch('/mse/' + id + '/' + name, { signal: segAbort ? segAbort.signal : undefined });
  if (r.status === 404) return null;
  if (!r.ok) {
    console.error('[ct] segment fetch failed:', name, 'HTTP', r.status);
    throw new Error('Segment fetch failed (' + r.status + ')');
  }
  return await r.arrayBuffer();
}

function appendBuf(data) {
  return new Promise((resolve, reject) => {
    const sb = segSb;
    if (!sb) return reject(new Error('no SourceBuffer'));
    const arm = () => {
      const onEnd = () => { cleanup(); resolve(); };
      const onErr = () => {
        cleanup();
        const err = sb.error ? (sb.error.name + ': ' + (sb.error.message || '')) : '';
        reject(new Error('Append failed — your browser likely cannot decode this file. ' + err));
      };
      const cleanup = () => { sb.removeEventListener('updateend', onEnd); sb.removeEventListener('error', onErr); };
      sb.addEventListener('updateend', onEnd);
      sb.addEventListener('error', onErr);
      try { sb.appendBuffer(data); } catch (e) { cleanup(); reject(e); }
    };
    if (sb.updating) {
      const onUpd = () => { sb.removeEventListener('updateend', onUpd); arm(); };
      sb.addEventListener('updateend', onUpd);
    } else arm();
  });
}

function evictBehind() {
  return new Promise((res) => {
    const sb = segSb;
    if (!sb || sb.updating) return res();
    try {
      const b = sb.buffered;
      const cut = Math.max(0, (v.currentTime || 0) - SEG_KEEP_BEHIND);
      if (!b.length || b.start(0) >= cut) return res();
      const onEnd = () => { sb.removeEventListener('updateend', onEnd); res(); };
      sb.addEventListener('updateend', onEnd);
      sb.remove(b.start(0), cut);
    } catch (e) { res(); }
  });
}

function seekTo(globalT, partyOrigin) {
  if (fullDur && globalT > fullDur) globalT = fullDur;
  if (globalT < 0) globalT = 0;
  // A party-originated seek lands in an 'seeked' event we must not echo back
  // to the party (the 300ms partyApply guard expires long before an
  // un-buffered seek settles, so it cannot be relied on).
  if (partyOrigin && Math.abs(globalT - (v.currentTime || 0)) > 0.05) partyEcho.seek++;
  // Target buffered -> native seek, instant. Target NOT buffered (e.g. past
  // the download frontier) -> show the spinner RIGHT HERE, synchronously.
  // No browser event ever fires while a seek waits for data (pending seeks
  // don't emit 'waiting'), so we must not rely on one. The pump clears it
  // via hideBuf() once the data is appended and playback can continue.
  // pendSeek remembers the target in case the browser clamps the
  // currentTime write back to the buffered edge (unpinned duration); the
  // pump re-issues the seek when the target becomes buffered.
  if (timeCovered(globalT + 0.05)) {
    pendSeek = null;
    hideBuf();
  } else {
    pendSeek = globalT;
    showBufProgress();
  }
  savePlayhead(globalT);
  v.currentTime = globalT;
}

/* Persist the playback position for the current torrent (per torrent file,
 * not per movie). Fire-and-forget: called on every seek, on player close,
 * and with 0 when the movie ends. */
function savePlayhead(t) {
  if (currentId == null) return;
  const id = currentId;
  const it = items.find(i => i.id === id);
  if (it) it.playhead = t;
  api('/api/library/' + id + '/playhead', { method: 'POST', body: JSON.stringify({ t }) }).catch(() => {});
}

function segFatal(e) {
  stopPlayback();

function teardownSeg() {
  pendSeek = null;
  if (segAbort) { segAbort.abort(); segAbort = null; }
  if (segSb) { try { segSb.abort(); } catch (e) {} segSb = null; }
  if (segBlobUrl) { URL.revokeObjectURL(segBlobUrl); segBlobUrl = null; }
  segMs = null;
  segInfo = null;
  segEosDone = false;
  v.pause();
  v.removeAttribute('src');
  v.load();
  const ov = $('suboverlay');
  if (ov) { ov.hidden = true; ov.firstElementChild.textContent = ''; }
  subRenderStop();
}

function stopPlayback() {
  // Save where we stopped for this torrent (0 if it played to the end).

  const sp = $('subpanel'); if (sp) sp.classList.remove('open');

}

function updSeek() {

function seekSegGradient(have, total) {
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  const stops = [];
  for (let i = 0; i < n; i++) {
    let c = 0;
    for (let j = 0; j < per && i * per + j < total; j++) if (have[i * per + j]) c++;
    const a = Math.max(0, ((i * per) / total) * 100);
    const b = Math.min(100, ((i * per + Math.min(per, total - i * per)) / total) * 100);
    if (c > 0) {
      const f = c / per;
      const col = 'rgba(255,255,255,' + (0.22 + 0.28 * f).toFixed(2) + ')';
      stops.push(col + ' ' + a.toFixed(2) + '%', col + ' ' + b.toFixed(2) + '%');
    } else {
      stops.push('transparent ' + a.toFixed(2) + '%', 'transparent ' + b.toFixed(2) + '%');
    }
  }
  return 'linear-gradient(to right, ' + stops.join(', ') + ')';
}

let lastSkKey = null;
function updSk() {
  const el = $('seekbar');
  const it = currentId != null ? items.find(i => i.id === currentId) : null;
  let have = null, total = 0, rdy = false;
  if (it && it.state === 'ready') { rdy = true; }
  else if (it && dlState[currentId] && dlState[currentId].total) {
    have = dlState[currentId].have;
    total = dlState[currentId].total;
  }
  const key = currentId + ':' + (rdy ? 'ready' : (have ? total + ':' + have.join('') : 'none'));
  if (key === lastSkKey) return;
  lastSkKey = key;
  let avail;
  if (rdy) avail = 'linear-gradient(to right, rgba(255,255,255,.35) 0%, rgba(255,255,255,.35) 100%)';
  else if (have) avail = seekSegGradient(have, total);
  else avail = null;
  el.style.backgroundImage =
    'linear-gradient(to right, rgba(255,255,255,.85) 0, rgba(255,255,255,.85) var(--val), transparent var(--val))' +
    (avail ? ', ' + avail : '');
}

/* Subtitles are drawn by us (not the browser) so the bottom offset can move in
 * pixels and continuously in every browser. The track stays "hidden" and we
 * mirror its active cues into an absolutely-positioned overlay. */
function subTrack() {
  for (const t of v.textTracks) if (t.kind === 'subtitles') return t;
  return null;
}
function applySubPosition() {
  const ov = $('suboverlay');
  if (!ov) return;
  const ew = v.clientWidth, eh = v.clientHeight;
  const vw = v.videoWidth, vh = v.videoHeight;
  let left = 0, width = ew, letterbox = 0, height = eh;
  if (vw && vh) {
    const s = Math.min(ew / vw, eh / vh);
    width = vw * s; height = vh * s; left = (ew - width) / 2; letterbox = (eh - height) / 2;
  }
  ov.style.right = 'auto';
  ov.style.left = left + 'px';
  ov.style.width = width + 'px';
  ov.style.bottom = (letterbox + subStyle.bottom / 100 * height) + 'px';
  const span = ov.firstElementChild;
  if (span) span.style.fontSize = Math.max(8, height * 0.05 * subStyle.size / 100) + 'px';
}
/* Subtitle rendering is fully ours: the track's cue times stay ORIGINAL,
 * the sync offset lives only in ssDelay, and the active set is recomputed
 * from (original times + ssDelay) on every call. Never shift VTTCue
 * startTime/endTime in place — engines re-sort the cue list when times
 * change, so a pass over the list skips cues and leaves them stuck at an
 * older offset (stale lines piling up under the current one). A key gate
 * keeps the rAF path DOM-free when nothing changed. */
let subLastKey = '', subRaf = 0;
function renderActiveCues() {
  const ov = $('suboverlay');
  if (!ov) return;
  const span = ov.firstElementChild;
  const tr = subTrack();
  const cues = tr && tr.cues;
  if (!cues || !cues.length) {
    if (subLastKey !== '') { ov.hidden = true; span.textContent = ''; subLastKey = ''; }
    return;
  }
  const t = v.currentTime || 0;
  const active = [];
  let key = '';
  for (let i = 0; i < cues.length; i++) {
    const c = cues[i];
    if (c.startTime + ssDelay <= t && t < c.endTime + ssDelay) { active.push(c); key += i + ';'; }
  }
  if (key === subLastKey) return;
  subLastKey = key;
  span.textContent = '';
  for (let i = 0; i < active.length; i++) {
    if (i) span.appendChild(document.createElement('br'));
    try { span.appendChild(active[i].getCueAsHTML()); }
    catch (e) { span.appendChild(document.createTextNode(active[i].text)); }
  }
  ov.hidden = !active.length;
  if (active.length) applySubPosition();
}
function subRenderStart() {
  if (subRaf) return;
  const tick = () => { subRaf = requestAnimationFrame(tick); renderActiveCues(); };
  subRaf = requestAnimationFrame(tick);
}
function subRenderStop() { cancelAnimationFrame(subRaf); subRaf = 0; subLastKey = ''; }
function applySubStyle() { applySubPosition(); renderActiveCues(); }
v.addEventListener('timeupdate', renderActiveCues);
v.addEventListener('seeked', renderActiveCues);
v.addEventListener('loadedmetadata', applySubPosition);
window.addEventListener('resize', applySubPosition);

function bindSubStyleInputs() {
  const size = $('subsize'), bottom = $('subbottom');
  const paint = (el) => el.style.setProperty('--val', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
  const sync = () => {
    subStyle.size = +size.value; subStyle.bottom = +bottom.value;
    $('subsizeval').textContent = (Math.round(subStyle.size * 10) / 10) + '%';
    $('subbottomval').textContent = (Math.round(subStyle.bottom * 10) / 10) + '%';
    paint(size); paint(bottom);
    applySubStyle();
    saveSubStyle();
  };
  size.addEventListener('input', sync);
  bottom.addEventListener('input', sync);
  paint(size); paint(bottom);
}

async function onSubRowClick(row) {
  if (row.dataset.none) {
    disableSub();
    renderSubPanel();
    return;
  }
  if (subBusy) return;
  if (row.dataset.local) {
    const name = row.dataset.name;
    if (activeSub && activeSub.name === name) disableSub();
    else enableSub(name);
    renderSubPanel();
    return;
  }
  const fileid = row.dataset.fileid;
  subBusy = true; renderSubPanel();
  try {
    const added = await api('/api/library/' + currentId + '/subs/download', { method: 'POST', body: JSON.stringify({ file_id: fileid }) });
    if (!subsLocal.some(x => x.name === added.name)) {
      subsLocal.push({ name: added.name, lang: added.lang, flag: added.flag, source: 'downloaded' });
    }
    enableSub(added.name);
  } catch (e) { console.error('sub download failed', e); }
  subBusy = false; renderSubPanel();
}

function enableSub(name) {

function applySubTrack() {
  // drop existing subtitle tracks
  v.querySelectorAll('track').forEach(t => t.remove());

    if (ssVisible()) ssToggle(false);
    subRenderStop();
    renderActiveCues();

  ssDelay = ssLoadDelay();
  const track = document.createElement('track');
  track.kind = 'subtitles';

  track.src = '/sub/' + currentId + '/' + encodeURIComponent(activeSub.name);

  const hook = (tr) => {

      tr.__subHooked = true;

    renderActiveCues();

  track.addEventListener('load', () => { hook(track.track); applySubPosition(); });

}
