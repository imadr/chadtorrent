  if (performance.now() - lastTU > 250) {
    lastTU = performance.now();
    v.dispatchEvent(new Event('timeupdate'));
  }
  pumpAudio();
  const playing = !P.paused && P.ctx && P.ctx.state === 'running';
  // 'flowing' = the master clock is advancing: audio scheduled ahead, or
  // (video-only) frames painting, or the audio-EOF wall tail running
  const flowing = playing && (
    P.noAudio ? (P.flow && performance.now() - P.flow < 1500)
              : (P.anchor && (P.anchor.ctx > P.ctx.currentTime + 0.02 || audioEnded())));
  if (playing && !flowing && !P.eof && !audioEnded()) {
    if (!wasWaiting) { wasWaiting = true; v.dispatchEvent(new Event('waiting')); }
  } else if (wasWaiting) {
    wasWaiting = false;
    v.dispatchEvent(new Event('playing'));
  }
  // pending seek: resolved once a decoded frame at/after the target exists
  // (the seek floor keeps everything older than target-0.35s out of vq, so
  // the first queued frame qualifies; the audio arm covers streams whose
  // video decode lags but whose clock already crossed the target)
  if (pendSeek != null
      && ((P.vq.length && P.vq[0].timestamp / 1e6 >= pendSeek - 0.4)
          || (P.anchor && P.anchor.media > pendSeek)
          || (P.eof && mediaNow() >= Math.min(pendSeek, (fullDur || Infinity) - 0.05)))) {
    pendSeek = null; pendSeekAt = 0; P.seekFloor = 0;
    v.dispatchEvent(new Event('seeked'));
  }
  // end of the stream: manifest complete, everything fed, everything played.
  // Video-only: no anchor, just all queues drained. With audio: everything
  // decoded AND sounded (audioEnded covers decode side, anchor.ctx the sound
  // side — during the video tail the wall clock has already drained vq).
  if (P.eof && !P.endedFired && !P.vq.length && !P.aq.length && P.chunksV.length === 0 && P.chunksA.length === 0
      && (P.noAudio || audioEnded())) {
    P.endedFired = true;
    v.dispatchEvent(new Event('ended'));
  }
}, 250);

async function refreshManifest(gen, id) {
  try {
    const info = await api('/api/library/' + id + '/stream' + segFileQ());
    if (gen !== segGen || !info || info.error) return;
    if (info.duration && isFinite(info.duration) && info.duration > fullDur) fullDur = info.duration;
    P.done = !!info.done;
    for (const s of info.segments) if (!P.segs.has(s.n)) P.segs.set(s.n, s.t);
    if (info.segments.length) P.segMaxN = info.segments[info.segments.length - 1].n;
  } catch (e) {}
}

/* Sequential feeder: fetch segment N, demux, queue chunks for the decoders.
 * Headroom caps keep decoded memory tiny (a couple of MB of frames), and the
 * lookahead keeps the fetch window SEG_AHEAD ahead of the playhead. */
async function feedLoop(gen, id) {
  // Decode audio first (it drives the clock), video when there is headroom,
  // and FETCH whenever the lookahead needs it — a full video queue must never
  // block fetching, or the audio runs dry, the clock pins, and the video
  // queue can never drain again (measured: session freezes ~45s in).
  // Batches per pass: after a seek the backlog is thousands of chunks and a
  // one-decode-per-pass loop re-runs every gate check per chunk for nothing.
  while (gen === segGen && P.id === id) {
    if (P.chunksA.length && P.aq.length < 700 && P.adec && P.adec.state === 'configured' && P.adec.decodeQueueSize < 80) {
      for (let i = 0; i < 64 && P.chunksA.length && P.aq.length < 700 && P.adec.decodeQueueSize < 80; i++) P.adec.decode(P.chunksA.shift());
      continue;
    }
    if (P.chunksV.length && P.vdec && P.vdec.state === 'configured' && P.vdec.decodeQueueSize < 32 && P.vq.length < SEG_MAX_VQ) {
      for (let i = 0; i < 32 && P.chunksV.length && P.vdec.decodeQueueSize < 32 && P.vq.length < SEG_MAX_VQ; i++) P.vdec.decode(P.chunksV.shift());
      continue;
    }
    const t = P.segs.get(P.fetchN);
    if (t === undefined) {
      if (P.done) {
        P.eof = true;
        // EOF ≠ stop demuxing work: the decode branches above must keep
        // running until every demuxed chunk is handed to a decoder — a movie
        // whose video outlasts its audio froze here with minutes of chunksA
        // undecoded (audio clock pinned, video tail unplayable, 'ended'
        // never fired). Only leave when there is nothing left to decode.
        if (!P.chunksA.length && !P.chunksV.length) return;
        await segSleep(100);
        continue;
      }
      await refreshManifest(gen, id);
      await segSleep(400);
      continue;
    }
    if (t >= mediaNow() + SEG_AHEAD) { await segSleep(200); continue; }
    const buf = await fetchSegBuf(id, 'seg/' + P.fetchN);
    if (gen !== segGen || P.id !== id) return;
    if (!buf) { await refreshManifest(gen, id); await segSleep(400); continue; }
    const ch = segToChunks(buf, parseSeg(buf, P.tracks));
    for (const c of ch.V) {
      if (P.needKey && !c.key) continue;
      P.needKey = false;
      P.chunksV.push(new EncodedVideoChunk({ type: c.key ? 'key' : 'delta', timestamp: c.ts, duration: c.durUs, data: c.data }));
    }
    for (const c of ch.A) {
      P.chunksA.push(new EncodedAudioChunk({ type: 'key', timestamp: c.ts, duration: c.durUs, data: c.data }));
    }
    const next = P.segs.get(P.fetchN + 1);
    P.fedUntil = next != null ? next : (P.done && fullDur ? fullDur : t + 60);
    P.fetchN++;
  }
}

function segContaining(t) {
  let n = 1, best = 1;
  for (const [k, st] of P.segs) {
    if (st <= t + 0.01 && k >= best) { best = k; n = k; }
  }
  return n;
}

/* The AudioContext must be born inside a user gesture. Creating it lazily in
 * startEngine (seconds after the row click, once the manifest and init
 * segment have been fetched) is outside Firefox's gesture window: resume()
 * is silently rejected, the clock pins, video freezes on one frame. So the
 * synchronous part of playTorrent — still inside the click handler — creates
 * and resumes it, and startEngine reuses whatever survived. */
function ensureCtx() {
  if (!P.ctx) {
    P.ctx = new (window.AudioContext || window.webkitAudioContext)();
    P.gain = P.ctx.createGain();
    P.gain.gain.value = P.muted ? 0 : P.vol;
    P.gain.connect(P.ctx.destination);
  }
  if (P.ctx.state === 'suspended') P.ctx.resume().catch(() => {});
  return P.ctx;
}

function playerPlay() {
  if (!P.id) return;
  ensureCtx();
  if (P.paused) { P.paused = false; v.dispatchEvent(new Event('play')); }
}
function playerPause() {
  if (P.ctx && P.ctx.state === 'running') P.ctx.suspend();
  if (!P.paused) { P.paused = true; v.dispatchEvent(new Event('pause')); }
}

async function startEngine() {
  const gen = ++segGen;
  const id = P.id;
  if (segAbort) segAbort.abort();
  segAbort = new AbortController();

  // Manifest: codecs + duration + which segments exist. Poll until the first
  // segment is cut — for a still-downloading torrent that means waiting for
  // the head pieces, which is exactly the buffering we want to show.
  let info = null;
  for (;;) {
    if (gen !== segGen || P.id !== id) return;
    try { info = await api('/api/library/' + id + '/stream' + segFileQ()); }
    catch (e) { throw new Error(String(e.message || e).includes('not found') ? 'Item is gone' : 'Server unreachable'); }
    if (info.error) throw new Error(info.error);
    if (info.state === 'error') throw new Error('Torrent failed to download');
    // A finished cut that never produced a codec string: the server could not
    // name the video codec honestly (exotic container codec with no browser
    // decoder) — fail clearly instead of looping forever.
    if (info.done && !info.mime) throw new Error('Unsupported codec: nothing in this file that the browser can decode');
    // A ready item's cache is re-cut on server start; joining mid-recut means
    // reading init/segments that are being rewritten (truncated chain, dead
    // session). Wait for the cut to finish; downloading items have no such
    // moment and use the frontier as always.
    const ready = ((items.find(i => i.id === id) || {}).state === 'ready');
    if (info.mime && info.segments.length && (info.done || !ready)) break;
    await segSleep(500);
  }
  if (gen !== segGen || P.id !== id) return;
  fullDur = (info.duration && isFinite(info.duration)) ? info.duration : 0;
  P.done = !!info.done;
  P.segs = new Map(info.segments.map(s => [s.n, s.t]));
  P.segMaxN = info.segments.length ? info.segments[info.segments.length - 1].n : 0;
  const codecs = parseMime(info.mime);

  // init segment: sample tables + codec description (hvcC/avcC/esds)
  let initBuf = null;
  for (;;) {
    if (gen !== segGen || P.id !== id) return;
    initBuf = await fetchSegBuf(id, 'init');
    if (initBuf) break;
    await segSleep(500);
  }
  if (gen !== segGen || P.id !== id) return;
  const trks = parseInit(initBuf);
  P.tracks = trks;
  const vtr = [...trks.values()].find(t => t.kind === 'video');
  const atr = [...trks.values()].find(t => t.kind === 'audio');
  if (!vtr) throw new Error('no video track');

  ensureCtx();
  P.nextAt = 0;
  P.wall = { ctx: P.ctx ? P.ctx.currentTime : 0, media: 0 };   // video-only master base

  // isConfigSupported lies for HEVC on Firefox (hangs / false-negatives) while
  // decodingInfo says supported — so configure candidates directly and treat a
  // sync throw or an async error callback as "this combination is not it".
  // Candidate codec strings: the manifest MIME plus the actual stsd sample
  // entry (for HEVC ffmpeg writes hev1 — in-band parameter sets — while the
  // MIME usually says hvc1, and browsers are picky about the pairing). Each
  // is tried with and without the codec description; the first configure()
  // that sticks wins. The declared codec must always be among them, or H.264
  // files would be probed as bogus hvc1/hev1 strings.
  const dot = codecs.v.indexOf('.');
  const base = dot > 0 ? codecs.v.slice(dot) : '';
  const codecs2 = new Set([codecs.v]);
  if (base && /^(hvc1|hev1|avc1|avc3)/.test(codecs.v)) codecs2.add(vtr.codec4cc + base);
  const cands = [];
  // Prefer a hardware decoder first (libmedia does the same): with the
  // default 'no-preference' Chrome can pick software decode for some
  // codecs/sizes, and software HEVC at 4K decodes below realtime — video
  // falls perpetually behind the audio clock, which looks exactly like
  // growing A/V desync. Plain (no-preference) variants stay in the ladder
  // as fallback for machines with no usable hardware path.
  const hwPrefs = ['prefer-hardware', undefined];
  for (const codec of codecs2) {
    for (const hw of hwPrefs) {
      if (vtr.desc) cands.push({ codec, description: vtr.desc, hardwareAcceleration: hw });
      cands.push({ codec, hardwareAcceleration: hw });
    }
  }
  let vcfg = null;
  for (const c of cands) {
    // NOTE: no optimizeForLatency — that hint is for WebRTC-style realtime
    // and disables decode pipelining/reordering; for B-frame-heavy movie
    // H.264 it cratered real-browser decode throughput to around playback
    // speed (laggy burst-painted video forever chasing the audio clock).
    if (vtr.w && vtr.h) { c.codedWidth = vtr.w; c.codedHeight = vtr.h; }
    let failed = false;
    let cerr = () => {};
    const dec = new VideoDecoder({
      output: (f) => { if (P.vdec === dec) P.vq.push(f); else { try { f.close(); } catch (e) {} } },
      error: (e) => cerr(e),
    });
    P.vdec = dec;
    try { dec.configure(c); } catch (e) {}
    await segSleep(250);   // give an async reject time to surface
    if (failed || dec.state !== 'configured') {
      failed = false; cerr = () => {};
      try { dec.close(); } catch (e) {}
      continue;
    }
    vcfg = c;
    break;
  }
  P.vcfg = vcfg;
  if (!vcfg) {
    const err = new Error('no WebCodecs decoder for ' + codecs.v);
    err.noWC = true;
    err.codec = codecs.v;
    throw err;
  }

  if (atr) {
    const rate = atr.rate || 48000, ch = atr.ch || 2, acodec = codecs.a || 'mp4a.40.2';
    P.acfgs = [];
    // HE-AAC v1 declared but a plain LC ASC inside: try the explicit-SBR
    // rewrite FIRST — it is the only config whose decoded output is the
    // full-bandwidth stream at the container's per-packet step (see
    // ascExplicitSbr). The declared sampleRate is the SBR output rate the
    // ASC now carries (core × 2), which can differ from a naive doubling of
    // the container's own rate field.
    const sbr = acodec === 'mp4a.40.5' && atr.desc ? ascExplicitSbr(atr.desc) : null;
    if (sbr) P.acfgs.push({ codec: acodec, sampleRate: sbr.outRate, numberOfChannels: ch, description: sbr.asc });
    P.acfgs.push({ codec: acodec, sampleRate: rate, numberOfChannels: ch, description: atr.desc });
    if (acodec !== 'mp4a.40.5') {
      P.acfgs.push({ codec: acodec, sampleRate: rate, numberOfChannels: ch });
    } else {
      // HE-AAC, no description accepted: some decoders (Firefox) reject the
      // description-based configs but decode cleanly with a description-less
      // CORE-rate one. Its decoded buffers last one container step (1024
      // frames at core rate == 2048 at output rate), so timing stays true —
      // but only the core band is reconstructed there.
      P.acfgs.push({ codec: acodec, sampleRate: rate / 2, numberOfChannels: ch });
    }
    P.acfgIdx = 0;
    for (let i = 0; i < P.acfgs.length; i++) {
      const dec = mkAdec();
      P.adec = dec;
      try {
        dec.configure(P.acfgs[i]);
        await segSleep(120);
        if (dec.state === 'configured') { P.acfgIdx = i; break; }
      } catch (e) {}
      try { dec.close(); } catch (_e) {}
      P.adec = null;
    }
    if (!P.adec) console.warn('[ct] audio decode unavailable — video only');
    P.noAudio = !P.adec;   // wall-clock master (see mediaNow)
    // AAC decoder-delay trim. Raw AAC streams start with the codec's
    // algorithmic delay (priming) baked into the first packets, and every
    // native player trims it before presenting (CoreAudio/CoreMedia and
    // ffmpeg-based players alike) — WebCodecs does NOT: decoded AudioData
    // carries passthrough timestamps, so scheduling them as-is plays the
    // whole track late by the delay vs the native player (measured against
    // afconvert ground truth: LC = 2112 samples at the output rate; HE-AAC
    // varies with the encoder's SBR framing — 2262 samples @22.05k, ~960
    // @48k — LUT below). Shift every audio media anchor earlier by it; the
    // priming region then maps before t=0 and is never sounded.
    if (P.adec) {
      let trim = 0;
      if (acodec === 'mp4a.40.5') {
        const lut = { 22050: 2262, 24000: 1100, 32000: 1400, 44100: 900, 48000: 960 };
        trim = lut[rate] || Math.round(2112 * rate / 48000);   // ~44ms scaled
      } else {
        trim = 2112;
      }
      P.aTrimUs = Math.round(trim / rate * 1e6);
    }
  }

  v.dispatchEvent(new Event('loadedmetadata'));
  P.canplaySent = false;
  if (!P.tickOn) { P.tickOn = true; requestAnimationFrame(drawTick); }
  feedLoop(gen, id).catch(e => { if (gen === segGen && P.id === id) segFatal(e); });
}

async function playTorrent(item, file) {
  stopPlayback();
  ensureCtx();   // synchronous, still inside the click gesture (see ensureCtx)
  currentId = item.id;
  currentFile = file || null;
  // Resume per torrent FILE (per torrent for the default file).
  const fl = currentFile ? (fileLists.get(String(item.id)) || []).find(f => f.path === currentFile) : null;
  resumeAt = Math.max(0, fl ? (fl.playhead || 0) : (item.playhead || 0));
  if (currentMovie) {
    let path = movieRoute() + '/' + torrentSlug(item);
    if (currentFile) path += '/' + fileSlug(currentFile);
    pushRoute(path);
  }
  $('player-modal').hidden = false;
  $('ctrl').style.display = 'block';
  showBuf('Loading…');
  P.id = item.id;
  try {
    await startEngine();
  } catch (e) {
    if (e.name === 'AbortError') return;
    stopPlayback();
    hideBuf();
    showBuf(e.noWC
      ? 'This browser cannot play this file: no ' + (e.codec || 'codec') + ' decoder in WebCodecs.'
      : 'Playback error: ' + e.message, true);
    return;
  }
  if (!P.id) return;
  // Restore the saved playhead (or the party anchor). Goes through seekTo so
  // an undownloaded resume point shows the spinner until the data lands.
  // In a watch party the party position wins: start where everyone is, and if
  // the party is paused don't auto-play on data arrival.
  if (partyPlayerActive() && partyAnchor) {
    partyHoldPlay = !partyAnchor.playing;
    // party-originated: the resulting 'seeked' is swallowed, not broadcast
    // back to the party we just adopted the position from.
    if (partyAnchor.t > 0.5) seekTo(partyAnchor.t, true);
    resumeAt = 0;
  } else if (resumeAt > 0.5) { seekTo(resumeAt); resumeAt = 0; }
  if (!partyHoldPlay) v.play();
  // restore the subtitle choice for this item (applySubTrack pulls the saved
  // sync offset from storage too); explicit "None" wins.
  const subPick = subPickStore()[currentId];
  if (subPick) { activeSub = { id: currentId, name: subPick }; applySubTrack(); }
  else activeSub = null;
}

function seekTo(globalT, partyOrigin) {
  if (fullDur && globalT > fullDur) globalT = fullDur;
  if (globalT < 0) globalT = 0;
  // A party-originated seek lands in a 'seeked' event we must not echo back
  // to the party (stale credits self-expire in partyConsume).
  if (partyOrigin) partyArm('seek');
  if (!P.id) { P.lastT = globalT; return; }
  const gen = ++segGen;
  if (segAbort) { segAbort.abort(); }
  segAbort = new AbortController();
  P.fetchN = segContaining(globalT);
  P.needKey = true;                     // decode from the first sync sample
  P.seekFloor = Math.max(0, globalT - 0.35);  // ...but only PRESENT from here on
  P.eof = false; P.endedFired = false;
  P.chunksV.length = 0; P.chunksA.length = 0;
  for (const f of P.vq) { try { f.close(); } catch (e) {} }
  P.vq.length = 0;
  for (const a of P.aq) { try { a.close(); } catch (e) {} }
  P.aq.length = 0;
  P.anchor = null; P.nextAt = 0; P.sched = []; P.lastT = globalT;
  P.wall = { ctx: P.ctx ? P.ctx.currentTime : 0, media: globalT };
  pendSeek = globalT; pendSeekAt = Date.now();
  // orphan buffers already scheduled on the old gain node (they would keep
  // playing the pre-seek audio for a fraction of a second)
  if (P.ctx && P.gain) {
    try { P.gain.disconnect(); } catch (e) {}
    P.gain = P.ctx.createGain();
    P.gain.gain.value = P.muted ? 0 : P.vol;
    P.gain.connect(P.ctx.destination);
  }
  // reset() leaves a decoder 'unconfigured' and re-configuring in place is
  // flaky across browsers — recreate both decoders fresh instead. Cheap
  // (hardware decode session re-init is ~ms) and deterministic.
  try { if (P.vdec) P.vdec.close(); } catch (e) {}
  P.vdec = mkVdec();
  if (P.vcfg) { try { P.vdec.configure(P.vcfg); } catch (e) {} }
  try { if (P.adec) P.adec.close(); } catch (e) {}
  P.adec = null;
  if (P.acfgs) {
    const a = P.acfgs[Math.min(P.acfgIdx, P.acfgs.length - 1)];
    P.adec = mkAdec();
    try { P.adec.configure(a); } catch (e) {}
  }
  showBufProgress();
  const id = P.id;
  feedLoop(gen, id).catch(e => { if (gen === segGen && P.id === id) segFatal(e); });
}

/* Persist the playback position for the current torrent (per torrent file,
 * not per movie). Realtime-only: called from a throttled timeupdate hook, so
 * whatever the video is showing is always what gets saved. No per-event saves
 * (seek / close / ended) — a hard kill loses at most the current second. */
function savePlayhead(t) {
  if (currentId == null) return;
  const id = currentId;
  const it = items.find(i => i.id === id);
  const body = { t };
  if (currentFile) {
    const fl = fileLists.get(String(id));
    if (fl) { const f = fl.find(x => x.path === currentFile); if (f) f.playhead = t; }
    body.file = currentFile;
  } else if (it) {
    it.playhead = t;
  }
  api('/api/library/' + id + '/playhead', { method: 'POST', body: JSON.stringify(body) }).catch(() => {});
}

function segFatal(e) {
  stopPlayback();
  hideBuf();
  showBuf('Playback error: ' + (e.message || e), true);
}

function teardownWC() {
  pendSeek = null; pendSeekAt = 0;
  if (segAbort) { segAbort.abort(); segAbort = null; }
  P.id = null; P.tracks = null; P.segs = new Map(); P.segMaxN = 0; P.done = false;
  P.eof = false; P.endedFired = false; P.needKey = false; P.seekFloor = 0; P.aStepUs = 0; P.aTrimUs = 0;
  P.chunksV.length = 0; P.chunksA.length = 0;
  for (const f of P.vq) { try { f.close(); } catch (e) {} }
  P.vq.length = 0;
  for (const a of P.aq) { try { a.close(); } catch (e) {} }
  P.aq.length = 0;
  if (P.vdec) { try { P.vdec.close(); } catch (e) {} P.vdec = null; }
  if (P.adec) { try { P.adec.close(); } catch (e) {} P.adec = null; }
  if (P.gain) { try { P.gain.disconnect(); } catch (e) {} P.gain = null; }
  if (P.ctx) { const c = P.ctx; P.ctx = null; c.close().catch(() => {}); }
  P.anchor = null; P.nextAt = 0; P.sched = []; P.noAudio = false; P.wall = null; P.paused = true; P.lastT = 0; P.flow = 0;
  P.fetchN = 1; P.fedUntil = 0; P.tickOn = false; P.canplaySent = false;
  wasWaiting = false;
  const ov = $('suboverlay');
  if (ov) { ov.hidden = true; ov.firstElementChild.textContent = ''; }
  subRenderStop();
  const cv = $('player');
  if (cv.getContext) { const g = cv.getContext('2d'); if (g) g.clearRect(0, 0, cv.width || 1, cv.height || 1); }
}

// Debug hook: inspect live engine state from the console.
window.__seg = () => ({
  gen: segGen, fetchN: P.fetchN, fedUntil: +P.fedUntil.toFixed(2), done: P.done, eof: P.eof,
  vq: P.vq.length, aq: P.aq.length, pendV: P.chunksV.length, pendA: P.chunksA.length,
  vdecQ: P.vdec && P.vdec.decodeQueueSize, adecQ: P.adec && P.adec.decodeQueueSize,
  vdecState: P.vdec && P.vdec.state, adecState: P.adec && P.adec.state, chunks: [P.chunksV.length, P.chunksA.length],
  ctx: P.ctx && P.ctx.state, ctxNow: P.ctx && +P.ctx.currentTime.toFixed(2),
  vq0: P.vq.length ? +(P.vq[0].timestamp / 1e6).toFixed(2) : null,
  aq0: P.aq.length ? +(P.aq[0].timestamp / 1e6).toFixed(2) : null,
  anchor: P.anchor && { ctx: +P.anchor.ctx.toFixed(2), media: +P.anchor.media.toFixed(2) },
  clock: +mediaNow().toFixed(2), paused: P.paused, lastT: +P.lastT.toFixed(2),
  aud: audibleNow() != null ? +audibleNow().toFixed(2) : null,
  adrift: audibleNow() != null ? +(mediaNow() - audibleNow()).toFixed(3) : null,
  late: window.__late || 0,
  seekFloor: P.seekFloor, aStepUs: P.aStepUs, aTrimUs: P.aTrimUs, acfg: P.acfgs && P.acfgIdx,
  flowAgo: P.flow ? performance.now() - P.flow : null, pendSeek,

function bufDump(kind) {

function seekSegGradient(have, total) {
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  const stops = [];
  for (let i = 0; i < n; i++) {
    let c = 0;
    for (let j = 0; j < per && i * per + j < total; j++) if (have[i * per + j]) c++;
    const a = Math.max(0, ((i * per) / total) * 100);
    const b = Math.min(100, ((i * per + Math.min(per, total - i * per)) / total) * 100);
    if (c > 0) {
      const f = c / per;
      const col = 'rgba(255,255,255,' + (0.22 + 0.28 * f).toFixed(2) + ')';
      stops.push(col + ' ' + a.toFixed(2) + '%', col + ' ' + b.toFixed(2) + '%');
    } else {
      stops.push('transparent ' + a.toFixed(2) + '%', 'transparent ' + b.toFixed(2) + '%');
    }
  }
  return 'linear-gradient(to right, ' + stops.join(', ') + ')';
}

let lastSkKey = null;
function updSk() {
  const el = $('seekbar');
  const it = currentId != null ? items.find(i => i.id === currentId) : null;
  let have = null, total = 0, rdy = false, fRdy = false;
  if (it && it.state === 'ready') { rdy = true; }
  else if (it && dlState[currentId] && dlState[currentId].total) {
    have = dlState[currentId].have;
    total = dlState[currentId].total;
  }
  // Playing one fully-downloaded file of a still-downloading pack: the
  // whole-torrent piece map would paint holes over the seek bar where other
  // files' pieces are missing — but THIS file is complete, so the bar must
  // show it as all-available.
  if (!rdy && it && currentFile) {
    const fl = fileLists.get(String(it.id));
    if (fl) {
      const f = fl.find(x => x.path === currentFile);
      if (f && f.size > 0 && (f.have || 0) >= f.size) fRdy = true;
    }
  }
  const ready = rdy || fRdy;
  const key = currentId + ':' + (ready ? 'ready' : (have ? total + ':' + have.join('') : 'none'));
  if (key === lastSkKey) return;
  lastSkKey = key;
  let avail;
  if (ready) avail = 'linear-gradient(to right, rgba(255,255,255,.35) 0%, rgba(255,255,255,.35) 100%)';
  else if (have) avail = seekSegGradient(have, total);

  el.style.backgroundImage =
    'linear-gradient(to right, rgba(255,255,255,.85) 0, rgba(255,255,255,.85) var(--val), transparent var(--val))' +
    (avail ? ', ' + avail : '');
}

/* ---------- buffering overlay ----------
 * The engine fires 'waiting'/'stalled' from the 250ms state machine when the
 * clock is not flowing (no scheduled audio ahead) and 'playing' when it
 * recovers; seekTo decides the initial spinner itself, synchronously. */
/* `err` = terminal failure (no codec, decode error): the spinner would imply
 * "wait and it will recover", so drop it and leave only the message. */
function showBuf(txt, err) {
  const b = $('buf');
  b.querySelector('span').textContent = txt || 'Buffering…';
  const spin = b.querySelector('.spin');
  if (spin) spin.hidden = !!err;
  b.hidden = false;
}
function hideBuf() { $('buf').hidden = true; }

// NOTE: no 'seeking' listener. Showing/hiding the overlay on the seeking
// event is unreliable (Firefox/Chrome clamp unbuffered seeks and the event
// order differs per engine); seekTo() itself decides, synchronously.
v.addEventListener('playing',  () => hideBuf());
v.addEventListener('canplay',  () => hideBuf());
// Movie finished: loop back to the start, regardless of any saved playhead.
v.addEventListener('ended', () => {
  v.currentTime = 0;
  v.play().catch(() => {});
});
function showBufProgress() {
  showBuf('Buffering…');
}
function onBufferingStart(ev) {
  // log once per stall, with full context, only when buffering
  if (!bufferingSince) {
    bufferingSince = Date.now();
    bufDump(ev.type);
  }
  showBufProgress();
}
v.addEventListener('waiting',  onBufferingStart);
v.addEventListener('stalled',  onBufferingStart);
v.addEventListener('playing', () => {
  if (bufferingSince) {
    console.warn('[ct] playback recovered after', Date.now() - bufferingSince, 'ms');
    bufferingSince = 0;
  }
  hideBuf();
});

/* Authoritative overlay sync: the hide paths above (canplay/playing/pump
 * append) can fire while the playhead still has nothing to play — Firefox
 * emits canplay without usable future data after buffer eviction, and a
 * decoder wedge freezes with the spinner long gone. Re-assert the truth a
 * few times a second instead of trusting event order: the generic
 * 'Buffering…' overlay is visible exactly when we want to play but the
 * playhead has no data. Explicit overlays (errors, party waits) untouched. */
let wedgeSince = 0, wedgeLastT = -1;
setInterval(() => {
  if ($('player-modal').hidden) { wedgeSince = 0; wedgeLastT = -1; return; }
  const b = $('buf'), span = b.querySelector('span');
  const generic = !b.hidden && span.textContent === 'Buffering…';
  const starving = pendSeek != null || (!P.paused && P.id && (!P.flow || performance.now() - P.flow > 1500));
  if (starving) {
    if (b.hidden || generic) showBufProgress();
  } else if (generic) {
    hideBuf();
  }
  // Engine wedge: we want to play, a seek is not pending, yet nothing has been
  // painted for 4s — nudge by re-seeking a hair forward (rebuilds the decode
  // pipeline). A genuine decoder error surfaces through onDecErr instead.
  if (!P.paused && P.id && !P.eof && pendSeek == null && P.flow && performance.now() - P.flow > 4000) {
    const t = P.lastT;
    if (Math.abs(t - wedgeLastT) < 0.05) {
      if (!wedgeSince) wedgeSince = Date.now();
      else if (Date.now() - wedgeSince > 4000) {
        wedgeSince = 0;
        console.warn('[ct] engine wedged at', t, '— nudging');
        bufDump('wedge');
        seekTo(t + 0.25);
      }
    } else wedgeSince = 0;
    wedgeLastT = t;
  } else {
    wedgeSince = 0;
    wedgeLastT = -1;
  }
}, 400);

function nextSegStart(t) {
  let best = null;
  for (const [, st] of P.segs) {
    if (st > t + 0.5 && (best === null || st < best)) best = st;
  }
  return best;
}

/* Subtitles are drawn by us (not the browser) so the bottom offset can move in
 * pixels and continuously in every browser. There is no <video> element
 * anymore and browsers refuse to load <track> elements outside a media
 * element (readyState stays 0 forever) — so we fetch the VTT ourselves and
 * keep the cues in a synthetic track of standalone VTTCues. */
let vSubTrack = null;
function subTrack() { return vSubTrack; }
function applySubPosition() {
  const ov = $('suboverlay');
  if (!ov) return;
  const ew = v.clientWidth, eh = v.clientHeight;
  const vw = v.videoWidth, vh = v.videoHeight;
  let left = 0, width = ew, letterbox = 0, height = eh;
  if (vw && vh) {
    const s = Math.min(ew / vw, eh / vh);
    width = vw * s; height = vh * s; left = (ew - width) / 2; letterbox = (eh - height) / 2;
  }
  ov.style.right = 'auto';
  ov.style.left = left + 'px';
  ov.style.width = width + 'px';
  ov.style.bottom = (letterbox + subStyle.bottom / 100 * height) + 'px';
  const span = ov.firstElementChild;
  if (span) span.style.fontSize = Math.max(8, height * 0.05 * subStyle.size / 100) + 'px';
}
/* Subtitle rendering is fully ours: the track's cue times stay ORIGINAL,
 * the sync offset lives only in ssDelay, and the active set is recomputed
 * from (original times + ssDelay) on every call. Never shift VTTCue
 * startTime/endTime in place — engines re-sort the cue list when times
 * change, so a pass over the list skips cues and leaves them stuck at an
 * older offset (stale lines piling up under the current one). A key gate
 * keeps the rAF path DOM-free when nothing changed. */
let subLastKey = '', subRaf = 0;
function renderActiveCues() {
  const ov = $('suboverlay');
  if (!ov) return;
  const span = ov.firstElementChild;
  const tr = subTrack();
  const cues = tr && tr.cues;
  if (!cues || !cues.length) {
    if (subLastKey !== '') { ov.hidden = true; span.textContent = ''; subLastKey = ''; }
    return;
  }
  const t = v.currentTime || 0;
  const active = [];
  let key = '';
  for (let i = 0; i < cues.length; i++) {
    const c = cues[i];
    if (c.startTime + ssDelay <= t && t < c.endTime + ssDelay) { active.push(c); key += i + ';'; }
  }
  if (key === subLastKey) return;
  subLastKey = key;
  span.textContent = '';
  for (let i = 0; i < active.length; i++) {
    if (i) span.appendChild(document.createElement('br'));
    try { span.appendChild(active[i].getCueAsHTML()); }
    catch (e) { span.appendChild(document.createTextNode(active[i].text)); }
  }
  ov.hidden = !active.length;
  if (active.length) applySubPosition();
}
function subRenderStart() {
  if (subRaf) return;
  const tick = () => { subRaf = requestAnimationFrame(tick); renderActiveCues(); };
  subRaf = requestAnimationFrame(tick);
}
function subRenderStop() { cancelAnimationFrame(subRaf); subRaf = 0; subLastKey = ''; }
function applySubStyle() { applySubPosition(); renderActiveCues(); }
v.addEventListener('timeupdate', renderActiveCues);
v.addEventListener('seeked', renderActiveCues);
v.addEventListener('loadedmetadata', applySubPosition);

function bindSubStyleInputs() {
  const size = $('subsize'), bottom = $('subbottom');
  const paint = (el) => el.style.setProperty('--val', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
  const sync = () => {
    subStyle.size = +size.value; subStyle.bottom = +bottom.value;
    $('subsizeval').textContent = (Math.round(subStyle.size * 10) / 10) + '%';
    $('subbottomval').textContent = (Math.round(subStyle.bottom * 10) / 10) + '%';
    paint(size); paint(bottom);
    applySubStyle();
    saveSubStyle();
  };
  size.addEventListener('input', sync);
  bottom.addEventListener('input', sync);
  paint(size); paint(bottom);
}

async function onSubRowClick(row) {
  if (row.dataset.none) {
    disableSub();
    renderSubPanel();
    return;
  }
  if (subBusy || row.dataset.pending) return;
  if (row.dataset.local) {
    const name = row.dataset.name;
    if (activeSub && activeSub.name === name) disableSub();
    else enableSub(name);
    renderSubPanel();
    return;
  }
  // Don't toggle subBusy while downloading — the OpenSubtitles result list
  // stays up ("Searching…" would blink), and the row we're downloading is
  // already pre-added below, so the panel size doesn't change either.
  const fileid = row.dataset.fileid;
  subsLocal.unshift({
    name: row.dataset.name || fileid,
    lang: row.dataset.lang || null,
    flag: row.dataset.flag || '🏳',
    source: 'downloaded',
    pending: true,
  });
  renderSubPanel();
  try {
    const added = await api('/api/library/' + currentId + '/subs/download', { method: 'POST', body: JSON.stringify({ file_id: fileid, lang: row.dataset.lang || '' }) });
    const i = subsLocal.findIndex(x => x.pending);
    if (i >= 0) subsLocal[i] = { name: added.name, lang: added.lang, flag: added.flag, source: 'downloaded' };
    else if (!subsLocal.some(x => x.name === added.name)) {
      subsLocal.push({ name: added.name, lang: added.lang, flag: added.flag, source: 'downloaded' });
    }
    enableSub(added.name);
  } catch (e) {
    console.error('sub download failed', e);
    const i = subsLocal.findIndex(x => x.pending);
    if (i >= 0) subsLocal.splice(i, 1);
  }
  renderSubPanel();
}

async function onSubDelClick(el) {
  const name = el.dataset.name;
  if (subDeleteConfirm === name) {
    try {
      await api('/api/library/' + currentId + '/subs/' + encodeURIComponent(name), { method: 'DELETE' });
    } catch (e) { console.error('sub delete failed', e); }
    subDeleteConfirm = null;
    subsLocal = subsLocal.filter(x => x.name !== name);
    if (activeSub && activeSub.name === name) disableSub();
    renderSubPanel();
  } else {
    subDeleteConfirm = name;
    el.textContent = 'confirm?';
    el.classList.add('danger');
  }
}

function subPickStore() {

/* Minimal WEBVTT parser — enough for the (SRT-converted) VTT our server
 * emits. Cue settings are ignored: we position the overlay ourselves. */
function parseVtt(text) {
  const cues = [];
  const tsRe = /(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})[.,](\d{1,3})\s*-->\s*(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})[.,](\d{1,3})/;
  for (const block of text.replace(/\r/g, '').split(/\n{2,}/)) {
    if (/^(WEBVTT|NOTE|STYLE|REGION)/i.test(block)) continue;
    const lines = block.split('\n');
    const ti = lines.findIndex(l => tsRe.test(l));
    if (ti < 0) continue;
    const m = tsRe.exec(lines[ti]);
    const sec = (h, mn, s, ms) => (+h || 0) * 3600 + (+mn || 0) * 60 + (+s || 0) + (+((ms || '0').padEnd(3, '0')) || 0) / 1000;
    const t0 = sec(m[1], m[2], m[3], m[4]), t1 = sec(m[5], m[6], m[7], m[8]);
    const body = lines.slice(ti + 1).join('\n').trim();
    if (!body || !isFinite(t0) || !isFinite(t1) || t1 <= t0) continue;
    try { cues.push(new VTTCue(t0, t1, body)); } catch (e) {}
  }
  return { kind: 'subtitles', mode: 'hidden', cues };
}

function applySubTrack() {
  vSubTrack = null;
  if (!activeSub || activeSub.id !== currentId) {
    if (ssVisible()) ssToggle(false);
    subRenderStop();

  }
  ssDelay = ssLoadDelay();
  const want = activeSub;
  fetch('/sub/' + currentId + '/' + encodeURIComponent(want.name))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(txt => {

      vSubTrack = parseVtt(txt);

      subRenderStart();
      renderActiveCues();

}

/* ---------- subtitle sync ----------
 * A time-scaled subtitle timeline (rows sit at cue start × SS_SCALE px, so
 * vertical distance IS time distance). The white NOW cursor sits at
 * (movie time − delay) and is glued to the MIDDLE of the panel: as the
 * movie plays the timeline scrolls up past it continuously. Scrolling /
 * dragging the timeline slides it under the cursor — while scrubbing, the
 * delay follows continuously (subtitles re-time live); releasing / idling
 * commits. Tapping a line pegs "now" onto that line. The offset lives ONLY
 * in ssDelay — track cue times are never modified — and is persisted per
 * (item, subtitle file) in localStorage. */
const SS_SCALE = 48, SS_PAD = 80, SS_ROW = 44;   // px/sec, head room, min row pitch
let ssDelay = 0, ssRaf = 0, ssIdleTimer = 0, ssLastIdx = -2;
let ssCues = [], ssPainted = [], ssDrag = null, ssManual = false;
let ssLastLabel = '', ssLastBadge = null, ssFollowScroll = null;
const ssList = $('ss-list'), ssCur = $('ss-cursor'), ssPill = $('ss-pill');

function ssVisible() { return !$('subsync').hidden; }
function ssDelayKey() { return activeSub ? currentId + '|' + activeSub.name : null; }
function ssDelayStore() {
  try { return JSON.parse(localStorage.getItem('chadtorrent.subdelay') || '{}'); } catch (e) { return {}; }
}
function ssLoadDelay() {
  const k = ssDelayKey(); if (!k) return 0;
  const d = +ssDelayStore()[k];
  return isFinite(d) ? d : 0;
}
function ssSaveDelay() {
  const k = ssDelayKey(); if (!k) return;
  const m = ssDelayStore();
  if (Math.abs(ssDelay) < 0.05) delete m[k]; else m[k] = ssDelay;
  try { localStorage.setItem('chadtorrent.subdelay', JSON.stringify(m)); } catch (e) {}
}
function ssFmtDelay(d) { return (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + 's'; }
function ssCursorY() { return ((v.currentTime || 0) - ssDelay) * SS_SCALE + SS_PAD; }

/* Round, persist, refresh; called on scrub end / tap / reset. */
function ssCommitDelay(d) {
  ssDelay = Math.round(d * 10) / 10;
  ssSaveDelay();
  ssLastIdx = -2;
  ssBadge();
  renderActiveCues();
}

/* Called from applySubTrack's hook: cues (re)loaded -> rebuild the timeline
 * if the overlay is open. Nothing to re-apply: cue times stay original,
 * ssDelay is reloaded in applySubTrack. */
function ssTrackReady(tr) {
  if (!tr || !tr.cues || !tr.cues.length) return;
  if (ssVisible()) ssBuild();
}

function ssCueText(c) {
  try {
    const d = document.createElement('div');
    d.appendChild(c.getCueAsHTML());
    return d.textContent.replace(/\s+/g, ' ').trim();
  } catch (e) {
    return String(c.text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }
}

function ssBuild() {
  const tr = subTrack();
  const cues = tr && tr.cues;
  if (!cues || !cues.length) {
    ssCues = [];
    ssCur.hidden = true;               // keep the node alive (detached), just out of the way
    ssCur.remove();
    ssList.innerHTML = '<div class="ss-empty">Waiting for subtitle lines…</div>';
    return;
  }
  const track = document.createElement('div');
  track.className = 'ss-track';
  ssCur.hidden = false;
  track.appendChild(ssCur);            // move the persistent cursor in before wiping
  ssCues = [];
  let prevTop = -1e9, lastEnd = 0;
  for (let i = 0; i < cues.length; i++) {
    const c = cues[i];
    // ideal time-proportional position; only nudged down when rows would
    // collide (rapid-fire cues) so the mapping stays honest
    let top = c.startTime * SS_SCALE + SS_PAD;
    if (top < prevTop + SS_ROW) top = prevTop + SS_ROW;
    prevTop = top;
    if (c.endTime > lastEnd) lastEnd = c.endTime;
    const el = document.createElement('div');
    el.className = 'ss-line';
    el.dataset.i = i;
    el.style.top = top + 'px';
    el.innerHTML = '<span class="ss-t">' + fmtClock(c.startTime) + '</span>'
      + '<span class="ss-x">' + esc2(ssCueText(c)) + '</span>';
    track.appendChild(el);
    ssCues.push({ start: c.startTime, end: c.endTime, el });
  }
  track.style.height = (SS_PAD + lastEnd * SS_SCALE + SS_PAD) + 'px';
  ssList.innerHTML = '';
  ssList.appendChild(track);
  ssLastIdx = -2;
  // jump the view so the cursor sits mid-view (instant, no animation)
  ssList.scrollTop = Math.max(0, ssCursorY() - ssList.clientHeight * 0.5);
  ssFollowScroll = ssList.scrollTop;
}

/* Cue covering the playhead (ORIGINAL times + delay), or -1 in a gap. The
 * highlight must track the realtime subtitle exactly: no "next line is
 * current" anticipation, or future lines glow before their time. */
function ssActiveIdx() {
  const t = (v.currentTime || 0) - ssDelay;
  for (let i = 0; i < ssCues.length; i++) {
    const c = ssCues[i];
    if (c.start <= t && t < c.end) return i;
  }
  return -1;
}

function ssPaint(idx) {
  for (const el of ssPainted) el.classList.remove('on', 'near');
  ssPainted = [];
  const add = (i, cls) => {
    const c = ssCues[i];
    if (c) { c.el.classList.add(cls); ssPainted.push(c.el); }
  };
  if (idx >= 0) {
    add(idx, 'on');
    add(idx - 1, 'near');
  }
}

function ssBadge() {
  const s = ssFmtDelay(ssDelay);
  if (s === ssLastBadge) return;
  ssLastBadge = s;
  $('ss-delay').textContent = s;
}

function ssTick() {
  if (!ssVisible()) return;
  if (ssCues.length) {
    const vh = ssList.clientHeight;
    // scrubbing: the timeline is under the user's finger; the cursor stays
    // at mid-view and the delay follows it continuously
    if (ssManual) {
      ssDelay = (v.currentTime || 0) - (ssList.scrollTop + vh / 2 - SS_PAD) / SS_SCALE;
      ssBadge();
    }
    // cursor position + live movie-time label
    const y = ssCursorY();
    ssCur.style.top = y + 'px';
    const label = fmtClock(v.currentTime || 0);
    if (label !== ssLastLabel) { ssLastLabel = label; ssPill.textContent = label; }
    // highlight the cue the cursor is in
    const idx = ssActiveIdx();
    if (idx !== ssLastIdx) { ssLastIdx = idx; ssPaint(idx); }
    // follow: glue the cursor to mid-view. Instant writes every frame — the
    // cursor's own 48px/s glide IS the motion, so no smooth scrolling and
    // no time-window guards to misread animation frames as user input.
    if (!ssManual) {
      const want = y - vh / 2;
      if (Math.abs(ssList.scrollTop - want) > 0.25) {
        ssList.scrollTop = want;
        ssFollowScroll = ssList.scrollTop;
      }
    }
  }
  ssRaf = requestAnimationFrame(ssTick);
}

/* The user took over the timeline (wheel / drag / scrollbar): derive the
 * delay from their scroll position and commit shortly after the last
 * move. */
function ssUserScroll() {
  if (!ssCues.length) return;
  ssManual = true;
  clearTimeout(ssIdleTimer);
  ssIdleTimer = setTimeout(() => { if (!ssDrag) { ssManual = false; ssCommitDelay(ssDelay); } }, 700);
}

function ssToggle(force) {
  const show = force === undefined ? !ssVisible() : force;
  const p = $('subsync');
  clearTimeout(ssIdleTimer);
  ssManual = false; ssDrag = null;
  if (show) {
    if (!activeSub || activeSub.id !== currentId) return;
    ssLastIdx = -2;
    p.hidden = false;
    ssBuild();
    ssBadge();
    cancelAnimationFrame(ssRaf);
    ssRaf = requestAnimationFrame(ssTick);
  } else {
    p.hidden = true;
    cancelAnimationFrame(ssRaf);
    ssRaf = 0;
  }
}

$('ss-close').addEventListener('click', () => ssToggle(false));
$('ss-reset').addEventListener('click', () => ssCommitDelay(0));

ssList.addEventListener('pointerdown', (e) => {
  if (!ssCues.length || e.button !== 0) return;
  // ignore the right-edge zone: Firefox targets the element for scrollbar
  // drags and our capture logic would fight the native scrollbar
  if (e.offsetX && e.offsetX >= ssList.clientWidth - 12) return;
  e.preventDefault();
  ssUserScroll();
  ssDrag = { y: e.clientY, top: ssList.scrollTop, moved: 0, line: e.target.closest('.ss-line') };
  try { ssList.setPointerCapture(e.pointerId); } catch (err) {}
});
ssList.addEventListener('pointermove', (e) => {
  if (!ssDrag) return;
  const dy = e.clientY - ssDrag.y;
  ssDrag.moved = Math.max(ssDrag.moved, Math.abs(dy));
  ssList.scrollTop = ssDrag.top - dy;
});
ssList.addEventListener('pointerup', () => {
  if (!ssDrag) return;
  const d = ssDrag;
  ssDrag = null;
  ssManual = false;
  clearTimeout(ssIdleTimer);
  // a tap on a line pegs "now" onto it; a drag commits the scrub as-is
  if (d.moved < 5 && d.line) ssCommitDelay((v.currentTime || 0) - ssCues[+d.line.dataset.i].start);
  else ssCommitDelay(ssDelay);
});
ssList.addEventListener('pointercancel', () => { ssDrag = null; ssUserScroll(); });
ssList.addEventListener('wheel', () => ssUserScroll(), { passive: true });
ssList.addEventListener('scroll', () => {
  if (!ssVisible() || !ssCues.length) return;
  // our own follow / build writes match ssFollowScroll exactly; anything
  // else is the user scrolling (wheel / scrollbar / touch) — no time-window
  // guessing, so our writes can never be misread as user input
  if (ssFollowScroll != null && Math.abs(ssList.scrollTop - ssFollowScroll) < 2) return;
  ssUserScroll();
});

function fsIsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function applyFs() {
  const on = fsIsOn();
  wrap.style.cssText = on ? 'position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; margin: 0; background: rgb(0,0,0);' : '';
  v.style.cssText = on ? 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;' : '';
  applySubPosition();
}
function fsIcon() {
  $('fsicon').innerHTML = fsIsOn() ? '<use href="#ic-minimize"/>' : '<use href="#ic-maximize"/>';
}
document.addEventListener('fullscreenchange', () => { fsIcon(); applyFs(); });
document.addEventListener('webkitfullscreenchange', () => { fsIcon(); applyFs(); });
fsIcon();
applyFs();
$('fsbtn').addEventListener('click', toggleFs);

/* ---------- url routing ----------
 * /library                      grid
 * /library/<movie_slug>         movie detail
 * /library/<movie>/<torrent>    movie detail + player on that torrent
 * /library/<movie>/<torrent>/<file>  TV: player on that episode file
 * pushState on user actions; popstate + first load route accordingly. */
let bootRouted = false;
function slugify(x) { return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function pushRoute(path) { if (location.pathname !== path) history.pushState({}, '', path); }
function movieRoute() {
  if (!currentMovie) return '/library';
  const rep = movieRep(currentMovie.rows) || currentMovie.rows[0];
  return '/library/' + slugify(movieName(rep));
}
function torrentSlug(t) { return slugify(t.title || t.magnet || ('torrent_' + t.id)); }

function handleRoute() {
  const parts = location.pathname.split('/').filter(Boolean);
  if (!parts.length || parts[0] !== 'library') { showLibraryRoute(); return; }
  if (parts.length === 1) { showLibraryRoute(); return; }
  const mslug = parts[1];
  let mkey = null, mrows = null;
  for (const [k, rows] of groupItems(items)) {
    if (slugify(movieName(movieRep(rows))) === mslug) { mkey = k; mrows = rows; break; }
  }
  if (!mkey) { showLibraryRoute(); return; }
  const playerOpen = currentId !== null;
  openMovie(mkey, false);
  if (parts.length < 3) {
    if (playerOpen) { stopPlayback(); $('player-modal').hidden = true; }
    return;
  }
  // 3 parts = torrent (default file); 4 parts = torrent + specific episode file.
  const tslug = parts.slice(2, parts.length > 3 ? 3 : undefined).join('_');
  const fslug = parts.length > 3 ? parts.slice(3).join('_') : null;
  const t = mrows.filter(r => r.magnet && r.state !== '_pending' && r.state !== 'connecting' && r.state !== 'error')
                 .find(r => torrentSlug(r) === tslug);
  if (!t || currentId === t.id) return;
  if (fslug) {
    loadFileList(t.id).then(files => {
      const f = (files || []).find(x => x.video && fileSlug(x.path) === fslug);
      if (currentId !== t.id) playTorrent(t, f ? f.path : null);
    });
    return;
  }
  if (movieRep(mrows) && movieRep(mrows).media_type === 'tv') {
    loadFileList(t.id).then(() => {
      const f = pickEpisodeToPlay(t);
      if (currentId !== t.id) playTorrent(t, f ? f.path : null);
    });
  } else {
    playTorrent(t);
  }
}
function showLibraryRoute() {
  if (currentId !== null) stopPlayback();
  $('player-modal').hidden = true;
  currentMovie = null;
  setView(false);
}

/* show controls only when cursor in bottom 10% of video; back button only near top-left corner.
 * While a popover is open the controls never hide (popovers live inside the bar). */
let lastMouse = { x: innerWidth / 2, y: innerHeight };
function syncCtrlVis() {
  if ($('player-modal').hidden) return;
  const r = v.getBoundingClientRect();
  const show = subPanelOpen || partyPopOpen || (r.width > 0 && lastMouse.y >= r.top + r.height * 0.9);
  $('ctrl').style.display = show ? 'block' : 'none';
}
document.addEventListener('mousemove', (e) => {
  lastMouse = { x: e.clientX, y: e.clientY };
  if ($('player-modal').hidden) return;
  syncCtrlVis();
  const br = $('pback').getBoundingClientRect();
  const pad = 30;
  const near = e.clientX >= br.left - pad && e.clientX <= br.right + pad &&
               e.clientY >= br.top - pad && e.clientY <= br.bottom + pad;
  $('pback').classList.toggle('on', near);
});

/* Hide the cursor the instant it stops moving in the player — no grace delay.
 * A position poll catches "stopped" on the very next tick (browser mousemove
 * events go quiet when the pointer is still). Only the bottom control bar /
 * open popovers keep it visible. */
let cPrev = null;
setInterval(() => {
  const modal = $('player-modal');
  if (modal.hidden) { document.body.classList.remove('cursor-none'); cPrev = null; return; }
  const ctrlOn = $('ctrl').style.display !== 'none';
  const same = cPrev !== null && cPrev[0] === lastMouse.x && cPrev[1] === lastMouse.y;
  cPrev = [lastMouse.x, lastMouse.y];
  document.body.classList.toggle('cursor-none', same && !ctrlOn);
}, 50);

/* ---------- input system ----------
 * No key does anything by default. The browser's native behaviors are killed
 * globally: spacebar / arrow page-scroll, native stepping on a focused
 * <input type=range> (seek/vol bars), button activation, Tab focus, Escape.
 * A key only acts via an explicit binding below, gated by CONTEXT (which
 * screen is open). Real text entry and browser-level shortcuts (Cmd+R, F5,
 * Cmd+F, F11… and browser fullscreen-Escape) always pass through untouched.
 * Bindings can be remapped in Settings (top-right gear); every binding is
 * plain data backed by a default table, and edits persist via localStorage.
 */
const KCTX_PLAYER  = 'player';   /* player modal open            */
const KCTX_MODAL   = 'modal';    /* add/settings/confirm overlay  */
const KCTX_MOVIE   = 'movie';    /* movie detail page open        */
const KCTX_LIBRARY = 'library';  /* library grid open             */

// Default bindings (restore-target in Settings). 'mods' holds Ctrl/Alt/Shift/
// Meta combinations; the fn references below are hoisted function declarations.
const DEFAULT_KEYBIND = [
  // { id, ctx, code, label, fn }
  { id: 'pl-toggle',   ctx: KCTX_PLAYER, code: 'Space',      label: 'Play / Pause',           fn: togglePlay },
  { id: 'pl-back5',    ctx: KCTX_PLAYER, code: 'ArrowLeft',  label: 'Seek back 5s',           fn: () => seekBy(-5) },
  { id: 'pl-fwd5',     ctx: KCTX_PLAYER, code: 'ArrowRight', label: 'Seek forward 5s',        fn: () => seekBy(5) },
  { id: 'pl-fs',       ctx: KCTX_PLAYER, code: 'KeyF',       label: 'Toggle fullscreen',      fn: toggleFs },
  { id: 'pl-mute',     ctx: KCTX_PLAYER, code: 'KeyM',       label: 'Toggle mute',            fn: toggleMute },
  { id: 'pl-exit',     ctx: KCTX_PLAYER, code: 'Escape',     label: 'Exit player',            fn: exitPlayer },
  { id: 'mv-back',     ctx: KCTX_MOVIE,  code: 'Escape',     label: 'Back to library',        fn: () => $('btn-back').click() },
  { id: 'mv-next',     ctx: KCTX_MOVIE,  code: 'ArrowDown',  label: 'Next item / torrent',    fn: selNext },
  { id: 'mv-prev',     ctx: KCTX_MOVIE,  code: 'ArrowUp',    label: 'Previous item',          fn: selPrev },
  { id: 'mv-open',     ctx: KCTX_MOVIE,  code: 'Enter',      label: 'Open selected',          fn: selOpen },
  { id: 'mv-dltoggle', ctx: KCTX_MOVIE,  code: 'Space',      label: 'Pause / resume torrent', fn: selToggleDl },
  { id: 'lib-next',    ctx: KCTX_LIBRARY,code: 'ArrowRight', label: 'Next movie',             fn: selNext },
  { id: 'lib-prev',    ctx: KCTX_LIBRARY,code: 'ArrowLeft',  label: 'Previous movie',         fn: selPrev },
  { id: 'lib-down',    ctx: KCTX_LIBRARY,code: 'ArrowDown',  label: 'Movie below (row)',      fn: selDown },
  { id: 'lib-up',      ctx: KCTX_LIBRARY,code: 'ArrowUp',    label: 'Movie above (row)',      fn: selUp },
  { id: 'lib-open',    ctx: KCTX_LIBRARY,code: 'Enter',      label: 'Open movie',             fn: selOpen },
  { id: 'lib-settings',ctx: KCTX_LIBRARY,code: 'Escape',     label: 'Open settings',           fn: openSettings },
  { id: 'lib-add',    ctx: KCTX_LIBRARY,code: 'Space',      label: 'Add movie',               fn: openAdd },
  { id: 'modal-close', ctx: KCTX_MODAL,  code: 'Escape',     label: 'Close',                  fn: closeModal },
];

const KCTX_NAMES = { player: 'Player', modal: 'Modal', movie: 'Movie', library: 'Library' };
const KB_STORE = 'chadtorrent.keybinds';
const KB_DEL_STORE = 'chadtorrent.keybinds.deleted';

function delKbIds() {
  try { return new Set(JSON.parse(localStorage.getItem(KB_DEL_STORE) || '[]')); }
  catch (e) { return new Set(); }
}
function tombKb(id) {
  const s = delKbIds(); s.add(id);
  try { localStorage.setItem(KB_DEL_STORE, JSON.stringify([...s])); } catch (e) {}
}
function untombAllKb() {
  try { localStorage.removeItem(KB_DEL_STORE); } catch (e) {}
}

const CODE_PRETTY = { Space: 'Space', Enter: 'Enter', Escape: 'Esc', Tab: 'Tab',
  Backspace: 'Backspace', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
function prettyCode(code) {
  if (CODE_PRETTY[code]) return CODE_PRETTY[code];
  if (code && code.startsWith('Key')) return code.slice(3);
  if (code && code.startsWith('Digit')) return code.slice(5);
  return code || '';
}
function prettyKey(b) { return (b.mods || []).concat(prettyCode(b.code)).join('+'); }
function modsFor(e) {
  return [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean);
}
function modsEq(a, b) { return (a || []).join(',') === (b || []).join(','); }
function modMatch(b, e) { return modsEq(b.mods || [], modsFor(e)); }

function actionFor(ctx, label) {
  const d = DEFAULT_KEYBIND.find(x => x.ctx === ctx && x.label === label);
  return d ? d.fn : (() => {});
}
function actionsForCtx(ctx) {
  const seen = new Set(), out = [];
  for (const b of DEFAULT_KEYBIND) if (b.ctx === ctx && !seen.has(b.label)) { seen.add(b.label); out.push(b.label); }
  return out;
}
function defaultKeybinds() {

}
function decodeKeybinds(saved) {
  const out = [];

  for (const s of saved) {
    if (!s || typeof s.ctx !== 'string' || typeof s.code !== 'string') continue;
    const d = DEFAULT_KEYBIND.find(x => x.id === s.id)
      || DEFAULT_KEYBIND.find(x => x.ctx === s.ctx && x.label === s.label);
    if (!d) continue;
    out.push({ id: s.id, ctx: s.ctx, code: s.code, mods: Array.isArray(s.mods) ? s.mods : [],

}
function loadKeybinds() {
  let saved = null;
  try {
    const raw = localStorage.getItem(KB_STORE);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {}
  if (!Array.isArray(saved)) return defaultKeybinds();
  const out = decodeKeybinds(saved);
  const have = new Set(out.map(b => b.id));

function libRows(els) {
  const rows = new Map();
  els.forEach((el, i) => {
    const t = Math.round(el.getBoundingClientRect().top);
    if (!rows.has(t)) rows.set(t, []);

function libSelJump(d, axis) {
  const els = document.querySelectorAll(LIB_CARDS_SEL);
  const n = els.length;
  if (!n) return;
  if (libSel < 0 || libSel >= n) libSel = d > 0 ? 0 : n - 1;
  else if (axis === 'h') {
    // Horizontal stays ±1. Edges clamp instead of wrapping so a press
    // always lands on something visible.
    libSel = Math.max(0, Math.min(n - 1, libSel + d));
  } else {
    // Spatial vertical move: the nearest card in the next/previous VISUAL
    // row. Same column wins; otherwise the column-nearest card with a left
    // bias — Down from the 2nd movie lands on the lone movie below-left,
    // never skips a half-filled row, and crossing into the TV section goes
    // to its first row. Nothing below → stay put.
    const rows = libRows(els);
    const cur = els[libSel].getBoundingClientRect();
    const ri = rows.findIndex(r => r[0] === Math.round(cur.top));
    const target = rows[ri + d];
    if (target) {

      for (const i of target[1]) {

        const score = Math.abs(dl) * 2 + (dl > 0 ? 1 : 0);

/* ---------- watch party ----------
 * One party per instance. The server ferries encrypted presence/action
 * messages to the other members over punched peer-to-peer UDP (the invite's
 * hub only makes introductions); this side owns the <video> element: local
 * actions are broadcast, remote actions are applied, and every member
 * downloads the movie from the torrent swarm itself. */
let party = null;               // active party snapshot from the server
let partyWs = null, partyRetry = 0;
let partyApply = 0;             // >0 while applying remote actions → suppress echo
let partyEcho = { seek: 0, play: 0, pause: 0 };  // DOM events born from party code → swallowed once

function partyArm(k) { partyEcho[k]++; partyEchoAt[k] = Date.now(); }
/* Consume an echo credit if it is fresh. A stale credit (>2s old, its DOM
 * event never fired — e.g. a marginal remote seek whose currentTime write
 * was a no-op) must NOT swallow a later genuine user action: reset it. */
function partyConsume(k) {
  if (partyEcho[k] > 0) {
    if (Date.now() - partyEchoAt[k] <= 2000) { partyEcho[k]--; return true; }
    partyEcho[k] = 0;
  }

}

let partyAutoPaused = false;    // we paused because a member is buffering
let partyHoldPlay = false;      // party is paused → block the pump's auto-play
let ptMode = null;              // current party modal render mode

window.__ctlog = [];
function ctlog(tag, data) {
  const e = Object.assign({ tag }, data || {}, { t: Date.now() });
  window.__ctlog.push(e);

  try { console.log('[ct]', tag, JSON.stringify(e)); } catch (err) {}
}

function partyWsConnect() {
  if (partyWs) {
    // Replacing the socket: detach the old one's close handler first, or its
    // onclose would spawn a *retry* socket that coexists with this new one.
    // Every live socket subscribes to party.events, so accumulated sockets
    // redeliver every action (double/triple partyApplyAction → unbalanced
    // partyEcho counters swallow a later genuine user action).
    const old = partyWs;
    old.onclose = null;
    try { old.close(); } catch (e) {}
    partyWs = null;
  }
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  let ws;
  try { ws = new WebSocket(proto + location.host + '/ws/party'); } catch (e) { return; }
  partyWs = ws;
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'party') partySetSnapshot(m.party);
    else if (m.type === 'action') partyApplyAction(m.kind, m.t, m.by, m.playing, m.file);
  };
  ws.onopen = () => { partyRetry = 0; ctlog('ws', { ev: 'open' }); };
  ws.onclose = () => {
    if (partyWs !== ws) return; // stale replacement socket: ignore
    ctlog('ws', { ev: 'close' });
    partyWs = null;

}

}

}

function partySetSnapshot(p) {
  const was = party;

    ctlog('party', { ev: 'state', conn: p.conn, peers: p.peers.length, wasConn: was.conn, wasPeers: was.peers.length });
  } else if (!was && p) {
    ctlog('party', { ev: 'state', conn: p.conn, peers: p.peers.length });
  } else if (!p && was) {
    ctlog('party', { ev: 'ended', wasConn: was.conn });
  }
  if (!p) {
    partyAnchor = null; partyAutoPaused = false; partyHoldPlay = false;
    // Party ended (left or item deleted): never fall through to the join
    // form — close the panel.
    if (was) closePartyModal();
  }
  if (p && !partyAnchor) {
    // Late joiner: adopt the party's position (a playing member first,
    // otherwise wherever the party is parked) and jump there right away.
    // The adopted member's episode comes along: a TV party is scoped to a
    // file, so "where everyone is" includes WHICH episode.
    const src = p.peers.find(x => x.playing) || p.peers.find(x => (x.pos || 0) > 1);
    if (src) {
      partyAnchor = { t: src.pos || 0, playing: !!src.playing, at: Date.now() };
      const srcFile = src.file || p.file || null;
      ctlog('party', { ev: 'late-anchor', mt: +partyAnchor.t.toFixed(1), playing: partyAnchor.playing, file: srcFile || null, from: src.name });
      if (partyPlayerActive()) {
        if (srcFile && srcFile !== currentFile) {
          const it = items.find(i => i.id === p.item_id);
          if (it) {
            partyApply++;
            try {
              partyArm('play');
              playTorrent(it, srcFile);
            } finally { setTimeout(() => partyApply--, 300); }
          }
        } else {
          partyApply++;
          try {
            if (partyAnchor.t > 0.5) seekTo(partyAnchor.t, true);
            partyHoldPlay = !partyAnchor.playing;
            if (partyAnchor.playing && v.paused) { partyArm('play'); v.play().catch(() => {}); }
          } finally { setTimeout(() => partyApply--, 300); }
        }
      }
    }
  }
  if (p) partyApplyRoster();
  renderPartyBtn();
  renderPartyModal();
  renderPartyPop();
  if ((was == null) !== (p == null)) refreshLibrary();
}

/* ----- actions: remote → player ----- */
function partyApplyAction(kind, t, by, playing, file) {
  if (!party) return;
  t = Math.max(0, isFinite(t) ? t : 0);
  // An action carrying a file moves the party to that episode (last writer
  // decides what the party watches, exactly like it decides the position).
  if (file) party.file = file;
  ctlog('remote-action', { kind, mt: +t.toFixed(1), by, playing, file: file || null, active: partyPlayerActive(), paused: v.paused });
  partyAnchor = { t, playing: kind === 'play', at: Date.now() };
  partyHoldPlay = kind === 'pause';
  if (!partyPlayerActive()) return;
  // Episode switch implied by the action's file: re-open the player on that
  // episode — playTorrent then adopts the party anchor position/hold state
  // (and its anchor seek is party-originated, so no seek echoes back).
  if (file && file !== currentFile) {
    const it = items.find(i => i.id === party.item_id);
    if (it) {
      partyApply++;
      try {
        partyArm('play');
        playTorrent(it, file);
      } finally { setTimeout(() => partyApply--, 300); }
      return;
    }
  }
  partyApply++;
  try {
    if (kind === 'seek') {
      seekTo(t, true);
      // Following a playing member's seek: keep watching with them.
      if (playing && v.paused && !partyAutoPaused) {
        partyHoldPlay = false;
        partyArm('play');
        ctlog('remote-action', { ev: 'seek-resume', mt: +t.toFixed(1) });
        v.play().catch(() => {});
      }
    } else if (kind === 'play') {
      partyAutoPaused = false;
      if (Math.abs((v.currentTime || 0) - t) > 1.5) seekTo(t, true);
      partyArm('play');
      v.play().catch(() => {});
      hideBuf();
    } else if (kind === 'pause') {
      partyArm('pause');
      v.pause();
      hideBuf();
    }
  } finally { setTimeout(() => partyApply--, 300); }
}

/* ----- actions: player → remote ----- */
function partyLocalAction(kind) {
  // NOTE: no partyApply guard here. Remote applications suppress their echo
  // via the partyEcho counters (every remote mutation increments them before
  // touching the element), and a blanket guard silently SWALLOWS a genuine
  // user action whose DOM event happens to fire inside the 300ms apply
  // window — the local video already did it, so the member diverges from
  // the party without anyone knowing (seen live: a seek eaten by a
  // concurrently-applied remote auto-pause).
  if (!partyPlayerActive()) return;
  const t = v.currentTime || 0;
  ctlog('local-action', { kind, mt: +t.toFixed(1), file: currentFile || null });
  partyAnchor = { t, playing: kind === 'play', at: Date.now() };
  partyHoldPlay = kind === 'pause';
  // My episode becomes the party's episode (server-side p.file tracks it).
  party.file = currentFile || null;
  partySend({ type: 'action', kind, t, file: currentFile });
}
v.addEventListener('seeked', () => {
  if (partyConsume('seek')) { ctlog('player', { ev: 'seeked', mt: +(v.currentTime || 0).toFixed(1), echo: true }); return; }
  ctlog('player', { ev: 'seeked', mt: +(v.currentTime || 0).toFixed(1), echo: false, apply: partyApply });
  partyLocalAction('seek');
});

/* ----- strict sync: pause everyone while a member buffers ----- */
function partyApplyRoster() {
  if (!party) return;
  const waiting = (party.peers || []).filter(x => x.buffering);
  if (partyPlayerActive() && !partyApply) {
    if (waiting.length && !v.paused) {
      partyAutoPaused = true;
      partyHoldPlay = true;
      partyApply++;
      try { partyArm('pause'); v.pause(); } finally { setTimeout(() => partyApply--, 300); }
      ctlog('roster', { ev: 'auto-pause', waiting: waiting.map(w => w.name || 'someone').join(',') });
      showBuf('Waiting for ' + waiting.map(w => w.name || 'someone').join(', ') + '…');
    } else if (!waiting.length && partyAutoPaused) {
      partyAutoPaused = false;
      partyHoldPlay = false;
      partyApply++;
      try { partyArm('play'); v.play().catch(() => {}); } finally { setTimeout(() => partyApply--, 300); }
      ctlog('roster', { ev: 'auto-resume' });
      hideBuf();
    }
  }
}

/* ----- state reporting + drift correction (1s) ----- */
function partyReady() {
  if (!partyPlayerActive()) return false;
  const target = partyAnchor ? partyAnchor.t : (v.currentTime || 0);
  try {
    const b = v.buffered;
    for (let i = 0; i < b.length; i++) {
      if (target >= b.start(i) - 0.5 && target <= b.end(i) + 0.5 && b.end(i) - target >= 60) return true;
    }
  } catch (e) {}
  if (segInfo && segInfo.done && fullDur && target + 60 >= fullDur) return true;
  return false;
}
function partyTick() {
  if (!party || !partyWs || partyWs.readyState !== 1) return;
  const active = partyPlayerActive();
  const playing = active && !v.paused;
  const pos = active ? (v.currentTime || 0) : ((party.me && party.me.pos) || 0);
  // "Buffering" for the party means: trying to play but starved for >2s,
  // or waiting on a seek past the download frontier.
  let buffering = false;
  if (playing && bufferingSince && Date.now() - bufferingSince > 2000) buffering = true;
  if (playing && pendSeek != null && pendSeekAt && Date.now() - pendSeekAt > 2000) buffering = true;
  partySend({ type: 'state', ready: partyReady(), pos, playing, buffering, file: currentFile });
  if (playing && partyAnchor && partyAnchor.playing) {
    const est = partyAnchor.t + (Date.now() - partyAnchor.at) / 1000;
    if (est > 2 && Math.abs((v.currentTime || 0) - est) > 2.5) {
      ctlog('tick', { ev: 'drift-correct', from: +(v.currentTime || 0).toFixed(1), to: +est.toFixed(1) });
      partyApply++;
      try { seekTo(est, true); } finally { setTimeout(() => partyApply--, 300); }
    }
  }
}

/* ---------- misc ---------- */
function fmtClock(sec) {

  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
  const ss = String(s).padStart(2, '0');
  return (h > 0 ? h + ':' : '') + mm + ':' + ss;
}

function fmtBytes(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(2) + ' MB';
  if (b >= 1e3) return (b / 1e3).toFixed(1) + ' KB';
  return b + ' B';
}

function fmtSpeed(bps) {
  if (bps >= 1e6) return (bps / 1e6).toFixed(1) + ' MB/s';
  if (bps >= 1e3) return (bps / 1e3).toFixed(0) + ' KB/s';
  return bps + ' B/s';
}

function fmtEta(sec) {
  if (!isFinite(sec) || sec < 0) return '—';
  sec = Math.round(sec);
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'm ' + (sec % 60) + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

/* Download progress is notification-driven: `/ws/library` pushes
   `{type:"progress", id}` whenever a torrent's piece map actually changes.
   `pokeProgress` enqueues the id and `pumpProgress` coalesces bursts into one
   in-flight batch (instead of the old every-second full sweep). */
function pokeProgress(id) {
  progQueue.add(String(id));
  pumpProgress();
}
async function pumpProgress() {
  if (progBusy) return;
  progBusy = true;
  try {
    while (progQueue.size) {
      const id = progQueue.values().next().value;
      progQueue.delete(id);
      const row = document.querySelector('#mv-torrents .row[data-id="' + id + '"]');
      if (row) await refreshRow(id, row);
    }
  } finally { progBusy = false; }
}

async function refreshRow(id, row) {
  const st = row.dataset.state;
  if (st !== 'downloading' && st !== 'paused') return;
  try {
    const s = await api('/api/library/' + id + '/status');
    if (!row.isConnected) return;
    if (s.state && s.state !== st) {
      row.dataset.state = s.state;
      refreshLibrary();
      return;
    }
    const p = await api('/api/library/' + id + '/pieces');
    if (!row.isConnected) return;
    applyDlRow(row, id, p, s);
    if (isTvMovie()) {
      // Per-file bars: refresh the file list (have bytes) at most ~1s per
      // torrent per progress event, and re-render that torrent's row plus the
      // visible episode-source rows.
      const now = Date.now();
      if (now - (fileStatsAt.get(id) || 0) >= 1000) {
        fileStatsAt.set(id, now);
        loadFileList(id, true).then(() => {
          if (currentId !== Number(id)) {
            const el = document.querySelector('#mv-torrents .row[data-id="' + id + '"]');
            const t = items.find(i => String(i.id) === id);
            if (el && t) renderTorrentRow(el, t);
            renderTvEpFiles(currentTvTorrents(), movieRep(currentMovie.rows));
            mvSyncSel();
          }
        });
      }
    }
  } catch (e) { /* torrent may be gone; keep row as-is */ }
}

/* One-shot sweep over every visible active row (reconnect/resync/after a
   re-render): enqueue all of them; the pump coalesces with incoming events. */
async function pollDownloads() {
  if (!currentMovie) return;
  for (const row of document.querySelectorAll('#mv-torrents .row[data-id]')) {
    const st = row.dataset.state;
    if (st !== 'downloading' && st !== 'paused') continue;
    pokeProgress(row.dataset.id);
  }
}

/* /ws/library: the single event channel that drives both the library refresh
   and per-torrent progress. No polling intervals run while it is connected. */
let libWs = null, libRetry = 0;
function libraryWsConnect() {
  if (libWs) return;
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  let ws;
  try { ws = new WebSocket(proto + location.host + '/ws/library'); } catch (e) { return; }
  libWs = ws;
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'changed') refreshLibrary();
    else if (m.type === 'progress') pokeProgress(m.id);
    else if (m.type === 'resync') { refreshLibrary(); pollDownloads(); }
  };
  ws.onopen = () => {
    libRetry = 0;
    /* Back from a gap: re-sync anything we missed while disconnected. */
    refreshLibrary();
    pollDownloads();
  };
  ws.onclose = () => {
    if (libWs !== ws) return; // stale replacement socket: ignore
    libWs = null;
    setTimeout(libraryWsConnect, Math.min(10000, 1500 * Math.max(1, ++libRetry)));
  };
}

updVol();
refreshLibrary();
partyWsConnect();
renderPartyBtn();
libraryWsConnect();
/* Degraded fallback: only while /ws/library is down (so the UI never freezes
   on a WS hiccup), re-sync at 5s. The moment the socket is back, polling
   stops and notifications take over again. */
let wsDownTick = 0;
setInterval(() => {
  if (libWs && libWs.readyState === 1) { wsDownTick = 0; return; }
  if (++wsDownTick < 5) return;
  wsDownTick = 0;
  refreshLibrary();
  pollDownloads();
}, 1000);
