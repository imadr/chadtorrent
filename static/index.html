<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadTorrent</title>
</head>
<body>
<style>
  :root {
    --bg: #000000; --panel: #0e0e0e; --panel2: #181818; --line: #3a3a3a;
    --line-hi: #636363; --text: #d4d4d4; --muted: #8a8a8a;
    --accent: #272727; --accent-ink: #e0e0e0;
    --danger: #ff6b6b; --ok: #4ade80; --warn: #f5b544;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .floats { position: fixed; top: 14px; right: 18px; z-index: 40; display: flex; gap: 10px; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .btn { background: var(--panel2); border: 0.5px solid var(--line);
         padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
             stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { border-color: var(--line-hi); }
  .btn.primary { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  main { max-width: 1200px; margin: 0 auto; padding: 26px 22px 60px; }
  main[hidden] { display: none; }
  #view-library { max-width: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .lib-sec { margin-bottom: 36px; }
  .lib-sec[hidden] { display: none; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line);
 overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-3px); border-color: var(--line-hi); }
  .card.sel { border-color: var(--line-hi); box-shadow: 0 0 0 2px rgba(216,216,216,.28); }
  .poster { width: 100%; aspect-ratio: 2/3; background: var(--panel2); display: flex;
            align-items: center; justify-content: center; overflow: hidden; }
  .card .poster img, .bigposter img { width: 100%; height: 100%; object-fit: cover; }
  .poster .ph { font-size: 34px; opacity: .45; }
  .card .meta { padding: 9px 11px; }
  .card .meta .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .y { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  .back { background: none; border: none; color: var(--muted); padding: 0 0 14px; font-size: 14px; }
  .back:hover { color: var(--text); }
  .movie-head { display: flex; gap: 26px; margin-bottom: 30px; flex-wrap: wrap; }
  .bigposter { width: 210px; aspect-ratio: 2/3; overflow: hidden;
               background: var(--panel2); border: 1px solid var(--line); flex-shrink: 0;
               display: flex; align-items: center; justify-content: center; }
  .bigposter .ph { font-size: 56px; opacity: .4; }
  .mv-info h1 { margin: 0 0 6px; font-size: 28px; }
  .mv-info .sub { color: var(--muted); margin-bottom: 18px; }
  .mv-info .mv-desc { margin: 0 0 18px; font-size: 13px; line-height: 1.45;
                      color: var(--muted); max-width: 620px; }
  .mv-info label { display: inline-flex; align-items: center; gap: 8px; margin-right: 14px; cursor: pointer; }
  section { margin: 26px 0; }
  section h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--panel);
         border: 0.5px solid var(--line); padding: 10px 14px; }
  #mv-seasonchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  #mv-seasonchips[hidden] { display: none; }
  #mv-seasonchips .s-chip, #mv-epselect .s-chip { font-size: 12px; padding: 6px 12px; cursor: pointer;
          background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  #mv-seasonchips .s-chip:hover, #mv-epselect .s-chip:hover { border-color: var(--line-hi); }
  #mv-seasonchips .s-chip.sel, #mv-epselect .s-chip.sel { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); }
  #mv-seasonchips .s-chip.kbd-sel, #mv-epselect .s-chip.kbd-sel { box-shadow: 0 0 0 2px var(--line-hi); }
  #mv-epselect { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  #mv-epselect[hidden] { display: none; }
  #mv-epfiles .ep { display: flex; align-items: center; gap: 10px;
                    border: 0.5px solid var(--line); padding: 0 12px 0 14px;
                    height: 68px; overflow: hidden; position: relative; }
  #mv-epfiles .ep.playable { cursor: pointer; }
  #mv-epfiles .ep:hover { background: var(--panel2); border-color: var(--line-hi); }
  #mv-epfiles .ep.sel { background: var(--panel2); border-color: var(--line-hi); box-shadow: inset 0 0 0 1px var(--line-hi); }
  #mv-epfiles .ep-info { flex: 1; min-width: 0; text-align: left; }
  #mv-epfiles .ep-name { font-size: 14px; font-weight: 600; white-space: nowrap;
                         overflow: hidden; text-overflow: ellipsis; }
  #mv-epfiles .ep-file { font-size: 12px; color: var(--muted); margin-top: 3px;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mv-epfiles .ep-side { flex-shrink: 0; min-width: 110px; margin-left: 8px;
                         text-align: right; white-space: nowrap;
                         font-variant-numeric: tabular-nums; font-size: 12px;
                         color: var(--muted); }
  #mv-epfiles .ep-pct { margin-right: 6px; }
  #mv-epfiles .ep-dl { position: absolute; left: 14px; right: 12px; bottom: 6px;
                       height: 3px; background: #333; overflow: hidden; }
  #mv-epfiles .ep-dl .bar { position: absolute; top: 0; bottom: 0; left: 0;
                            background: #3ddc97; }
  #mv-epfiles[hidden] { display: none; }
  #mv-torrents .row { min-height: 68px; }
  .row:hover { background: var(--panel2); border-color: var(--line-hi); }
  .row.sel { background: var(--panel2); border-color: var(--line-hi); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .row .nm { flex: 1; min-width: 0; }
  .row .nm .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .s { color: var(--muted); font-size: 12px; }
  .row .nm .s .se { color: var(--ok); font-weight: 600; }
  .row .nm .s .le { color: var(--danger); font-weight: 600; }
  .dl { display: block; margin-top: 8px; }
  .dl[hidden] { display: none; }
  .dl .bar { display: flex; height: 4px; background: #333; overflow: hidden; }
  .dl .bar b { flex: 1; min-width: 1px; display: block; height: 100%; background: transparent; }
  .dl .txt { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .chip { font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ready { color: var(--ok); border-color: var(--ok); }
  .chip.wait { color: var(--warn); border-color: var(--warn); }
  .row .btn { padding: 6px 12px; font-size: 13px; }
  .row label.seq { display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
                   font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
                   user-select: none; }
  .row label.seq input { accent-color: var(--line-hi); cursor: pointer; }
  .row .ibtn, #mv-epfiles .ep .ibtn { width: 30px; height: 30px; padding: 0; flex-shrink: 0; display: inline-flex;
              align-items: center; justify-content: center; background: var(--panel2);
              border: 0.5px solid var(--line); color: var(--text); }
  .row .ibtn:hover, #mv-epfiles .ep .ibtn:hover { border-color: var(--line-hi); }
  .row .ibtn.primary { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); }
  .row .ibtn.primary:hover { filter: brightness(1.1); }
  .row .ibtn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .row .ibtn svg, #mv-epfiles .ep .ibtn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
                   stroke-linecap: round; stroke-linejoin: round; }
  .formline { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text], input[type=url] { flex: 1; background: var(--panel); color: var(--text);
         border: 1px solid var(--line); padding: 9px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--line-hi); }
  #am-search { width: 100%; display: block; flex: none; }
  .minibtn { font-size: 11px; padding: 3px 10px; margin-left: 8px; vertical-align: 2px;
             background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
             text-transform: none; letter-spacing: 0; }
  .minibtn:hover { border-color: var(--line-hi); color: var(--text); }
  #am-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #am-tabs .s-chip { font-size: 12px; padding: 6px 12px; cursor: pointer;
                     background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  #am-tabs .s-chip:hover { border-color: var(--line-hi); }
  #am-tabs .s-chip.sel { background: var(--accent); border-color: var(--line-hi); color: var(--accent-ink); }
  label.k { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .panel.confirm { max-width: 380px; }
  .cf-msg { color: var(--text); margin: 0 0 20px; line-height: 1.5; white-space: pre-line; }
  .cf-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72);
           display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           width: 620px; max-width: 100%; max-height: 86vh; overflow: auto; padding: 18px; }
  .phead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .phead span { font-weight: 700; font-size: 16px; }
  .x { background: none; border: none; color: var(--muted); font-size: 18px; }
  .x:hover { color: var(--text); }
  .srow { display: flex; gap: 12px; padding: 10px; align-items: center; }
  .srow:hover { background: var(--panel2); }
  .srow.sel { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .srow .poster { width: 46px; height: 69px; aspect-ratio: 2/3; flex-shrink: 0; }
  .srow .poster img, .srow .poster .ph { width: 100%; height: 100%; object-fit: cover; }
  .srow .poster .ph { display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .srow .info { flex: 1; min-width: 0; }
  .srow .info .t { font-weight: 600; font-size: 14px; }
  .srow .info .s { color: var(--muted); font-size: 12px; }
  .divider { border-top: 1px solid var(--line); margin: 16px 0; }

  .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
               margin: 0 0 4px; }
  .kb-table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
  .kb-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .kb-table th.sort { cursor: pointer; user-select: none; }
  .kb-table th.sort:hover { color: var(--text); }
  .kb-table th[data-dir="asc"]::after { content: ' ▲'; font-size: 9px; }
  .kb-table th[data-dir="desc"]::after { content: ' ▼'; font-size: 9px; }
  .kb-table td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .kb-table tbody tr:hover { background: var(--panel2); }
  .kb-key { width: 150px; padding: 5px 10px; border: 1px solid var(--line);
            background: var(--panel2); color: var(--text); font: inherit; font-size: 13px;
            text-align: center; outline: none; cursor: pointer; flex-shrink: 0; }
  .kb-key:hover { border-color: var(--line-hi); }
  .kb-key.rec { border-color: var(--line-hi); box-shadow: 0 0 0 1px var(--line-hi); background: rgba(216,216,216,.10); }
  .kb-ctx { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kb-label { font-size: 14px; min-width: 0; }
  .kb-table select { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text);
                     border: 1px solid var(--line); padding: 5px 9px;
                     font: inherit; font-size: 14px; }
  .kb-table select.placeholder { color: var(--muted); }
  .kb-table select option { padding: 5px 9px; background: var(--panel2); color: var(--text);
                            font: inherit; font-size: 14px; }
  #kb-table tfoot td:nth-child(2), #kb-table tfoot td:nth-child(3) { padding: 5px 12px 5px 0; }
  #nb-key { color: var(--muted); }
  #nb-key.rec { color: var(--text); }
  .kb-table th:last-child, .kb-table td.kb-del { width: 40px; }
  .kb-table td.kb-del { text-align: right; }
  .kb-table .ibtn { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center;
                    justify-content: center; background: transparent; border: 1px solid var(--line);
 color: var(--muted); }
  .kb-table .ibtn:hover { color: var(--danger); border-color: var(--danger); }
  .kb-table .ibtn#nb-add:hover { color: var(--line-hi); border-color: var(--line-hi); }
  .kb-table .ibtn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none;
                        stroke-linecap: round; stroke-linejoin: round; }
  .kb-actions { display: flex; justify-content: flex-start; gap: 10px; margin-top: 2px; }
  /* Settings + Add-to-library panels: fixed height; header bar (title / close /
   * search input) stays put, only the main area scrolls. */
  #settings-modal .panel, #add-modal .panel {
    height: min(88vh, 760px); display: flex; flex-direction: column; overflow: hidden;
  }
  #settings-modal .panel { width: 720px; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding-right: 10px; }
  .am-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; }

  #player-modal { padding: 0; background: #000; }
  #player-modal[hidden] { display: none; }
  .pwrap { position: relative; width: 100vw; height: 100vh; background: #000; }
  #player { display: block; width: 100vw; height: 100vh; background: #000; pointer-events: none; object-fit: contain; }
  body.cursor-none, body.cursor-none * { cursor: none !important; }
  .buf { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; gap: 12px;
         align-items: center; justify-content: center; background: rgba(0,0,0,.45); pointer-events: none; }
  .buf .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2);
               border-top-color: #fff; animation: spin .8s linear infinite; }
  .buf span { color: #fff; font-size: 14px; letter-spacing: .4px; }
  .suboverlay { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
                display: flex; justify-content: center; padding: 0 2%; pointer-events: none; }
  .suboverlay span { max-width: 100%; text-align: center; white-space: pre-line; color: #fff;
                     line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pback { position: absolute; top: 10px; left: 10px; z-index: 6; background: rgba(0,0,0,.6);
           border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 6px 14px; font-size: 14px;
           opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .pback.on { opacity: 1; pointer-events: auto; }
  .pback.on:hover { border-color: #fff; }
  .ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px 10px; display: none; z-index: 7; }
  .strip { display: flex; align-items: center; gap: 10px; }
  .pb { cursor: pointer; padding: 0; width: 32px; height: 32px; background: none; border: none;
        flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .pb.on svg { stroke: var(--ok); }
  .pb svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .tm { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
        flex-shrink: 0; letter-spacing: .3px; }
  .seek { flex: 1; height: 5px; min-width: 0; appearance: none; -webkit-appearance: none;
          background-color: rgba(255,255,255,.15);
          cursor: pointer; border: none; outline: none; }
  .skwrap { flex: 1; display: flex; height: 5px; min-width: 0; position: relative; }
  .sktip { position: absolute; bottom: 12px; transform: translateX(-50%);
           background: rgba(0,0,0,.75); color: #fff; font-size: 12px; line-height: 1;
           padding: 4px 7px; pointer-events: none; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  .seek::-webkit-slider-thumb, .seek::-moz-range-thumb {
          appearance: none; -webkit-appearance: none; height: 0; width: 0;
          background: transparent; border: none; cursor: pointer; }
  .sv { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .subwrap { position: relative; }
  .subpanel { position: absolute; bottom: calc(100% + 12px); right: -10px; width: 400px; max-width: 82vw;
              max-height: 55vh; overflow: auto; background: rgba(10,10,10,.96); border: 1px solid rgba(255,255,255,.25);
              padding: 10px 12px; display: none; z-index: 20; }
  .subpanel.open { display: block; }
  .subpanel h4 { margin: 8px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); font-weight: 600; }
  .subpanel h4:first-child { margin-top: 0; }
  .subrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer; font-size: 13px;
            color: var(--text); border: 1px solid transparent; }
  .subrow:hover { background: var(--panel2); }
  .subrow.active { border-color: var(--line-hi); background: var(--panel2); }
  .subrow .flag { font-size: 16px; flex-shrink: 0; }
  .subrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subrow .dl { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .subrow .dl.sub-del { cursor: pointer; }
  .subrow .dl.sub-del.danger { color: #ff5252; }
  .subpanel .empty { color: var(--muted); font-size: 12px; padding: 4px 8px; }
  .subpanel .oswrap { min-height: 180px; display: flex; flex-direction: column; }
  .subpanel .oswrap h4 { margin-top: 12px; }
  .substyle { display: flex; flex-direction: column; gap: 8px; padding: 2px 8px 10px; }
  .substyle label { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .substyle label span { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .substyle input[type=range] { flex: 1; height: 8px; appearance: none; -webkit-appearance: none;
            background: linear-gradient(to right, #fff var(--val, 50%), #555 0); cursor: pointer;
            border: none; outline: none; }
  .substyle input[type=range]::-webkit-slider-thumb, .substyle input[type=range]::-moz-range-thumb {
            appearance: none; -webkit-appearance: none; height: 0; width: 0; background: transparent; border: none; }

  /* subtitle sync overlay: time-scaled subtitle timeline on the right edge */
  .subsync { position: absolute; top: 0; right: 0; bottom: 48px; width: min(420px, 86vw); z-index: 8;
             display: flex; flex-direction: column;
             background: linear-gradient(to left, rgba(10,10,10,.94), rgba(10,10,10,.8));
             border-left: 1px solid rgba(255,255,255,.16); }
  .ss-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
  .ss-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .ss-delay { margin-left: auto; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ss-mini { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--text);
             font-size: 11px; padding: 3px 10px; flex-shrink: 0; }
  .ss-mini:hover { border-color: #fff; color: #fff; }
  .ss-scrollwrap { position: relative; flex: 1; min-height: 0; }
  .ss-list { position: absolute; inset: 0; overflow-y: auto; touch-action: none;
             user-select: none; -webkit-user-select: none;
             scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
  .ss-list::-webkit-scrollbar { width: 8px; }
  .ss-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); border-radius: 4px; }
  .ss-list::-webkit-scrollbar-track { background: transparent; }
  .ss-track { position: relative; }
  .ss-empty { color: var(--muted); font-size: 12px; padding: 24px 18px; }
  .ss-line { position: absolute; left: 8px; right: 26px; display: flex; gap: 9px; align-items: flex-start;
             padding: 4px 8px; font-size: 12.5px; line-height: 1.35; color: #fff; opacity: .35;
             cursor: grab; transition: opacity .18s ease; border-radius: 3px; }
  .ss-line:hover { opacity: .7; }
  .ss-line.near { opacity: .55; }
  .ss-line.on { opacity: 1; background: rgba(255,255,255,.09); }
  .ss-t { flex-shrink: 0; width: 46px; color: var(--muted); font-size: 10px; padding-top: 2.5px;
          font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .ss-line.on .ss-t { color: rgba(255,255,255,.85); }

{

  def('textTracks', () => (typeof vSubTrack !== 'undefined' && vSubTrack) ? [vSubTrack] : []);
  v.play = () => { playerPlay(); return Promise.resolve(); };
  v.pause = () => playerPause();
  v.load = () => {};

  // called seconds after the click (our session builds asynchronously) is
  // silently rejected and the context stays suspended — the clock pins and

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
}

function confirmBox(msg, yesLabel) {
  return new Promise((resolve) => {
    $('cf-msg').textContent = msg;
    $('cf-yes').textContent = yesLabel || 'Delete';
    $('confirm-modal').hidden = false;
    function done(v) {
      $('confirm-modal').hidden = true;

      $('cf-no').onclick = null;

    $('cf-yes').onclick = () => done(true);
    $('cf-no').onclick = () => done(false);

function isReading(it) { return it && (it.media_type === 'manga' || it.media_type === 'comic'); }

function movieRep(rows) {
  return rows.find(r => r.tmdb_id && !r.magnet) || rows.find(r => r.tmdb_id) || rows[0];
}
function infoHash(mag) {
  const m = (mag || '').match(/btih:([0-9a-fA-F]{40})/);
  return m ? m[1].toLowerCase() : null;
}

function renderGrid() {
  // Map keys are media_type values ('movie'/'tv'/'manga'/'comic').
  const grids = {
    movie: $('grid-movies'), tv: $('grid-tv'),
    manga: $('grid-manga'), comic: $('grid-comics'),
  };
  for (const g of Object.values(grids)) g.innerHTML = '';
  const g = groupItems(items);
  for (const [k, rows] of g) {
    const rep = movieRep(rows);
    const card = document.createElement('div');
    card.className = 'card';
    const ph = isReading(rep) ? '▤' : '▷';
    const posterHtml = rep.poster_path
      ? posterTag(posterURL(rep.poster_path, POSTER_IDX))
      : placeholder(ph);
    card.innerHTML =
      '<div class="poster">' + posterHtml + '</div>' +
      '<div class="meta"><div class="t">' + esc(movieName(rep)) + '</div>' +
      '<div class="y">' + esc(movieYear(rep)) + '</div></div>';
    card.onclick = () => openMovie(k);
    grids[isReading(rep) ? rep.media_type : (rep.media_type === 'tv' ? 'tv' : 'movie')].appendChild(card);
  }
  $('lib-sec-movies').hidden = !grids.movie.children.length;
  $('lib-sec-tv').hidden = !grids.tv.children.length;
  $('lib-sec-manga').hidden = !grids.manga.children.length;
  $('lib-sec-comics').hidden = !grids.comic.children.length;
  libHighlight();
}

function renderPieceBar(bar, have, total) {
  if (!bar) return;
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  let html = '';
  for (let b = 0; b < n; b++) {
    const start = b * per, end = Math.min(total, start + per);
    let c = 0;
    for (let i = start; i < end; i++) if (have[i]) c++;
    const f = (end - start) ? c / (end - start) : 0;
    html += '<b style="background:' + (f > 0 ? (f >= 1 ? '#3ddc97' : 'rgba(61,220,151,' + (0.15 + f * 0.8).toFixed(2) + ')') : 'transparent') + '"></b>';
  }
  bar.innerHTML = html;
}

function piecesToPct(p) {
  let have = [], total = 0, overall = null;
  if (p && p.total) {
    have = p.have; total = p.total;
    let got = 0;
    for (const b of have) if (b) got++;
    overall = (got / total) * 100;
  }
  return { have, total, pct: overall };
}

function applyDlRow(row, id, p, s) {
  const st = row.dataset.state;
  const { have, total, pct: opct } = piecesToPct(p);
  const pct = opct !== null ? opct : Math.max(0, Math.min(100, s.progress_pct || 0));
  const dl = row.querySelector('.dl');
  dl.hidden = false;
  renderPieceBar(dl.querySelector('.bar'), have, total);
  let text;
  if (st === 'paused') {
    text = 'Paused · ' + Math.round(pct) + '%';
  } else {
    const speed = s.download_speed_bps || 0;
    const total = s.total_bytes || 0;
    // ETA from the same percentage the row shows. Never trust the engine's
    // contiguous_bytes for multi-file packs: it measures the contiguous run
    // from 0, not the overall remaining amount, so it understates (or reads
    // zero on) the remainder and prints "ETA 0s" at 47%.
    const remain = total > 0 ? Math.max(0, total * (1 - pct / 100)) : 0;
    const eta = speed > 0 && remain > 0.5 ? remain / speed : null;
    text = Math.round(pct) + '% · ' + fmtSpeed(speed) + (eta !== null ? ' · ETA ' + fmtEta(eta) : '');
  }
  dlState[id] = { pct, text, have, total };
  dl.querySelector('.txt').textContent = text;
}

async function warmDl(id) {
  try {
    const s = await api('/api/library/' + id + '/status');
    const p = await api('/api/library/' + id + '/pieces');
    const row = document.querySelector('#mv-torrents .row[data-id="' + id + '"]');
    if (row && row.dataset.state === 'paused') applyDlRow(row, id, p, s);
  } catch (e) { /* torrent may be gone; keep row as-is */ }
}

async function refreshLibrary() {
  try {
    let srv = await api('/api/library');
    for (const [pid, syn] of pendingRows) {
      const isLive = srv.some(i => infoHash(i.magnet) === infoHash(syn.magnet));
      if (!isLive) srv.push(syn);
    }
    const fp = JSON.stringify(srv);
    const same = fp === libFp;
    libFp = fp;
    if (same) return; // nothing changed — leave the DOM alone
    items = srv;
    if ($('view-library').hidden) gridDirty = true;
    else renderGrid();
    syncMovie();
    renderSearch();
    pollDownloads(); // fresh rows: repaint every active torrent's progress bar
    if (!bootRouted) { bootRouted = true; handleRoute(); }
  }
  catch (e) { console.error('refresh failed', e); }
}

function setView(isMovie) {
  $('view-library').hidden = isMovie;
  $('view-movie').hidden = !isMovie;
  $('btn-add').hidden = isMovie;
  if (!isMovie && gridDirty) {
    // Items changed while the library was hidden: paint once now that it's
    // visible again.
    gridDirty = false;
    renderGrid();
  }
}

function syncMovie() {
  if (!currentMovie) return;
  currentMovie.rows = groupItems(items).get(currentMovie.key) || [];
  if (!currentMovie.rows.length) {
    currentMovie = null;
    setView(false);
  } else {
    renderMovie();
  }
}

/* ---------- movie detail page ---------- */
function openMovie(k, push = true) {
  const rows = groupItems(items).get(k) || [];
  if (!rows.length) return;
  currentMovie = { key: k, rows };
  dlState = {};
  fileLists = new Map();
  fileListsBusy = new Map();
  fileStatsAt = new Map();
  tvSeason = null;
  tvEpisode = null;
  currentFile = null;
  setView(true);
  if (push) pushRoute(movieRoute());
  mvSelIdx = -1;
  window.scrollTo(0, 0);
  renderMovie();
  const rep = movieRep(rows);
  // Reading entries are metadata-only: no torrent search. The meta refresh
  // still runs for them — it's the TTL'd re-check for new chapters/issues.
  if (!isReading(rep)) {
    if (rep.tmdb_id) findTorrents(rep);
  }
  refreshMvMeta(rep);
}

const IC_PLAY = '<svg viewBox="0 0 24 24"><use href="#ic-play"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24"><use href="#ic-pause"/></svg>';
const IC_BIN = '<svg viewBox="0 0 24 24"><use href="#ic-bin"/></svg>';

function renderMovie() {
  const rows = currentMovie.rows;
  const rep = movieRep(rows);
  // The whole content area is destroyed and regenerated from scratch on every
  // render: head (poster/title/sub/delete), season chips, torrents, search
  // section. Nothing survives a render, so nothing can leak between shows or
  // movies by construction.
  $('mv-content').innerHTML =
    '<div class="movie-head">' +
      '<div class="bigposter" id="mv-poster"></div>' +
      '<div class="mv-info">' +
        '<h1 id="mv-title"></h1>' +
        '<div class="sub" id="mv-sub"></div>' +
        '<p class="mv-desc" id="mv-overview"></p>' +
        '<button class="btn danger" id="mv-del">Delete</button>' +
      '</div>' +
    '</div>' +
    '<section id="mv-ch-sec" hidden>' +
      '<h3 id="mv-ch-title">Chapters</h3>' +
      '<div class="rows" id="mv-chapters"></div>' +
    '</section>' +
    '<section id="mv-ep-sec">' +
      '<h3 id="mv-ep-title" hidden>Episodes</h3>' +
      '<div id="mv-seasonchips" hidden></div>' +
      '<div id="mv-epselect" hidden></div>' +
      '<div class="rows" id="mv-epfiles" hidden></div>' +
    '</section>' +
    '<section id="mv-dl-sec">' +
      '<h3>Downloaded contents</h3>' +
      '<div class="rows" id="mv-torrents"></div>' +
    '</section>' +
    '<section id="mv-searchsec" hidden>' +
      '<h3>Find torrents</h3>' +
      '<div class="rows" id="mv-results" style="margin-top:12px"></div>' +
    '</section>';

  $('mv-poster').innerHTML = rep.poster_path
    ? posterTag(posterURL(rep.poster_path, POSTER_MD))
    : placeholder(isReading(rep) ? '▤' : '▷');
  $('mv-title').textContent = movieName(rep);
  $('mv-sub').textContent = [movieYear(rep), kindLabel(rep)].filter(Boolean).join(' · ') || ' ';
  $('mv-del').addEventListener('click', mvDelClick);

  if (isReading(rep)) {
    // A reading entry is just its page: cover, synopsis, chapter list,
    // delete. Everything torrent-ish stays out of the DOM.
    $('mv-ep-sec').hidden = true;
    $('mv-dl-sec').hidden = true;
    $('mv-searchsec').hidden = true;
    const ov = $('mv-overview');
    const t = (rep.overview || '').trim();
    if (t) { ov.hidden = false; ov.textContent = t; }
    else ov.hidden = true;
    // Chapters/issues come from the same cached meta payload as TV episodes
    // (swept from MangaDex/Comic Vine server-side); the list paints when the
    // payload lands.
    ensureMvMeta(rep);
    renderChapters(rep);
    mvSyncSel();
    return;
  }

  $('mv-searchsec').hidden = !rep.tmdb_id;

  applyMvOverview(rep);
  ensureMvMeta(rep);

  const list = $('mv-torrents');
  const torrentRs = rows.filter(r => r.magnet);
  if (rep.media_type === 'tv') {
    renderTV(torrentRs);
  } else if (torrentRs.length) {
    for (const t of torrentRs) {
      const el = document.createElement('div');
      el.dataset.id = t.id;
      list.appendChild(el);
      renderTorrentRow(el, t);
    }
  } else {
    list.innerHTML = '<div class="empty" style="padding:12px 0">No content</div>';
  }
  renderSearch();
  mvSyncSel();
}

function renderTorrentRow(el, t) {
  el.className = 'row';
  el.dataset.state = t.state || '';
  const isDown = t.state === 'downloading';
  const isPaused = t.state === 'paused';
  el.innerHTML =
    '<div class="nm"><div class="t">' + esc(t.title || t.magnet) + '</div>' +
    '<div class="dl"><div class="bar"></div><div class="txt"></div></div></div>';
  const bar = el.querySelector('.bar');
  const txt = el.querySelector('.txt');
  const done = t.state === 'ready';
  bar.style.display = done ? 'none' : '';
  if (isDown && dlState[t.id]) {
    renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
    txt.textContent = dlState[t.id].text;
  } else if (isDown) {
    txt.textContent = 'Starting…';
  } else if (t.state === '_pending' || t.state === 'connecting') {
    txt.textContent = 'Adding…';
  } else if (done) {
    txt.textContent = 'Ready';
  } else if (isPaused) {
    if (dlState[t.id]) {
      renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
      txt.textContent = dlState[t.id].text;
    } else {
      txt.textContent = 'Paused';
      warmDl(t.id);
    }
  } else if (t.state === 'error') {
    txt.textContent = 'Failed';
  } else {
    txt.textContent = 'Stopped';
  }
  const canPlay = t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'error';
  // TV whole-show packs are not a playable unit, so their rows must never play.
  // This is decided by `el.dataset.pack`, a mark stamped on the element once by
  // `renderTV` and left in place across every later re-render, rather than by a
  // per-call option flag: `refreshRow` re-renders these same elements on each
  // progress event and any flag argument is silently dropped there, which used
  // to re-arm `playTorrent` on exactly the downloading/paused rows.
  const isPack = el.dataset.pack === '1';
  if (isPack) {
    el.style.cursor = 'default';
    el.onclick = null;
  } else {
    el.style.cursor = canPlay ? 'pointer' : 'default';
    el.onclick = (e) => {
      if (!canPlay) return;
      if (e.target.closest('button, label, input, a')) return;
      playTorrent(t);
    };
  }
  if (isDown) {
    const pr = document.createElement('button');
    pr.className = 'ibtn'; pr.innerHTML = IC_PAUSE;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/pause', { method: 'POST' }); }
      catch (e) { console.error('pause failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  } else if (isPaused) {
    const pr = document.createElement('button');
    pr.className = 'ibtn primary'; pr.innerHTML = IC_PLAY;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/resume', { method: 'POST' }); }
      catch (e) { console.error('resume failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  }
  const del = document.createElement('button');
  del.className = 'ibtn danger'; del.innerHTML = IC_BIN;
  del.onclick = () => delItem(t);
  el.appendChild(del);
  // Watch-party entry point lives on playable units only: a whole-show pack
  // header is not one (episode rows carry the button instead, and the party
  // is scoped to the episode's file).
  if (!isPack) {
    const ptBtn = document.createElement('button');
    ptBtn.className = 'ibtn';
    ptBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-users"/></svg>';
    ptBtn.title = 'Watch party';
    ptBtn.onclick = (e) => {
      e.stopPropagation();
      if (party && party.item_id === t.id) openPartyModal();
      else partyCreate(t.id);
    };
    el.appendChild(ptBtn);
  }
  if (t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'ready') {
    const seq = document.createElement('label');
    seq.className = 'seq'; seq.title = 'Download pieces in order';
    const box = document.createElement('input');
    box.type = 'checkbox'; box.checked = t.sequential !== false;
    seq.appendChild(box);
    seq.appendChild(document.createTextNode('SEQ'));
    box.onchange = async () => {
      box.disabled = true;
      try {
        await api('/api/library/' + t.id + '/sequential', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sequential: box.checked }),
        });
      } catch (e) { console.error('set sequential failed', e); box.checked = !box.checked; }
      box.disabled = false;
    };
    el.appendChild(seq);
  }
}

/* ---------- TV-show episode UI ----------
 * A TV group renders each torrent as a header row (pause/resume/delete/seq —
 * identical to the movie path) plus a list of episode rows under it. Episode
 * rows use `.ep` (NOT `.row[data-id]`) so pollDownloads / mvFlat / renderMovie
 * keep treating the torrent header as the selectable content row. File lists
 * come from /api/library/{id}/files (season/episode per file + `have`). */

function basename(p) { return String(p || '').split('/').pop(); }
function fileSlug(p) { return slugify(basename(p)); }
/* Short label for an episode file path: "S2E3" when the name carries a
   season/episode marker, else the (truncated) file name. Used in the party
   modal/roster where a full rel path would be noise. */
function epLabel(path) {
  const b = basename(path);
  const m = b.match(/s(\d{1,2})[ ._-]?e(\d{1,3})/i) || b.match(/(\d{1,2})x(\d{1,3})/);
  if (m) return 'S' + parseInt(m[1], 10) + 'E' + parseInt(m[2], 10);
  return b.length > 28 ? b.slice(0, 27) + '…' : b;
}
function segFileQ() {
  return currentFile ? '?file=' + encodeURIComponent(currentFile) : '';
}
function currentTvTorrents() {
  return currentMovie ? currentMovie.rows.filter(r => r.magnet) : [];
}
function isTvMovie() {
  return !!(currentMovie && movieRep(currentMovie.rows) && movieRep(currentMovie.rows).media_type === 'tv');
}

/* Canonical seasons and episode lists come from TMDB (a show "has" seasons
   1..N whether or not the user has torrents for them) — chips are built from
   that list, and torrents are then filtered by the selected season. The same
   detail response powers the description paragraph AND every season's episode
   buttons, and the server serves it from its `tmdb_meta` cache, so opening a
   show paints everything at once and clicking a season never has to wait on a
   TMDB round-trip. Cached per media_type + tmdb_id for the session; `null` is
   the in-flight marker and `false` means the fetch failed (fall back to
   bucket-only chips / no description). */
var mvMetaByTmdb = new Map();
var mvMetaRefreshedAt = new Map();
const MV_META_REFRESH_COOLDOWN = 30 * 60 * 1000;
function mvMetaKey(rep) { return (rep.media_type || 'movie') + ':' + rep.tmdb_id; }
function mvMetaPath(rep) {
  return '/api/meta/' + encodeURIComponent(rep.media_type || 'movie') + '/' + rep.tmdb_id;
}
function tvSeasonsOf(rep) {
  if (!rep || rep.media_type !== 'tv' || !rep.tmdb_id) return null;
  const m = mvMetaByTmdb.get(mvMetaKey(rep));
  const s = m && m.seasons;
  return Array.isArray(s) && s.length ? s : null;
}
function applyMvOverview(rep) {
  const el = $('mv-overview');
  if (!el || !rep || !rep.tmdb_id) return;
  // Reading entries never reach here (their synopsis is set in renderMovie);
  // movies/shows prefer the cached TMDB payload, falling back to the
  // synopsis the search result carried.
  const m = mvMetaByTmdb.get(mvMetaKey(rep));
  const t = (m && m.overview && String(m.overview).trim()) || (rep.overview || '').trim();
  if (t) { el.hidden = false; el.textContent = t; }
  else el.hidden = true;
}
/* Fold a detail payload into the session cache: `episodes` comes back keyed by
   season number ("1" -> [EpisodeInfo, ...]). */
function storeMvMeta(rep, d) {
  const raw = (d && d.episodes) || {};
  const episodes = {};
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
    for (const k in raw) {
      const list = raw[k];
      if (Array.isArray(list)) episodes[k] = list.filter(e => e && e.episode_number != null);
    }
  }
  mvMetaByTmdb.set(mvMetaKey(rep), {
    overview: (d && d.overview) || '',
    seasons: ((d && d.seasons) || []).map(s => String(s.season_number)),
    episodes: episodes,
  });
}
/* Repaint the open detail view from a freshly stored payload — season chips,
   episode buttons, matching file rows and the description. */
function repaintMvMeta(rep) {
  const me = currentMovie && movieRep(currentMovie.rows);
  if (!me || !me.tmdb_id || mvMetaKey(me) !== mvMetaKey(rep)) return;
  if (me.media_type === 'tv') refreshTvView();
  if (isReading(me)) renderChapters(me);
  applyMvOverview(me);
}
/* The chapter (manga) / issue (comic) list. Stored in the same cached meta
 * payload as TV episodes — one season ("1") whose episodes are the rows —
 * swept from MangaDex (real chapter titles) or Comic Vine (real issue
 * names + cover dates). Rows are inert: no reader yet, nothing plays.
 * Newest first by default; the header button flips the order. */
var chDesc = true;
function renderChapters(rep) {
  const sec = $('mv-ch-sec'), box = $('mv-chapters');
  if (!sec || !box) return;
  const m = mvMetaByTmdb.get(mvMetaKey(rep));
  let list = m && m.episodes && m.episodes['1'];
  if (!Array.isArray(list) || !list.length) { sec.hidden = true; return; }
  const isComic = rep.media_type === 'comic';
  list = [...list].sort((a, b) => (chDesc ? -1 : 1) * ((b.episode_number || 0) - (a.episode_number || 0)));
  $('mv-ch-title').innerHTML = (isComic ? 'Issues' : 'Chapters') +
    ' <button id="mv-ch-sort" class="minibtn">' + (chDesc ? 'Newest first' : 'Oldest first') + '</button>';
  $('mv-ch-sort').onclick = () => { chDesc = !chDesc; renderChapters(rep); };
  box.innerHTML = list.map(ch => {
    const n = ch.episode_number;
    const label = ch.name ? n + ' · ' + ch.name : (isComic ? 'Issue ' + n : 'Chapter ' + n);
    const sub = ch.air_date || '';
    return '<div class="row"><div class="nm"><div class="t">' + esc(label) + '</div>' +
           (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div></div>';
  }).join('');
  sec.hidden = false;
}
/* Pull the cached payload (one request, served from SQLite). Replaces any
   existing entry, so it also works as the post-refresh reload. */
function loadMvMeta(rep) {
  const key = mvMetaKey(rep);
  return api(mvMetaPath(rep))
    .then(d => { storeMvMeta(rep, d); repaintMvMeta(rep); })
    // A failed first load is remembered as "no data"; a failed *reload* after a
    // background refresh must not throw away a payload we are already showing.
    .catch(() => { if (mvMetaByTmdb.get(key) === null) mvMetaByTmdb.set(key, false); });
}
function ensureMvMeta(rep) {
  if (!rep || !rep.tmdb_id) return;
  const key = mvMetaKey(rep);
  if (mvMetaByTmdb.has(key)) return;
  mvMetaByTmdb.set(key, null); // in-flight marker; do not refetch this session
  loadMvMeta(rep);
}
/* Background check for newly released seasons/episodes. The TTL lives
   server-side, so this costs two SQLite reads and no TMDB request while the
   stored payload is fresh; when the server did find something new we reload
   the payload and repaint. Throttled client-side so repeated views of the same
   title don't queue up requests. */
function refreshMvMeta(rep) {
  if (!rep || !rep.tmdb_id) return;
  const key = mvMetaKey(rep);
  const now = Date.now();
  if (now - (mvMetaRefreshedAt.get(key) || 0) < MV_META_REFRESH_COOLDOWN) return;
  mvMetaRefreshedAt.set(key, now);
  api(mvMetaPath(rep) + '/refresh', { method: 'POST' })
    .then(d => { if (d && d.updated) loadMvMeta(rep); })
    .catch(() => {});
}

/* Episode buttons for a season. The show's cached bulk payload covers every
   season, so this is a synchronous hit on the render path — no fetch, no
   flicker. The per-season endpoint is only reached for a season the bulk
   payload is missing (failed sweep, or a season that aired since the last
   check). Keyed by tmdb_id + season — season numbers alone are not unique
   across shows. */
var episodesBySeason = new Map();
function episodesOf(rep, season) {
  const m = rep && mvMetaByTmdb.get(mvMetaKey(rep));
  const bulk = m && m.episodes && m.episodes[String(season)];
  if (Array.isArray(bulk)) return bulk;
  const e = episodesBySeason.get(rep.tmdb_id + ':' + season);
  return Array.isArray(e) ? e : null;
}
function ensureTvEpisodes(rep, season) {
  if (!rep || !rep.tmdb_id) return;
  if (Array.isArray((mvMetaByTmdb.get(mvMetaKey(rep)) || {}).episodes?.[String(season)])) return;
  const key = rep.tmdb_id + ':' + season;
  if (episodesBySeason.has(key)) return;
  episodesBySeason.set(key, null); // in-flight marker; do not refetch this session
  api('/api/meta/tv/' + rep.tmdb_id + '/season/' + encodeURIComponent(season))
    .then(d => {
      episodesBySeason.set(key, ((d && d.episodes) || []).filter(e => e.episode_number != null));
      refreshTvView();
    })
    .catch(() => { episodesBySeason.set(key, false); });
}

function loadFileList(id, force) {
  const key = String(id);
  // Optimistic `_pending` rows carry a client-side placeholder id until the
  // server assigns a real one — never issue a request for them.
  if (!/^\d+$/.test(key)) return Promise.resolve(null);
  if (!force && fileLists.has(key)) return Promise.resolve(fileLists.get(key));
  if (!force && fileListsBusy.has(key)) return fileListsBusy.get(key);
  const p = api('/api/library/' + key + '/files')
    .then(r => { const f = (r && r.files) || []; fileLists.set(key, f); return f; })
    .catch(e => { console.error('file list failed', key, e); return null; });
  if (!force) { fileListsBusy.set(key, p); p.finally(() => fileListsBusy.delete(key)); }
  return p;
}

function refreshTvView() {
  if (isTvMovie()) renderTV(currentTvTorrents());
}

function renderTV(torrentRs) {
  const rep = movieRep(currentMovie.rows);
  ensureMvMeta(rep);
  // Chips are the show's canonical TMDB seasons and nothing else.
  const seasons = tvSeasonsOf(rep) || [];
  const chips = $('mv-seasonchips');
  chips.hidden = !seasons.length;
  if (seasons.length) {
    if (!seasons.includes(tvSeason)) { tvSeason = seasons[0]; tvEpisode = null; }
    chips.innerHTML = seasons.map(k =>
      '<button class="s-chip' + (tvSeason === k ? ' sel' : '') + '" data-season="' + k + '">' +
      'Season ' + k + '</button>').join('');
    chips.onclick = (e) => {
      const btn = e.target.closest('button.s-chip');
      if (!btn || String(btn.dataset.season) === String(tvSeason)) return;
      tvSeason = btn.dataset.season;
      tvEpisode = null;
      renderTV(currentTvTorrents());
    };
  }

  // Fetch any missing file lists — a torrent contributes no episode rows until
  // its list lands; re-render only when new data actually arrived. Never loop:
  // `_pending` rows have no server id (nothing to fetch), in-flight loads are
  // skipped via `fileListsBusy`, and failures don't trigger a re-render.
  for (const t of torrentRs) {
    if (t.state === '_pending') continue;
    const key = String(t.id);
    if (fileLists.has(key) || fileListsBusy.has(key)) continue;
    loadFileList(t.id).then(files => {
      if (files && files.length) refreshTvView();
    });
  }

  renderTvEpisodes(rep);
  renderTvEpFiles(torrentRs, rep);
  $('mv-ep-title').hidden = false;

  // Every torrent added for the show, plain rows — no season/episode grouping.
  // Rows are not clickable: a whole-show pack is not a playable unit; browse
  // the episode rows above instead.
  const list = $('mv-torrents');
  list.innerHTML = '';
  if (!torrentRs.length) {
    list.innerHTML = '<div class="empty" style="padding:12px 0">No content</div>';
  } else {
    for (const t of torrentRs) {
      const el = document.createElement('div');
      el.dataset.id = t.id;
      el.dataset.pack = '1';
      list.appendChild(el);
      renderTorrentRow(el, t);
    }
  }
  mvSyncSel();
}

/* Episode buttons for the selected season (number · name, from TMDB). The
   first episode is selected by default so the file rows below are never
   stranded empty. */
function renderTvEpisodes(rep) {
  const box = $('mv-epselect');
  if (!box || !rep || rep.media_type !== 'tv' || !tvSeason) {
    if (box) box.hidden = true;
    return;
  }
  ensureTvEpisodes(rep, tvSeason);
  const eps = episodesOf(rep, tvSeason);
  if (!eps) { box.hidden = true; return; }   // loading or failed — nothing yet
  // An announced season TMDB has no episodes for yet: say so instead of
  // indexing into an empty list. `flex-basis:100%` makes it span the flex row
  // (like the "No content" message) so its centered text is actually centered.
  if (!eps.length) {
    box.hidden = false;
    box.innerHTML = '<div class="empty" style="padding:12px 0;flex-basis:100%">No episodes listed yet</div>';
    box.onclick = null;
    tvEpisode = null;
    return;
  }
  eps.sort((a, b) => a.episode_number - b.episode_number);
  if (!tvEpisode || !eps.some(e => String(e.episode_number) === String(tvEpisode))) {
    tvEpisode = String(eps[0].episode_number);
  }
  box.hidden = false;
  box.innerHTML = eps.map(e => {
    const n = String(e.episode_number);
    return '<button class="s-chip' + (String(tvEpisode) === n ? ' sel' : '') + '" data-ep="' + n + '">' +
      'E' + n + ' · ' + esc(e.name || 'Episode ' + n) + '</button>';
  }).join('');
  box.onclick = (e) => {
    const btn = e.target.closest('button.s-chip');
    if (!btn || String(tvEpisode) === btn.dataset.ep) return;
    tvEpisode = btn.dataset.ep;
    const rep0 = movieRep(currentMovie.rows);
    renderTvEpisodes(rep0);
    renderTvEpFiles(currentTvTorrents(), rep0);
  };
}

/* Rows for the selected episode's file from every torrent that contains it —
   a whole-show pack, a single-season pack, or a single-episode torrent all
   contribute a row for the matching file. */
function renderTvEpFiles(torrentRs, rep) {
  const box = $('mv-epfiles');
  if (!box || !rep || rep.media_type !== 'tv' || !tvSeason || !tvEpisode) {
    if (box) box.hidden = true;
    return;
  }
  const matches = [];
  for (const t of torrentRs) {
    const fl = fileLists.get(String(t.id));
    if (!fl) continue;
    for (const f of fl) {
      if (f.video && String(f.season) === String(tvSeason) && String(f.episode) === String(tvEpisode)) {
        matches.push({ t, f });
      }
    }
  }
  box.hidden = false;
  box.innerHTML = '';
  if (!matches.length) {
    box.innerHTML = '<div class="empty" style="padding:12px 0">No downloaded source for this episode.</div>';
    return;
  }
  for (const { t, f } of matches) {
    const r = document.createElement('div');
    r.className = 'ep';
    r.dataset.file = f.path;
    box.appendChild(r);
    renderEpFileRow(r, t, f);
  }
}

function renderEpFileRow(r, t, f) {
  const done = t.state === 'ready';
  const skipped = !!f.skipped;
  const canPlay = t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'error';
  const nm = basename(f.path);
  const have = f.have || 0, size = f.size || 0;
  const pct = size ? Math.min(100, (have / size) * 100) : 0;
  // Busy = bytes actually still landing; a file that's fully downloaded shows
  // no bar and no % even if the rest of the pack is still coming.
  const busy = have > 0 && have < size;
  r.innerHTML =
    '<div class="ep-info">' +
      '<div class="ep-name">' + esc(t.title || t.magnet) + '</div>' +
      '<div class="ep-file">' + esc(nm) + '</div>' +
    '</div>' +
    '<div class="ep-side">' +
      (busy ? '<span class="ep-pct">' + Math.round(pct) + '%</span>' : '') +
      '<span class="ep-size">' + esc(fmtBytes(size)) + '</span>' +
    '</div>' +
    (busy ? '<div class="ep-dl"><div class="bar" style="width:' + pct + '%"></div></div>' : '');
  const playable = canPlay && !skipped && (have > 0 || done);
  r.classList.toggle('playable', playable);
  r.onclick = (e) => {
    if (!playable || e.target.closest('button, label, input, a')) return;
    playTorrent(t, f.path);
  };
  // Watch-party entry point for TV: the party is scoped to this episode's
  // file, so everyone lands on (and follows switches to) the same episode.
  const pt = document.createElement('button');
  pt.className = 'ibtn';
  pt.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-users"/></svg>';
  pt.title = 'Watch party';
  pt.onclick = (e) => {
    e.stopPropagation();
    if (party && party.item_id === t.id) openPartyModal();
    else partyCreate(t.id, f.path);
  };
  r.appendChild(pt);
}

/* Lowest-numbered playable episode for a torrent (header click / keybinding).
 * "Playable" = not skipped and has at least some bytes on disk/engine. */
function pickEpisodeToPlay(t) {
  const files = fileLists.get(String(t.id)) || [];
  const playable = files.filter(f => f.video && !f.skipped && (f.have || 0) > 0);
  const pool = playable.length ? playable : files.filter(f => f.video && !f.skipped);
  if (!pool.length) return null;
  pool.sort((a, b) => {
    const s = (a.season != null ? a.season : 9999) - (b.season != null ? b.season : 9999);
    if (s) return s;
    const e = (a.episode != null ? a.episode : 99999) - (b.episode != null ? b.episode : 99999);
    if (e) return e;
    return a.path.localeCompare(b.path);
  });
  return pool[0];
}

async function setFileSelected(t, path, selected) {
  const id = String(t.id);
  try {
    await api('/api/library/' + id + '/file', {
      method: 'POST',
      body: JSON.stringify({ file: path, selected }),
    });
  } catch (e) { console.error('file toggle failed', e); }
  fileLists.delete(id);
  fileStatsAt.delete(id);
  await loadFileList(id, true);
  refreshTvView();
  refreshLibrary();
}

async function delItem(t) {
  if (t.state === '_pending') {
    // Cancelling an optimistic add: drop it locally, no server call.
    const syn = pendingRows.get(t.id);
    if (syn && syn.abort) syn.abort();
    pendingRows.delete(t.id);
    items = items.filter(i => i.id !== t.id);
    syncMovie();
    renderSearch();
    return;
  }
  if (!(await confirmBox('Remove this torrent and delete all of its files?'))) return;
  try { await api('/api/library/' + t.id, { method: 'DELETE' }); }
  catch (e) { console.error('delete failed', e); }
  refreshLibrary();
}

async function mvDelClick() {
  const kind = currentMovie ? kindLabel(movieRep(currentMovie.rows)) : '';
  const msg = kind === 'Manga' || kind === 'Comic'
    ? 'Delete this ' + kind.toLowerCase() + ' from the library?'
    : 'Delete this movie and all of its contents from the library?';
  if (!(await confirmBox(msg))) return;
  const rep = movieRep(currentMovie.rows);
  if (rep) {
    // Cancel any in-flight optimistic adds for this movie first.
    const dropPids = [], dead = [];
    for (const [pid, syn] of pendingRows) {
      if (rep.tmdb_id && syn.tmdb_id && syn.tmdb_id === rep.tmdb_id) {
        dropPids.push(pid);
        if (syn.abort) syn.abort();
        dead.push(pid);
      }
    }
    for (const pid of dropPids) pendingRows.delete(pid);
    items = items.filter(i => !dead.includes(i.id));
    try { await api('/api/library/' + rep.id + '?hard=1', { method: 'DELETE' }); }
    catch (e) { console.error('movie delete failed', e); }
    renderSearch();
  }
  if (currentId !== null) stopPlayback();
  currentMovie = null;
  setView(false);
  refreshLibrary();
}

$('btn-back').addEventListener('click', () => {
  currentMovie = null;
  setView(false);
  pushRoute('/library');
});

let findSeq = 0;
async function findTorrents(rep) {
  const seq = ++findSeq;
  const box = $('mv-results');
  box.innerHTML = '<div class="empty" style="padding:10px 0">Searching…</div>';
  try {
    const res = await api('/api/torrents?q=' + encodeURIComponent(rep.title || ''));
    if (seq !== findSeq) return;   // a newer search started — discard stale results
    searchResults = res;
    curRep = rep;
    renderSearch();
  } catch (e) {
    if (seq !== findSeq) return;
    searchResults = [];
    box.innerHTML = '<div class="empty" style="padding:10px 0">' + esc(e.message) + '</div>';
  }
}

/* Torrent search results ordering. The indexer already returns seeders-desc;
 * the cycle button re-sorts the same list locally. */
var torrentSort = 'seeders';
const TORRENT_SORT_LABEL = { seeders: 'Seeders', name: 'Name', size: 'Size' };
function sortSearchResults(list) {
  const s = [...list];
  if (torrentSort === 'name') s.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  else if (torrentSort === 'size') s.sort((a, b) => (b.size_bytes || 0) - (a.size_bytes || 0));
  else s.sort((a, b) => (b.seeders || 0) - (a.seeders || 0));
  return s;
}

function renderSearch() {
  const box = $('mv-results');
  if (!box) return;
  // Stale-response guard: `searchResults`/`curRep` are globals shared across
  // movies. Only render when the search belongs to the movie currently open
  // (otherwise refreshLibrary ticks + background fetches would dump the
  // previous movie's torrent links into this one's "Find torrents" box, and
  // clicking one would attach it to the wrong movie).
  const rep = currentMovie ? movieRep(currentMovie.rows) : null;
  // media_type in the guard too: different catalogues (TMDB/MangaDex/Comic
  // Vine) reuse the same numeric ids, so a bare id match could render one
  // catalogue's torrents under another's title.
  if (!curRep || !rep || curRep.tmdb_id !== rep.tmdb_id || curRep.media_type !== rep.media_type) return;
  box.innerHTML = '';
  if (!searchResults.length) {
    box.innerHTML = '<div class="empty" style="padding:10px 0">No results from the indexer.</div>';
    return;
  }
  const tsort = document.createElement('button');
  tsort.className = 'minibtn';
  tsort.style.marginLeft = '0';
  tsort.style.marginBottom = '8px';
  tsort.textContent = 'Sort: ' + TORRENT_SORT_LABEL[torrentSort];
  tsort.onclick = () => {
    const keys = Object.keys(TORRENT_SORT_LABEL);
    torrentSort = keys[(keys.indexOf(torrentSort) + 1) % keys.length];
    renderSearch();
  };
  box.appendChild(tsort);
  const addedHashes = new Set(items.filter(i => i.magnet).map(i => infoHash(i.magnet)).filter(Boolean));
  for (const t of sortSearchResults(searchResults)) {
    const row = document.createElement('div');
    row.className = 'row';
    const sz = t.size_bytes ? fmtBytes(t.size_bytes) : '';
    const se = '<span class="se">' + (t.seeders || 0) + '</span> seeders / <span class="le">' + (t.leechers || 0) + '</span> leechers';
    row.innerHTML =
      '<div class="nm"><div class="t">' + esc(t.name) + '</div>' +
      '<div class="s">' + sz + (sz ? ' · ' : '') + se + '</div></div>';
    const add = document.createElement('button');
    const h = infoHash(t.magnet);
    const isAdded = addedHashes.has(h);
    const pending = searchPending.has(h);
    add.className = 'btn' + (isAdded || pending ? '' : ' primary');
    add.disabled = isAdded || pending;
    add.textContent = isAdded ? '✓ Added' : (pending ? 'Adding…' : 'Add');
    if (!isAdded && !pending) add.onclick = () => addTorrentFromSearch(t);
    row.appendChild(add);
    box.appendChild(row);
  }
  mvSyncSel();
}

async function addTorrentFromSearch(t) {
  const h = infoHash(t.magnet);
  if (!h || searchPending.has(h)) return;
  const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rep = curRep || {};
  const ctl = new AbortController();
  const syn = {
    id: pid, magnet: t.magnet, title: t.name, state: '_pending',
    tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null,
    poster_path: rep.poster_path || null, year: rep.year || null,
    size_bytes: t.size_bytes || 0, abort: ctl
  };
  searchPending.set(h, pid);
  pendingRows.set(pid, syn);
  items.push(syn);
  renderSearch();
  syncMovie();
  try {
    await api('/api/library', {
      method: 'POST',
      signal: ctl.signal,
      body: JSON.stringify({
        magnet: t.magnet,
        year: rep.year || null, poster_path: rep.poster_path || null,
        tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null
      })
    });
  } catch (e) {
    if (e.name !== 'AbortError') console.error('add failed', e);
    pendingRows.delete(pid);
    items = items.filter(i => i.id !== pid);
  } finally {
    searchPending.delete(h);
    pendingRows.delete(pid);
  }
  refreshLibrary();
}

/* ---------- add modal (movie/TV/manga/comics search) ----------
 * One search box, one catalogue per tab: TMDB multi-search for movies &
 * shows, MangaDex for manga, Comic Vine for comics. Every catalogue returns
 * the same result shape, so the rows and the Add button are shared. */
let amTab = 'media';
const AM_PLACEHOLDER = { media: 'Search movies & shows…', manga: 'Search manga…', comics: 'Search comics…' };
const AM_ENDPOINT = { media: '/api/search', manga: '/api/search/manga', comics: '/api/search/comics' };
function amKind(r) { return { tv: 'TV', manga: 'Manga', comic: 'Comic' }[r.media_type] || 'Movie'; }
function amSetTab(tab) {
  amTab = tab;
  [...$('am-tabs').querySelectorAll('.s-chip')].forEach(b => b.classList.toggle('sel', b.dataset.tab === tab));
  $('am-search').placeholder = AM_PLACEHOLDER[tab] || 'Search…';
  const q = $('am-search').value.trim();
  if (q) doSearch(q);
  else { $('am-results').innerHTML = ''; amSet([], -1); }
}
$('am-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button.s-chip');
  if (btn) amSetTab(btn.dataset.tab);
});

let searchTimer = null;
function openAdd() { $('add-modal').hidden = false; amSel = -1; $('am-search').placeholder = AM_PLACEHOLDER[amTab] || 'Search…'; $('am-search').focus(); }
function closeAdd() { $('add-modal').hidden = true; amSel = -1; $('am-results').innerHTML = ''; $('am-search').value = ''; }
$('btn-add').addEventListener('click', openAdd);
$('am-close').addEventListener('click', closeAdd);
$('add-modal').addEventListener('click', (e) => { if (e.target === $('add-modal')) closeAdd(); });

let amSel = -1;
const amRows = () => [...$('am-results').querySelectorAll('.srow')];
function amSet(rows, i) {
  rows.forEach((r, j) => r.classList.toggle('sel', j === i));
  if (i >= 0 && rows[i]) rows[i].scrollIntoView({ block: 'nearest' });
  amSel = i;
}
$('am-search').addEventListener('keydown', (e) => {
  const rows = amRows();
  if (e.key === 'ArrowDown') {
    if (!rows.length) return;
    e.preventDefault();
    amSet(rows, amSel < 0 ? 0 : Math.min(rows.length - 1, amSel + 1));
  } else if (e.key === 'ArrowUp') {
    if (amSel < 0) return;
    e.preventDefault();
    amSet(rows, amSel === 0 ? -1 : amSel - 1);
  } else if (e.key === 'Enter' && amSel >= 0 && rows[amSel]) {
    e.preventDefault();
    const b = rows[amSel].querySelector('button');
    if (b) b.click();
  }
});
$('am-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = $('am-search').value.trim();
  amSet([...$('am-results').querySelectorAll('.srow')], -1);
  if (!q) { $('am-results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
});

let amSeq = 0;
async function doSearch(q) {
  const seq = ++amSeq;
  const box = $('am-results');
  amSel = -1;
  box.innerHTML = '<div class="empty" style="padding:10px 0">Searching…</div>';
  try {
    const res = await api(AM_ENDPOINT[amTab] + '?q=' + encodeURIComponent(q));
    if (seq !== amSeq || $('add-modal').hidden) return;   // superseded or closed
    box.innerHTML = '';
    if (!res.length) { box.innerHTML = '<div class="empty" style="padding:10px 0">No results.</div>'; return; }
    for (const r of res) {
      const row = document.createElement('div');
      row.className = 'srow';
      const p = r.poster_path
        ? posterTag(posterURL(r.poster_path, POSTER_IDX))
        : placeholder((r.media_type === 'manga' || r.media_type === 'comic') ? '▤' : '▷');
      row.innerHTML =
        '<div class="poster">' + p + '</div>' +
        '<div class="info"><div class="t">' + esc(r.title) + '</div>' +
        '<div class="s">' + (r.year || '') + (r.year ? ' · ' : '') + amKind(r) + '</div></div>';
      const add = document.createElement('button');
      add.className = 'btn'; add.textContent = 'Add';
      add.onclick = async () => {
        add.disabled = true;
        try {
          await api('/api/movies', { method: 'POST', body: JSON.stringify({
            title: r.title, year: r.year, poster_path: r.poster_path,
            tmdb_id: r.id, media_type: r.media_type, overview: r.overview || null,
            ext_key: r.ext_key || null
          })});
          closeAdd();
          refreshLibrary();
        } catch (e) { console.error('add failed', e); add.disabled = false; }
      };
      row.appendChild(add);
      box.appendChild(row);
    }
  } catch (e) {
    if (seq === amSeq && !$('add-modal').hidden)
      box.innerHTML = '<div class="empty" style="padding:10px 0">' + esc(e.message) + '</div>';
  }
}

/* ---------- WebCodecs segment player ----------
 * Same server pipeline (ffmpeg -c copy -> fragmented MP4 segments, one path
 * for every item state), new client: the fragments are demuxed in JS and the
 * samples go straight to VideoDecoder/AudioDecoder (WebCodecs). Video frames
 * are painted onto the canvas; audio is scheduled on a WebAudio timeline
 * which doubles as the master clock. There is NO browser media buffer at all:
 * no SourceBuffer quota, no keyframe-group eviction rules, no per-browser
 * append quirks. A seek is just "reset the decoders, fetch the segment that
 * contains the target, decode from its first sync sample" — instant once the
 * data exists, a real wait with the spinner while the torrent downloads it. */
const SEG_AHEAD = 45;         // seconds of media to keep fetched+queued ahead
const SEG_MAX_VQ = 30;        // decoded video frames held before backpressure
let segGen = 0;               // session generation; bumped on every reset
let resumeAt = 0;
let pendSeek = null, pendSeekAt = 0;  // pending seek target (party buffering rule)
let bufferingSince = 0;
let segAbort = null;
const segSleep = (ms) => new Promise(r => setTimeout(r, ms));

const P = {
  id: null, tracks: null, segs: new Map(), segMaxN: 0, done: false,
  vdec: null, adec: null,
  vq: [], aq: [],             // decoded, not yet shown/played
  chunksV: [], chunksA: [],   // raw chunks waiting for decoder headroom
  fetchN: 1, fedUntil: 0, eof: false, endedFired: false, needKey: false,
  seekFloor: 0,               // after a seek: drop decoded outputs older than this
  aStepUs: 0,                 // container's per-packet audio duration (clock truth)
  aTrimUs: 0,                 // AAC decoder-delay trim (native-player parity, see startEngine)
  ctx: null, gain: null, nextAt: 0,
  anchor: null,               // {ctx, media} — media time at the end of the last scheduled audio buffer
  noAudio: false,             // no usable audio track/decoder: wall clock is the master
  wall: null,                 // {ctx, media} — wall-master anchor (video-only mode), reset per seek
  // (window.__ac/__vc counters are temporary sink diagnostics)
  paused: true,
  lastT: 0, flow: 0,          // flow = performance.now() of the last painted frame
  vol: 1, muted: false, err: null, tickOn: false, canplaySent: false,
};

/* Master clock. Audio is scheduled ahead on the WebAudio timeline; the
 * playhead interpolates linearly towards the end of the last scheduled buffer.
 * Suspending the AudioContext on pause freezes ctx.currentTime and therefore
 * the playhead, for free.
 *
 * Two standard handoffs (the same model mpv uses):
 *  - audio EOF with video remaining (credits after the last audio packet):
 *    once every audio chunk is decoded AND scheduled AND sounded, advance the
 *    playhead by wall time past the last anchor — otherwise the clock pins at
 *    the audio end and the video tail can never play (Django: video 1.14s
 *    longer than audio; 'ended' never fired, the movie just froze).
 *  - no audio track at all: the wall clock IS the master (anchored at each
 *    seek; ctx.suspend on pause freezes it like the audio clock). */
function audioEnded() {
  if (!P.eof || P.chunksA.length || P.aq.length) return false;
  if (P.adec && P.adec.state === 'configured' && P.adec.decodeQueueSize > 0) return false;
