<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadTorrent</title>
</head>
<body>
<style>
  :root {
    --bg: #0c0c0c; --panel: #151515; --panel2: #1d1d1d; --line: #2d2d2d;
    --text: #e2e2e2; --muted: #999999; --accent: #c4c4c4; --danger: #ff5f6d;
    --ok: #3ddc84;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .floats { position: fixed; top: 14px; right: 18px; z-index: 40; display: flex; gap: 10px; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .btn { background: var(--panel2); border: 1px solid var(--line);
         padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
             stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0c0c0c; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  main { max-width: 1200px; margin: 0 auto; padding: 26px 22px 60px; }
  main[hidden] { display: none; }
  #view-library { max-width: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line);
 overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(220,220,220,.30); }
  .poster { width: 100%; aspect-ratio: 2/3; background: var(--panel2); display: flex;
            align-items: center; justify-content: center; overflow: hidden; }
  .card .poster img, .bigposter img { width: 100%; height: 100%; object-fit: cover; }
  .poster .ph { font-size: 34px; opacity: .45; }
  .card .meta { padding: 9px 11px; }
  .card .meta .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .y { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #0c0c0c;
           font-size: 11px; font-weight: 700; padding: 2px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  .back { background: none; border: none; color: var(--muted); padding: 0 0 14px; font-size: 14px; }
  .back:hover { color: var(--text); }
  .movie-head { display: flex; gap: 26px; margin-bottom: 30px; flex-wrap: wrap; }
  .bigposter { width: 210px; aspect-ratio: 2/3; overflow: hidden;
               background: var(--panel2); border: 1px solid var(--line); flex-shrink: 0;
               display: flex; align-items: center; justify-content: center; }
  .bigposter .ph { font-size: 56px; opacity: .4; }
  .mv-info h1 { margin: 0 0 6px; font-size: 28px; }
  .mv-info .sub { color: var(--muted); margin-bottom: 18px; }
  .mv-info label { display: inline-flex; align-items: center; gap: 8px; margin-right: 14px; cursor: pointer; }
  section { margin: 26px 0; }
  section h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--panel);
         border: 1px solid var(--line); padding: 10px 14px; }
  #mv-torrents .row { min-height: 68px; }
  .row:hover { background: var(--panel2); border-color: var(--accent); }
  .row.sel { background: var(--panel2); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .row .nm { flex: 1; min-width: 0; }
  .row .nm .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .s { color: var(--muted); font-size: 12px; }
  .row .nm .s .se { color: var(--ok); font-weight: 600; }
  .row .nm .s .le { color: var(--danger); font-weight: 600; }
  .dl { display: block; margin-top: 8px; }
  .dl[hidden] { display: none; }
  .dl .bar { display: flex; height: 4px; background: var(--panel2); overflow: hidden; }
  .dl .bar b { flex: 1; min-width: 1px; display: block; height: 100%; background: transparent; }
  .dl .txt { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .chip { font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ready { color: var(--ok); border-color: var(--ok); }
  .chip.wait { color: #f0b429; border-color: #f0b429; }
  .row .btn { padding: 6px 12px; font-size: 13px; }
  .row label.seq { display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
                   font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
                   user-select: none; }
  .row label.seq input { accent-color: var(--accent); cursor: pointer; }
  .row .ibtn { width: 30px; height: 30px; padding: 0; flex-shrink: 0; display: inline-flex;
              align-items: center; justify-content: center; background: var(--panel2);
              border: 1px solid var(--line); color: var(--text); }
  .row .ibtn:hover { border-color: var(--accent); }
  .row .ibtn.primary { background: var(--accent); border-color: var(--accent); color: #0c0c0c; }
  .row .ibtn.primary:hover { filter: brightness(1.1); }
  .row .ibtn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .row .ibtn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
                   stroke-linecap: round; stroke-linejoin: round; }
  .formline { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text], input[type=url] { flex: 1; background: var(--panel); color: var(--text);
         border: 1px solid var(--line); padding: 9px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  #am-search { width: 100%; display: block; flex: none; }
  label.k { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .panel.confirm { max-width: 380px; }
  .cf-msg { color: var(--text); margin: 0 0 20px; line-height: 1.5; white-space: pre-line; }
  .cf-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,8,.8);
           display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           width: 620px; max-width: 100%; max-height: 86vh; overflow: auto; padding: 18px; }
  .phead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .phead span { font-weight: 700; font-size: 16px; }
  .x { background: none; border: none; color: var(--muted); font-size: 18px; }
  .x:hover { color: var(--text); }
  .srow { display: flex; gap: 12px; padding: 10px; align-items: center; }
  .srow:hover { background: var(--panel2); }
  .srow.sel { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--accent); }
  .srow .poster { width: 46px; height: 69px; aspect-ratio: 2/3; flex-shrink: 0; }
  .srow .poster img, .srow .poster .ph { width: 100%; height: 100%; object-fit: cover; }
  .srow .poster .ph { display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .srow .info { flex: 1; min-width: 0; }
  .srow .info .t { font-weight: 600; font-size: 14px; }
  .srow .info .s { color: var(--muted); font-size: 12px; }
  .divider { border-top: 1px solid var(--line); margin: 16px 0; }

  .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
               margin: 0 0 4px; }
  .kb-table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
  .kb-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .kb-table th.sort { cursor: pointer; user-select: none; }
  .kb-table th.sort:hover { color: var(--text); }
  .kb-table th[data-dir="asc"]::after { content: ' ▲'; font-size: 9px; }
  .kb-table th[data-dir="desc"]::after { content: ' ▼'; font-size: 9px; }
  .kb-table td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .kb-table tbody tr:hover { background: var(--panel2); }
  .kb-key { width: 150px; padding: 5px 10px; border: 1px solid var(--line);
            background: var(--panel2); color: var(--text); font: inherit; font-size: 13px;
            text-align: center; outline: none; cursor: pointer; flex-shrink: 0; }
  .kb-key:hover { border-color: var(--accent); }
  .kb-key.rec { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: rgba(220,220,220,.12); }
  .kb-ctx { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kb-label { font-size: 14px; min-width: 0; }
  .kb-table select { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text);
                     border: 1px solid var(--line); padding: 5px 9px;
                     font: inherit; font-size: 14px; }
  .kb-table select.placeholder { color: var(--muted); }
  .kb-table select option { padding: 5px 9px; background: var(--panel2); color: var(--text);
                            font: inherit; font-size: 14px; }
  #kb-table tfoot td:nth-child(2), #kb-table tfoot td:nth-child(3) { padding: 5px 12px 5px 0; }
  #nb-key { color: var(--muted); }
  #nb-key.rec { color: var(--text); }
  .kb-table th:last-child, .kb-table td.kb-del { width: 40px; }
  .kb-table td.kb-del { text-align: right; }
  .kb-table .ibtn { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center;
                    justify-content: center; background: transparent; border: 1px solid var(--line);
 color: var(--muted); }
  .kb-table .ibtn:hover { color: var(--danger); border-color: var(--danger); }
  .kb-table .ibtn#nb-add:hover { color: var(--accent); border-color: var(--accent); }
  .kb-table .ibtn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none;
                        stroke-linecap: round; stroke-linejoin: round; }
  .kb-actions { display: flex; justify-content: flex-start; gap: 10px; margin-top: 2px; }
  /* Settings + Add-to-library panels: fixed height; header bar (title / close /
   * search input) stays put, only the main area scrolls. */
  #settings-modal .panel, #add-modal .panel {
    height: min(88vh, 760px); display: flex; flex-direction: column; overflow: hidden;
  }
  #settings-modal .panel { width: 720px; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding-right: 10px; }
  .am-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; }

  #player-modal { padding: 0; background: #000; }
  #player-modal[hidden] { display: none; }
  .pwrap { position: relative; width: 100vw; height: 100vh; background: #000; }
  #player { display: block; width: 100vw; height: 100vh; background: #000; pointer-events: none; object-fit: contain; }
  .buf { position: absolute; left: 0; right: 0; top: 0; bottom: 48px; z-index: 5; display: flex; flex-direction: column; gap: 12px;
         align-items: center; justify-content: center; background: rgba(0,0,0,.45); pointer-events: none; }
  .buf .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2);
               border-top-color: #fff; animation: spin .8s linear infinite; }
  .buf span { color: #fff; font-size: 14px; letter-spacing: .4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pback { position: absolute; top: 10px; left: 10px; z-index: 6; background: rgba(0,0,0,.6);
           border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 6px 14px; font-size: 14px;
           opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .pback.on { opacity: 1; pointer-events: auto; }
  .pback.on:hover { border-color: #fff; }
  .ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px 10px; display: none; z-index: 7; }
  .strip { display: flex; align-items: center; gap: 10px; }
  .pb { cursor: pointer; padding: 0; width: 32px; height: 32px; background: none; border: none;
        flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .pb svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .tm { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
        flex-shrink: 0; letter-spacing: .3px; }
  .seek { flex: 1; height: 5px; min-width: 0; appearance: none; -webkit-appearance: none;
          background-color: rgba(255,255,255,.15);
          cursor: pointer; border: none; outline: none; }
  .skwrap { flex: 1; display: flex; height: 5px; min-width: 0; position: relative; }
  .sktip { position: absolute; bottom: 12px; transform: translateX(-50%);
           background: rgba(0,0,0,.75); color: #fff; font-size: 12px; line-height: 1;
           padding: 4px 7px; pointer-events: none; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  .seek::-webkit-slider-thumb, .seek::-moz-range-thumb {
          appearance: none; -webkit-appearance: none; height: 0; width: 0;
          background: transparent; border: none; cursor: pointer; }
  .sv { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sv svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .vl { width: 70px; height: 5px; appearance: none; -webkit-appearance: none;
        background: linear-gradient(to right, #fff var(--val, 0%), #555 0); cursor: pointer;
        border: none; outline: none; }
  .vl::-webkit-slider-thumb, .vl::-moz-range-thumb {
        appearance: none; -webkit-appearance: none; height: 0; width: 0;
        background: transparent; border: none; cursor: pointer; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="floats">
  <button class="btn primary" id="btn-add"><svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg>Add</button>
  <button class="btn" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><use href="#ic-settings"/></svg>Settings</button>
</div>

<main id="view-library">
  <div id="grid" class="grid"></div>
</main>

<main id="view-movie" hidden>
  <button class="back" id="btn-back">← Library</button>
  <div class="movie-head">
    <div class="bigposter" id="mv-poster"></div>
    <div class="mv-info">
      <h1 id="mv-title"></h1>
      <div class="sub" id="mv-sub"></div>
      <button class="btn danger" id="mv-del">Delete movie</button>
    </div>
  </div>
  <section>
    <h3>Downloaded contents</h3>
    <div class="rows" id="mv-torrents"></div>
  </section>
  <section id="mv-searchsec" hidden>
    <h3>Find torrents</h3>
    <div class="rows" id="mv-results" style="margin-top:12px"></div>
  </section>
</main>

<div class="modal" id="player-modal" hidden>
  <div class="pwrap" id="videowrap">
    <video id="player"></video>
    <div class="buf" id="buf" hidden><div class="spin"></div><span>Buffering…</span></div>
    <button class="pback" id="pback" title="Back">← Back</button>
    <div class="ctrl" id="ctrl">
      <div class="strip">
        <button class="pb" id="ppbtn" title="Play / Pause">
          <svg id="ppicon" viewBox="0 0 24 24"><use href="#ic-play"/></svg>
        </button>
        <div class="tm" id="tm">0:00 / 0:00</div>
        <div class="skwrap"><input class="seek" id="seekbar" type="range" min="0" max="1000" value="0"><div class="sktip" id="seektth" hidden></div></div>
        <div class="sv">
          <svg id="vicon" viewBox="0 0 24 24"><use href="#ic-vol-hi"/></svg>
          <input class="vl" id="volbar" type="range" min="0" max="100" value="100">
          <button class="pb" id="fsbtn" title="Fullscreen">
            <svg id="fsicon" viewBox="0 0 24 24"><use href="#ic-maximize"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="add-modal" hidden>
  <div class="panel">
    <div class="phead"><span>Add to library</span><button class="x" id="am-close">✕</button></div>
    <input type="text" id="am-search" placeholder="Search movies &amp; shows…">
    <div id="am-results" class="am-body"></div>
  </div>
</div>

<div class="modal" id="confirm-modal" hidden>
  <div class="panel confirm">
    <div class="phead"><span>Confirm</span><button class="x" id="cf-cancel">✕</button></div>
    <p id="cf-msg" class="cf-msg"></p>
    <div class="cf-actions">
      <button class="btn" id="cf-no">Cancel</button>
      <button class="btn danger" id="cf-yes">Delete</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal" hidden>
  <div class="panel">
    <div class="phead"><span>Settings</span><button class="x" id="st-close">✕</button></div>
    <div class="modal-body">
      <h3 class="sec-title">Keybindings</h3>
      <table class="kb-table" id="kb-table">
      <thead>
        <tr>
          <th class="sort" data-sort="key">Key</th>
          <th class="sort" data-sort="ctx">Context</th>
          <th class="sort" data-sort="action">Action</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="kb-tbody"></tbody>
      <tfoot>
        <tr>
          <td><input class="kb-key" id="nb-key" value="+ new key" readonly
                     title="Click, then press the new keys"></td>
          <td><select id="nb-ctx">
            <option value="">Context</option>
            <option value="player">Player</option>
            <option value="movie">Movie</option>
            <option value="library">Library</option>
            <option value="modal">Modal</option>
          </select></td>
          <td><select id="nb-action"></select></td>
          <td class="kb-del"><button class="ibtn" id="nb-add" title="Add keybinding"><svg viewBox="0 0 24 24"><use href="#ic-check"/></svg></button></td>
        </tr>
      </tfoot>
    </table>
      <div class="kb-actions">
        <button class="btn" id="kb-restore">Restore defaults</button>
      </div>
    </div>
  </div>
</div>

<!-- Icons from Tabler Icons (https://tabler.io/icons), MIT license. Inlined once
     as <symbol> defs and referenced with <svg><use href="#ic-…"/></svg>. -->

<script>
const $ = (id) => document.getElementById(id);
const v = $('player');
const wrap = $('videowrap');
var items = [], currentId = null, seeking = false, currentMovie = null, pollBusy = 0, dlState = {};
var searchResults = [], curRep = null, searchPending = new Map(), pendingRows = new Map();
let fullDur = 0; // declared here; player session state lives with the player below
var libSel = -1, mvSelIdx = -1;

const TMDB_IMG = 'https://image.tmdb.org/t/p';
const POSTER_IDX = 'w342';
const POSTER_MD = 'w500';

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
}

function confirmBox(msg, yesLabel) {
  return new Promise((resolve) => {
    $('cf-msg').textContent = msg;
    $('cf-yes').textContent = yesLabel || 'Delete';
    $('confirm-modal').hidden = false;
    function done(v) {
      $('confirm-modal').hidden = true;
      $('cf-yes').onclick = null;
      $('cf-no').onclick = null;
      $('cf-cancel').onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    $('cf-yes').onclick = () => done(true);
    $('cf-no').onclick = () => done(false);
    $('cf-cancel').onclick = () => done(false);
    document.addEventListener('keydown', onKey);
  });
}

/* ---------- library grouping & grid ---------- */
function groupKey(it) {
  return it.tmdb_id ? (it.media_type || 'movie') + ':' + it.tmdb_id : 'r' + it.id;
}
function groupItems(list) {
  const g = new Map();
  for (const it of list) {
    const k = groupKey(it);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(it);
  }
  return g;
}
function posterURL(p, size) { return TMDB_IMG + '/' + size + p; }
function placeholder(phText) { return '<div class="ph">' + phText + '</div>'; }
function posterTag(src) { return '<img loading="lazy" src="' + src + '" alt="" onerror="this.onerror=null;this.outerHTML=placeholder(\'▷\')">'; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function movieName(it) {
  if (it.title) return it.title;
  if (it.magnet) return it.magnet.slice(0, 40);
  return 'Movie';
}
function movieYear(it) {
  if (it.year) return String(it.year);
  if (it.magnet) { const m = it.magnet.match(/20\d{2}/); return m ? m[0] : ''; }
  return '';
}
function kindLabel(it) { return it.tmdb_id ? (it.media_type === 'tv' ? 'TV' : 'Movie') : ''; }

function movieRep(rows) {
  return rows.find(r => r.tmdb_id && !r.magnet) || rows.find(r => r.tmdb_id) || rows[0];
}
function infoHash(mag) {
  const m = (mag || '').match(/btih:([0-9a-fA-F]{40})/);
  return m ? m[1].toLowerCase() : null;
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const g = groupItems(items);
  for (const [k, rows] of g) {
    const rep = movieRep(rows);
    const card = document.createElement('div');
    card.className = 'card';
    const count = rows.filter(r => r.magnet).length;
    const posterHtml = rep.poster_path
      ? posterTag(posterURL(rep.poster_path, POSTER_IDX))
      : placeholder('▷');
    card.innerHTML =
      '<div class="poster">' + posterHtml + '</div>' +
      (count ? '<span class="badge">' + count + '</span>' : '') +
      '<div class="meta"><div class="t">' + esc(movieName(rep)) + '</div>' +
      '<div class="y">' + esc(movieYear(rep)) + (kindLabel(rep) ? ' · ' + kindLabel(rep) : '') + '</div></div>';
    card.onclick = () => openMovie(k);
    grid.appendChild(card);
  }
  libHighlight();
}

function renderPieceBar(bar, have, total) {
  if (!bar) return;
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  let html = '';
  for (let b = 0; b < n; b++) {
    const start = b * per, end = Math.min(total, start + per);
    let c = 0;
    for (let i = start; i < end; i++) if (have[i]) c++;
    const f = (end - start) ? c / (end - start) : 0;
    html += '<b style="background:' + (f > 0 ? (f >= 1 ? '#3ddc84' : 'rgba(61,220,132,' + (0.15 + f * 0.8).toFixed(2) + ')') : 'transparent') + '"></b>';
  }
  bar.innerHTML = html;
}

function piecesToPct(p) {
  let have = [], total = 0, overall = null;
  if (p && p.total) {
    have = p.have; total = p.total;
    let got = 0;
    for (const b of have) if (b) got++;
    overall = (got / total) * 100;
  }
  return { have, total, pct: overall };
}

function applyDlRow(row, id, p, s) {
  const st = row.dataset.state;
  const { have, total, pct: opct } = piecesToPct(p);
  const pct = opct !== null ? opct : Math.max(0, Math.min(100, s.progress_pct || 0));
  const dl = row.querySelector('.dl');
  dl.hidden = false;
  renderPieceBar(dl.querySelector('.bar'), have, total);
  let text;
  if (st === 'paused') {
    text = 'Paused · ' + Math.round(pct) + '%';
  } else {
    const speed = s.download_speed_bps || 0;
    const remain = (s.total_bytes || 0) - (s.contiguous_bytes || 0);
    const eta = speed > 0 ? remain / speed : null;
    text = Math.round(pct) + '% · ' + fmtSpeed(speed) + (eta !== null ? ' · ETA ' + fmtEta(eta) : '');
  }
  dlState[id] = { pct, text, have, total };
  dl.querySelector('.txt').textContent = text;
}

async function warmDl(id) {
  try {
    const s = await api('/api/library/' + id + '/status');
    const p = await api('/api/library/' + id + '/pieces');
    const row = document.querySelector('#mv-torrents .row[data-id="' + id + '"]');
    if (row && row.dataset.state === 'paused') applyDlRow(row, id, p, s);
  } catch (e) { /* torrent may be gone; keep row as-is */ }
}

async function refreshLibrary() {
  try {
    let srv = await api('/api/library');
    for (const [pid, syn] of pendingRows) {
      const isLive = srv.some(i => infoHash(i.magnet) === infoHash(syn.magnet));
      if (!isLive) srv.push(syn);
    }
    items = srv;
    renderGrid();
    syncMovie();
    renderSearch();
  }
  catch (e) { console.error('refresh failed', e); }
}

function setView(isMovie) {
  $('view-library').hidden = isMovie;
  $('view-movie').hidden = !isMovie;
  $('btn-add').hidden = isMovie;
}

function syncMovie() {
  if (!currentMovie) return;
  currentMovie.rows = groupItems(items).get(currentMovie.key) || [];
  if (!currentMovie.rows.length) {
    currentMovie = null;
    setView(false);
  } else {
    renderMovie();
  }
}

/* ---------- movie detail page ---------- */
function openMovie(k) {
  const rows = groupItems(items).get(k) || [];
  if (!rows.length) return;
  currentMovie = { key: k, rows };
  dlState = {};
  setView(true);
  mvSelIdx = -1;
  $('mv-results').innerHTML = '';
  window.scrollTo(0, 0);
  renderMovie();
  const rep = movieRep(rows);
  if (rep.tmdb_id) findTorrents(rep);
}

const IC_PLAY = '<svg viewBox="0 0 24 24"><use href="#ic-play"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24"><use href="#ic-pause"/></svg>';
const IC_BIN = '<svg viewBox="0 0 24 24"><use href="#ic-bin"/></svg>';

function icBtn(inner, cls, onclick) {
  const b = document.createElement('button');
  b.className = 'ibtn' + (cls ? ' ' + cls : '');
  b.innerHTML = inner;
  b.onclick = onclick;
  b.title = cls || '';
  return b;
}

function renderMovie() {
  const rows = currentMovie.rows;
  const rep = movieRep(rows);
  const poster = $('mv-poster');
  poster.innerHTML = rep.poster_path
    ? posterTag(posterURL(rep.poster_path, POSTER_MD))
    : placeholder('▷');
  $('mv-title').textContent = movieName(rep);
  $('mv-sub').textContent = [movieYear(rep), kindLabel(rep)].filter(Boolean).join(' · ') || ' ';

  const list = $('mv-torrents');
  const torrentRs = rows.filter(r => r.magnet);
  // Update rows in place so the same DOM node transitions between states
  // (adding → downloading → ready) without a rebuild flash. Row boxes stay
  // the same height; only the inside content changes.
  const empty = list.querySelector('.empty');
  if (!torrentRs.length) {
    if (!empty) list.innerHTML = '<div class="empty" style="padding:12px 0">No content</div>';
  } else {
    if (empty) empty.remove();
    const existing = {};
    for (const el of list.querySelectorAll(':scope > .row')) existing[el.dataset.id] = el;
    const keep = new Set();
    for (const t of torrentRs) {
      keep.add(String(t.id));
      let el = existing[t.id];
      if (!el) {
        el = document.createElement('div');
        el.dataset.id = t.id;
        list.appendChild(el);
      }
      renderTorrentRow(el, t);
    }
    for (const id in existing) if (!keep.has(id)) existing[id].remove();
  }

  const sec = $('mv-searchsec');
  sec.hidden = !rep.tmdb_id;
  mvSyncSel();
}

function renderTorrentRow(el, t) {
  el.className = 'row';
  el.dataset.state = t.state || '';
  const isDown = t.state === 'downloading';
  const isPaused = t.state === 'paused';
  el.innerHTML =
    '<div class="nm"><div class="t">' + esc(t.title || t.magnet) + '</div>' +
    '<div class="dl"><div class="bar"></div><div class="txt"></div></div></div>';
  const bar = el.querySelector('.bar');
  const txt = el.querySelector('.txt');
  const done = t.state === 'ready';
  bar.style.display = done ? 'none' : '';
  if (isDown && dlState[t.id]) {
    renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
    txt.textContent = dlState[t.id].text;
  } else if (isDown) {
    txt.textContent = 'Starting…';
  } else if (t.state === '_pending' || t.state === 'connecting') {
    txt.textContent = 'Adding…';
  } else if (done) {
    txt.textContent = 'Ready';
  } else if (isPaused) {
    if (dlState[t.id]) {
      renderPieceBar(bar, dlState[t.id].have, dlState[t.id].total);
      txt.textContent = dlState[t.id].text;
    } else {
      txt.textContent = 'Paused';
      warmDl(t.id);
    }
  } else if (t.state === 'error') {
    txt.textContent = 'Failed';
  } else {
    txt.textContent = 'Stopped';
  }
  const canPlay = t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'error';
  el.style.cursor = canPlay ? 'pointer' : 'default';
  el.onclick = (e) => {
    if (!canPlay) return;
    if (e.target.closest('button, label, input, a')) return;
    playTorrent(t);
  };
  if (isDown) {
    const pr = document.createElement('button');
    pr.className = 'ibtn'; pr.innerHTML = IC_PAUSE;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/pause', { method: 'POST' }); }
      catch (e) { console.error('pause failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  } else if (isPaused) {
    const pr = document.createElement('button');
    pr.className = 'ibtn primary'; pr.innerHTML = IC_PLAY;
    pr.onclick = async () => {
      pr.disabled = true;
      try { await api('/api/library/' + t.id + '/resume', { method: 'POST' }); }
      catch (e) { console.error('resume failed', e); }
      refreshLibrary();
    };
    el.appendChild(pr);
  }
  const del = document.createElement('button');
  del.className = 'ibtn danger'; del.innerHTML = IC_BIN;
  del.onclick = () => delItem(t);
  el.appendChild(del);
  if (t.state !== '_pending' && t.state !== 'connecting') {
    const seq = document.createElement('label');
    seq.className = 'seq'; seq.title = 'Download pieces in order';
    const box = document.createElement('input');
    box.type = 'checkbox'; box.checked = t.sequential !== false;
    seq.appendChild(box);
    seq.appendChild(document.createTextNode('SEQ'));
    box.onchange = async () => {
      box.disabled = true;
      try {
        await api('/api/library/' + t.id + '/sequential', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sequential: box.checked }),
        });
      } catch (e) { console.error('set sequential failed', e); box.checked = !box.checked; }
      box.disabled = false;
    };
    el.appendChild(seq);
  }
}

async function delItem(t) {
  if (t.state === '_pending') {
    // Cancelling an optimistic add: drop it locally, no server call.
    const syn = pendingRows.get(t.id);
    if (syn && syn.abort) syn.abort();
    pendingRows.delete(t.id);
    items = items.filter(i => i.id !== t.id);
    syncMovie();
    renderSearch();
    return;
  }
  if (!(await confirmBox('Remove this torrent and delete all of its files?'))) return;
  try { await api('/api/library/' + t.id, { method: 'DELETE' }); }
  catch (e) { console.error('delete failed', e); }
  refreshLibrary();
}

$('mv-del').addEventListener('click', async () => {
  if (!(await confirmBox('Delete this movie and all of its contents from the library?'))) return;
  const rep = movieRep(currentMovie.rows);
  if (rep) {
    // Cancel any in-flight optimistic adds for this movie first.
    const dropPids = [], dead = [];
    for (const [pid, syn] of pendingRows) {
      if (rep.tmdb_id && syn.tmdb_id && syn.tmdb_id === rep.tmdb_id) {
        dropPids.push(pid);
        if (syn.abort) syn.abort();
        dead.push(pid);
      }
    }
    for (const pid of dropPids) pendingRows.delete(pid);
    items = items.filter(i => !dead.includes(i.id));
    try { await api('/api/library/' + rep.id + '?hard=1', { method: 'DELETE' }); }
    catch (e) { console.error('movie delete failed', e); }
    renderSearch();
  }
  if (currentId !== null) stopPlayback();
  currentMovie = null;
  setView(false);
  refreshLibrary();
});

$('btn-back').addEventListener('click', () => {
  currentMovie = null;
  setView(false);
});

let findSeq = 0;
async function findTorrents(rep) {
  const seq = ++findSeq;
  const box = $('mv-results');
  box.innerHTML = '<div class="empty" style="padding:10px 0">Searching…</div>';
  try {
    const res = await api('/api/torrents?q=' + encodeURIComponent(rep.title || ''));
    if (seq !== findSeq) return;   // a newer search started — discard stale results
    searchResults = res;
    curRep = rep;
    renderSearch();
  } catch (e) {
    if (seq !== findSeq) return;
    searchResults = [];
    box.innerHTML = '<div class="empty" style="padding:10px 0">' + esc(e.message) + '</div>';
  }
}

function renderSearch() {
  const box = $('mv-results');
  if (!box) return;
  // Stale-response guard: `searchResults`/`curRep` are globals shared across
  // movies. Only render when the search belongs to the movie currently open
  // (otherwise refreshLibrary ticks + background fetches would dump the
  // previous movie's torrent links into this one's "Find torrents" box, and
  // clicking one would attach it to the wrong movie).
  const rep = currentMovie ? movieRep(currentMovie.rows) : null;
  if (!curRep || !rep || curRep.tmdb_id !== rep.tmdb_id) return;
  box.innerHTML = '';
  if (!searchResults.length) {
    box.innerHTML = '<div class="empty" style="padding:10px 0">No results from the indexer.</div>';
    return;
  }
  const addedHashes = new Set(items.filter(i => i.magnet).map(i => infoHash(i.magnet)).filter(Boolean));
  for (const t of searchResults) {
    const row = document.createElement('div');
    row.className = 'row';
    const sz = t.size_bytes ? fmtBytes(t.size_bytes) : '';
    const se = '<span class="se">' + (t.seeders || 0) + '</span> seeders / <span class="le">' + (t.leechers || 0) + '</span> leechers';
    row.innerHTML =
      '<div class="nm"><div class="t">' + esc(t.name) + '</div>' +
      '<div class="s">' + sz + (sz ? ' · ' : '') + se + '</div></div>';
    const add = document.createElement('button');
    const h = infoHash(t.magnet);
    const isAdded = addedHashes.has(h);
    const pending = searchPending.has(h);
    add.className = 'btn' + (isAdded || pending ? '' : ' primary');
    add.disabled = isAdded || pending;
    add.textContent = isAdded ? '✓ Added' : (pending ? 'Adding…' : 'Add');
    if (!isAdded && !pending) add.onclick = () => addTorrentFromSearch(t);
    row.appendChild(add);
    box.appendChild(row);
  }
  mvSyncSel();
}

async function addTorrentFromSearch(t) {
  const h = infoHash(t.magnet);
  if (!h || searchPending.has(h)) return;
  const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rep = curRep || {};
  const ctl = new AbortController();
  const syn = {
    id: pid, magnet: t.magnet, title: t.name, state: '_pending',
    tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null,
    poster_path: rep.poster_path || null, year: rep.year || null,
    size_bytes: t.size_bytes || 0, abort: ctl
  };
  searchPending.set(h, pid);
  pendingRows.set(pid, syn);
  items.push(syn);
  renderSearch();
  syncMovie();
  try {
    await api('/api/library', {
      method: 'POST',
      signal: ctl.signal,
      body: JSON.stringify({
        magnet: t.magnet,
        year: rep.year || null, poster_path: rep.poster_path || null,
        tmdb_id: rep.tmdb_id || null, media_type: rep.media_type || null
      })
    });
  } catch (e) {
    if (e.name !== 'AbortError') console.error('add failed', e);
    pendingRows.delete(pid);
    items = items.filter(i => i.id !== pid);
  } finally {
    searchPending.delete(h);
    pendingRows.delete(pid);
  }
  refreshLibrary();
}

/* ---------- add modal (TMDB search) ---------- */
let searchTimer = null;
function openAdd() { $('add-modal').hidden = false; amSel = -1; $('am-search').focus(); }
function closeAdd() { $('add-modal').hidden = true; amSel = -1; $('am-results').innerHTML = ''; $('am-search').value = ''; }
$('btn-add').addEventListener('click', openAdd);
$('am-close').addEventListener('click', closeAdd);
$('add-modal').addEventListener('click', (e) => { if (e.target === $('add-modal')) closeAdd(); });

let amSel = -1;
const amRows = () => [...$('am-results').querySelectorAll('.srow')];
function amSet(rows, i) {
  rows.forEach((r, j) => r.classList.toggle('sel', j === i));
  if (i >= 0 && rows[i]) rows[i].scrollIntoView({ block: 'nearest' });
  amSel = i;
}
$('am-search').addEventListener('keydown', (e) => {
  const rows = amRows();
  if (e.key === 'ArrowDown') {
    if (!rows.length) return;
    e.preventDefault();
    amSet(rows, amSel < 0 ? 0 : Math.min(rows.length - 1, amSel + 1));
  } else if (e.key === 'ArrowUp') {
    if (amSel < 0) return;
    e.preventDefault();
    amSet(rows, amSel === 0 ? -1 : amSel - 1);
  } else if (e.key === 'Enter' && amSel >= 0 && rows[amSel]) {
    e.preventDefault();
    const b = rows[amSel].querySelector('button');
    if (b) b.click();
  }
});
$('am-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = $('am-search').value.trim();
  amSet([...$('am-results').querySelectorAll('.srow')], -1);
  if (!q) { $('am-results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
});

let amSeq = 0;
async function doSearch(q) {
  const seq = ++amSeq;
  const box = $('am-results');
  amSel = -1;
  box.innerHTML = '<div class="empty" style="padding:10px 0">Searching…</div>';
  try {
    const res = await api('/api/search?q=' + encodeURIComponent(q));
    if (seq !== amSeq || $('add-modal').hidden) return;   // superseded or closed
    box.innerHTML = '';
    if (!res.length) { box.innerHTML = '<div class="empty" style="padding:10px 0">No results.</div>'; return; }
    for (const r of res) {
      const row = document.createElement('div');
      row.className = 'srow';
      const p = r.poster_path
        ? posterTag(posterURL(r.poster_path, POSTER_IDX))
        : placeholder('▷');
      row.innerHTML =
        '<div class="poster">' + p + '</div>' +
        '<div class="info"><div class="t">' + esc(r.title) + '</div>' +
        '<div class="s">' + (r.year || '') + (r.year ? ' · ' : '') + (r.media_type === 'tv' ? 'TV' : 'Movie') + '</div></div>';
      const add = document.createElement('button');
      add.className = 'btn'; add.textContent = 'Add';
      add.onclick = async () => {
        add.disabled = true;
        try {
          await api('/api/movies', { method: 'POST', body: JSON.stringify({
            title: r.title, year: r.year, poster_path: r.poster_path,
            tmdb_id: r.id, media_type: r.media_type
          })});
          closeAdd();
          refreshLibrary();
        } catch (e) { console.error('add movie failed', e); add.disabled = false; }
      };
      row.appendChild(add);
      box.appendChild(row);
    }
  } catch (e) {
    if (seq === amSeq && !$('add-modal').hidden)
      box.innerHTML = '<div class="empty" style="padding:10px 0">' + esc(e.message) + '</div>';
  }
}

/* ---------- MSE segment player ----------
 * One pipeline for every item state. The server splits the file (finished or
 * still-downloading, never re-encoded) into fragmented-MP4 segments; the
 * client appends them to a SourceBuffer and lets the <video> element drive
 * everything. Seeking is a plain v.currentTime write: instant when the data
 * is buffered, otherwise the pump fetches the segment containing the target
 * and playback resumes once it lands (live download frontier => real wait
 * with progress shown, never a dead session). */
const SEG_KEEP_BEHIND = 30;   // seconds of played media to keep buffered
const SEG_AHEAD = 60;         // seconds to keep buffered ahead of the playhead
let segAbort = null, segMs = null, segBlobUrl = null, segSb = null, segGen = 0;
let segInfo = null;           // { mime, done, segs: Map(n -> t) }
let segAppended = new Set();  // segment numbers appended this session
let segEosDone = false;

const segSleep = (ms) => new Promise(r => setTimeout(r, ms));

async function playTorrent(item) {
  stopPlayback();
  currentId = item.id;
  $('player-modal').hidden = false;
  $('ctrl').style.display = 'block';
  showBuf('Loading…');
  try {
    await startSegSession();
  } catch (e) {
    if (e.name === 'AbortError') return;
    hideBuf();
    showBuf('Playback error: ' + e.message);
  }
}

async function startSegSession() {
  const gen = ++segGen;
  const id = currentId;
  segMs = new MediaSource();
  segBlobUrl = URL.createObjectURL(segMs);
  segAbort = new AbortController();
  segAppended = new Set();
  segEosDone = false;

  await new Promise((res, rej) => {
    const timer = setTimeout(() => rej(new Error('MediaSource timed out')), 5000);
    segMs.addEventListener('sourceopen', () => { clearTimeout(timer); res(); }, { once: true });
    segMs.addEventListener('error', () => { clearTimeout(timer); rej(new Error('MediaSource failed')); }, { once: true });
    v.src = segBlobUrl;
  });
  if (gen !== segGen) return;

  // Manifest: MIME + duration + which segments exist. Poll until the first
  // segment is cut — for a still-downloading torrent that means waiting for
  // the head pieces, which is exactly the buffering we want to show.
  let info = null;
  for (;;) {
    if (gen !== segGen) return;
    try {
      info = await api('/api/library/' + id + '/stream');
    } catch (e) {
      throw new Error(String(e.message || e).includes('not found') ? 'Item is gone' : 'Server unreachable');
    }
    if (info.error) throw new Error(info.error);
    if (info.state === 'error') throw new Error('Torrent failed to download');
    if (info.mime && info.segments.length) break;
    await segSleep(500);
  }
  if (gen !== segGen) return;

  fullDur = (info.duration && isFinite(info.duration)) ? info.duration : 0;
  segInfo = { mime: info.mime, done: !!info.done, segs: new Map(info.segments.map(s => [s.n, s.t])) };

  try {
    segSb = segMs.addSourceBuffer(segInfo.mime);
  } catch (e) {
    segSb = segMs.addSourceBuffer('video/mp4; codecs="avc1.640028,mp4a.40.2"');
  }

  // Init segment (ftyp+moov); retry until the segmenter has written it.
  for (;;) {
    if (gen !== segGen) return;
    const init = await fetchSegBuf(id, 'init');
    if (init) {
      try { await appendBuf(init); } catch (e) { return segFatal(e); }
      break;
    }
    await segSleep(500);
  }
  if (gen !== segGen) return;
  // Fragmented MP4 has no embedded duration (it stays Infinity until
  // endOfStream) and Firefox clamps currentTime writes to the seekable range
  // — so pin the duration from the manifest, or mid-movie seeks silently
  // snap back to the buffered edge.
  if (fullDur) { try { segMs.duration = fullDur; } catch (e) {} }

  // Fire-and-forget, but never silently: a rejected pump/poller is a real
  // playback failure and must surface (an unhandled rejection would stall
  // invisibly at 'Loading…').
  manifestPoller(gen, id).catch(e => segFatal(e));
  pumpLoop(gen, id).catch(e => segFatal(e));
}

// Debug hook: inspect live session state from the console.
window.__seg = () => ({
  gen: segGen, segInfo, appended: [...segAppended],
  sbUpdating: segSb && segSb.updating,
  sbErr: segSb && segSb.error && segSb.error.name,
  msReady: segMs && segMs.readyState,
  vErr: v.error && (v.error.code + ' ' + v.error.message),
  vBufLen: v.buffered && v.buffered.length,
  sbBufLen: segSb && segSb.buffered && segSb.buffered.length,
  sbBuf: (() => { try { const b = segSb && segSb.buffered; return b && b.length ? [b.start(0), b.end(b.length-1)] : null; } catch (e) { return 'err'; } })(),
  vPaused: v.paused, vTime: v.currentTime,
});

async function manifestPoller(gen, id) {
  while (gen === segGen) {
    await segSleep(1000);
    if (gen !== segGen) return;
    let info = null;
    try {
      info = await api('/api/library/' + id + '/stream');
    } catch (e) { continue; }
    if (gen !== segGen) return;
    if (info.error) { segFatal(new Error(info.error)); return; }
    if (info.duration && isFinite(info.duration) && (!fullDur || info.duration > fullDur)) fullDur = info.duration;
    if (segInfo) {
      segInfo.done = !!info.done;
      for (const s of info.segments) segInfo.segs.set(s.n, s.t);
    }
    if (!fullDur && info.duration && isFinite(info.duration)) {
      fullDur = info.duration;
      if (segMs) { try { segMs.duration = fullDur; } catch (e) {} }
    }
  }
}

async function pumpLoop(gen, id) {
  let firstPlay = true;
  while (gen === segGen) {
    const anchor = v.currentTime || 0;
    const want = [];
    const arr = [...segInfo.segs.entries()].sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < arr.length; i++) {
      const [n, t] = arr[i];
      if (segAppended.has(n)) continue;
      // A segment is wanted when it OVERLAPS the playhead window: it must
      // start before anchor+SEG_AHEAD and end after anchor-2. Segment end =
      // next segment's start (fragments are contiguous).
      const end = i + 1 < arr.length ? arr[i + 1][1] : t + 30;
      if (t < anchor + SEG_AHEAD && end > anchor - 2) want.push([n, t]);
    }

    let appended = false;
    for (const [n] of want) {
      if (gen !== segGen) return;
      const buf = await fetchSegBuf(id, 'seg/' + n);
      if (gen !== segGen) return;
      if (buf === null) break; // vanished? treat as frontier, poller refills
      try {
        await appendBuf(buf);
      } catch (e) { return segFatal(e); }
      segAppended.add(n);
      appended = true;
    }

    if (appended) {
      hideBuf();
      if (firstPlay) { firstPlay = false; if (v.paused) v.play().catch(() => {}); }
      continue;
    }

    await evictBehind();
    if (gen !== segGen) return;
    // End of movie: everything appended => close the stream.
    if (segInfo.done && !segEosDone && segInfo.segs.size &&
        [...segInfo.segs.keys()].every(n => segAppended.has(n))) {
      segEosDone = true;
      try { if (segMs.readyState === 'open') segMs.endOfStream(); } catch (e) {}
    }
    await segSleep(300);
  }
}

async function fetchSegBuf(id, name) {
  const r = await fetch('/mse/' + id + '/' + name, { signal: segAbort ? segAbort.signal : undefined });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Segment fetch failed (' + r.status + ')');
  return await r.arrayBuffer();
}

function appendBuf(data) {
  return new Promise((resolve, reject) => {
    const sb = segSb;
    if (!sb) return reject(new Error('no SourceBuffer'));
    const arm = () => {
      const onEnd = () => { cleanup(); resolve(); };
      const onErr = () => {
        cleanup();
        const err = sb.error ? (sb.error.name + ': ' + (sb.error.message || '')) : '';
        reject(new Error('Append failed — your browser likely cannot decode this file. ' + err));
      };
      const cleanup = () => { sb.removeEventListener('updateend', onEnd); sb.removeEventListener('error', onErr); };
      sb.addEventListener('updateend', onEnd);
      sb.addEventListener('error', onErr);
      try { sb.appendBuffer(data); } catch (e) { cleanup(); reject(e); }
    };
    if (sb.updating) {
      const onUpd = () => { sb.removeEventListener('updateend', onUpd); arm(); };
      sb.addEventListener('updateend', onUpd);
    } else arm();
  });
}

function evictBehind() {
  return new Promise((res) => {
    const sb = segSb;
    if (!sb || sb.updating) return res();
    try {
      const b = sb.buffered;
      const cut = Math.max(0, (v.currentTime || 0) - SEG_KEEP_BEHIND);
      if (!b.length || b.start(0) >= cut) return res();
      const onEnd = () => { sb.removeEventListener('updateend', onEnd); res(); };
      sb.addEventListener('updateend', onEnd);
      sb.remove(b.start(0), cut);
    } catch (e) { res(); }
  });
}

function seekTo(globalT) {

  // Native seek: instant when the target is buffered. Otherwise the video
  // element waits and the pump fetches the segment containing the target —
  // for live torrents that shows real download progress, never an error.
  v.currentTime = globalT;
}

function segFatal(e) {

function stopPlayback() {

  segInfo = null;

function updSeek() {
  const el = $('seekbar');
  if (seeking) return;
  const dur = fullDur || v.duration;
  if (!dur) return;
  const global = v.currentTime;
  const pct = (global / dur) * 100;
  el.value = Math.round(pct * 10);
  el.style.setProperty('--val', pct.toFixed(2) + '%');
  $('tm').textContent = fmtClock(global) + ' / ' + fmtClock(dur);
  updSk();

function seekSegGradient(have, total) {
  const n = Math.min(240, total || 1);
  const per = Math.ceil((total || 1) / n) || 1;
  const stops = [];
  for (let i = 0; i < n; i++) {
    let c = 0;
    for (let j = 0; j < per && i * per + j < total; j++) if (have[i * per + j]) c++;
    const a = Math.max(0, ((i * per) / total) * 100);
    const b = Math.min(100, ((i * per + Math.min(per, total - i * per)) / total) * 100);
    if (c > 0) {
      const f = c / per;
      const col = 'rgba(255,255,255,' + (0.22 + 0.28 * f).toFixed(2) + ')';
      stops.push(col + ' ' + a.toFixed(2) + '%', col + ' ' + b.toFixed(2) + '%');
    } else {
      stops.push('transparent ' + a.toFixed(2) + '%', 'transparent ' + b.toFixed(2) + '%');
    }
  }
  return 'linear-gradient(to right, ' + stops.join(', ') + ')';
}

let lastSkKey = null;
function updSk() {
  const el = $('seekbar');

  let have = null, total = 0, rdy = false;
  if (it && it.state === 'ready') { rdy = true; }
  else if (it && dlState[currentId] && dlState[currentId].total) {
    have = dlState[currentId].have;
    total = dlState[currentId].total;
  }
  const key = currentId + ':' + (rdy ? 'ready' : (have ? total + ':' + have.join('') : 'none'));
  if (key === lastSkKey) return;
  lastSkKey = key;
  let avail;
  if (rdy) avail = 'linear-gradient(to right, rgba(255,255,255,.35) 0%, rgba(255,255,255,.35) 100%)';
  else if (have) avail = seekSegGradient(have, total);
  else avail = null;
  el.style.backgroundImage =
    'linear-gradient(to right, rgba(255,255,255,.85) 0, rgba(255,255,255,.85) var(--val), transparent var(--val))' +
    (avail ? ', ' + avail : '');
}

function fsIsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

/* ---------- input system ----------
 * No key does anything by default. The browser's native behaviors are killed
 * globally: spacebar / arrow page-scroll, native stepping on a focused
 * <input type=range> (seek/vol bars), button activation, Tab focus, Escape.
 * A key only acts via an explicit binding below, gated by CONTEXT (which
 * screen is open). Real text entry and browser-level shortcuts (Cmd+R, F5,
 * Cmd+F, F11… and browser fullscreen-Escape) always pass through untouched.
 * Bindings can be remapped in Settings (top-right gear); every binding is
 * plain data backed by a default table, and edits persist via localStorage.
 */
const KCTX_PLAYER  = 'player';   /* player modal open            */
const KCTX_MODAL   = 'modal';    /* add/settings/confirm overlay  */
const KCTX_MOVIE   = 'movie';    /* movie detail page open        */
const KCTX_LIBRARY = 'library';  /* library grid open             */

// Default bindings (restore-target in Settings). 'mods' holds Ctrl/Alt/Shift/
// Meta combinations; the fn references below are hoisted function declarations.
const DEFAULT_KEYBIND = [
  // { id, ctx, code, label, fn }
  { id: 'pl-toggle',   ctx: KCTX_PLAYER, code: 'Space',      label: 'Play / Pause',           fn: togglePlay },
  { id: 'pl-back5',    ctx: KCTX_PLAYER, code: 'ArrowLeft',  label: 'Seek back 5s',           fn: () => seekBy(-5) },
  { id: 'pl-fwd5',     ctx: KCTX_PLAYER, code: 'ArrowRight', label: 'Seek forward 5s',        fn: () => seekBy(5) },
  { id: 'pl-fs',       ctx: KCTX_PLAYER, code: 'KeyF',       label: 'Toggle fullscreen',      fn: toggleFs },
  { id: 'pl-exit',     ctx: KCTX_PLAYER, code: 'Escape',     label: 'Exit player',            fn: exitPlayer },
  { id: 'mv-back',     ctx: KCTX_MOVIE,  code: 'Escape',     label: 'Back to library',        fn: () => $('btn-back').click() },
  { id: 'mv-next',     ctx: KCTX_MOVIE,  code: 'ArrowDown',  label: 'Next item / torrent',    fn: selNext },
  { id: 'mv-prev',     ctx: KCTX_MOVIE,  code: 'ArrowUp',    label: 'Previous item',          fn: selPrev },
  { id: 'mv-open',     ctx: KCTX_MOVIE,  code: 'Enter',      label: 'Open selected',          fn: selOpen },
  { id: 'mv-dltoggle', ctx: KCTX_MOVIE,  code: 'Space',      label: 'Pause / resume torrent', fn: selToggleDl },
  { id: 'lib-next',    ctx: KCTX_LIBRARY,code: 'ArrowRight', label: 'Next movie',             fn: selNext },
  { id: 'lib-prev',    ctx: KCTX_LIBRARY,code: 'ArrowLeft',  label: 'Previous movie',         fn: selPrev },
  { id: 'lib-open',    ctx: KCTX_LIBRARY,code: 'Enter',      label: 'Open movie',             fn: selOpen },
  { id: 'lib-settings',ctx: KCTX_LIBRARY,code: 'Escape',     label: 'Open settings',           fn: openSettings },
  { id: 'lib-add',    ctx: KCTX_LIBRARY,code: 'Space',      label: 'Add movie',               fn: openAdd },
  { id: 'modal-close', ctx: KCTX_MODAL,  code: 'Escape',     label: 'Close',                  fn: closeModal },
];

const KCTX_NAMES = { player: 'Player', modal: 'Modal', movie: 'Movie', library: 'Library' };
const KB_STORE = 'chadtorrent.keybinds';
const KB_DEL_STORE = 'chadtorrent.keybinds.deleted';

function delKbIds() {
  try { return new Set(JSON.parse(localStorage.getItem(KB_DEL_STORE) || '[]')); }
  catch (e) { return new Set(); }
}
function tombKb(id) {
  const s = delKbIds(); s.add(id);
  try { localStorage.setItem(KB_DEL_STORE, JSON.stringify([...s])); } catch (e) {}
}
function untombAllKb() {
  try { localStorage.removeItem(KB_DEL_STORE); } catch (e) {}
}

const CODE_PRETTY = { Space: 'Space', Enter: 'Enter', Escape: 'Esc', Tab: 'Tab',
  Backspace: 'Backspace', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
function prettyCode(code) {
  if (CODE_PRETTY[code]) return CODE_PRETTY[code];
  if (code && code.startsWith('Key')) return code.slice(3);
  if (code && code.startsWith('Digit')) return code.slice(5);
  return code || '';
}
function prettyKey(b) { return (b.mods || []).concat(prettyCode(b.code)).join('+'); }
function modsFor(e) {
  return [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean);
}
function modsEq(a, b) { return (a || []).join(',') === (b || []).join(','); }
function modMatch(b, e) { return modsEq(b.mods || [], modsFor(e)); }

function actionFor(ctx, label) {
  const d = DEFAULT_KEYBIND.find(x => x.ctx === ctx && x.label === label);
  return d ? d.fn : (() => {});
}
function actionsForCtx(ctx) {
  const seen = new Set(), out = [];
  for (const b of DEFAULT_KEYBIND) if (b.ctx === ctx && !seen.has(b.label)) { seen.add(b.label); out.push(b.label); }
  return out;
}
function defaultKeybinds() {
  return DEFAULT_KEYBIND.map(b => ({ id: b.id, ctx: b.ctx, code: b.code, mods: [], label: b.label, fn: b.fn }));
}
function decodeKeybinds(saved) {
  const out = [];
  if (!Array.isArray(saved)) return out;
  for (const s of saved) {
    if (!s || typeof s.ctx !== 'string' || typeof s.code !== 'string') continue;
    const d = DEFAULT_KEYBIND.find(x => x.id === s.id)
      || DEFAULT_KEYBIND.find(x => x.ctx === s.ctx && x.label === s.label);
    if (!d) continue;
    out.push({ id: s.id, ctx: s.ctx, code: s.code, mods: Array.isArray(s.mods) ? s.mods : [],
               label: s.label, fn: d.fn });
  }

}
function loadKeybinds() {
  let saved = null;
  try {
    const raw = localStorage.getItem(KB_STORE);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {}
  if (!Array.isArray(saved)) return defaultKeybinds();
  const out = decodeKeybinds(saved);
  const have = new Set(out.map(b => b.id));
  const gone = delKbIds();
  for (const d of defaultKeybinds()) {
    if (!have.has(d.id) && !gone.has(d.id)) out.push({ id: d.id, ctx: d.ctx, code: d.code, mods: [], label: d.label, fn: d.fn });
  }
  return out;
}
let KEYBIND = loadKeybinds();
function saveKeybinds() {
  try {
    localStorage.setItem(KB_STORE, JSON.stringify(
      KEYBIND.map(b => ({ id: b.id, ctx: b.ctx, code: b.code, mods: b.mods, label: b.label }))));
  } catch (e) {}
}
function activeKeyCtx() {

  if (!$('settings-modal').hidden) return KCTX_MODAL;
  if (!$('add-modal').hidden) return KCTX_MODAL;
  if (!$('confirm-modal').hidden) return KCTX_MODAL;
  if (!$('view-movie').hidden) return KCTX_MOVIE;

}

function libCount() { return document.querySelectorAll('#grid .card').length; }

  if (els[libSel]) els[libSel].scrollIntoView({ block: 'nearest' });
}

function mvFlat() {
  const out = [];
  for (const el of document.querySelectorAll('#mv-torrents .row[data-id]')) out.push({ kind: 'content', el });
  for (const el of document.querySelectorAll('#mv-results .row'))         out.push({ kind: 'torrent',  el });
  return out;
}
function mvHighlight() {
  mvFlat().forEach((x, i) => x.el.classList.toggle('sel', i === mvSelIdx));
}
function mvSyncSel() {
  const l = mvFlat();
  if (!l.length) { mvSelIdx = -1; return; }
  if (mvSelIdx < 0 || mvSelIdx >= l.length) mvSelIdx = 0;
  mvHighlight();
}
function mvSelMove(d) {
  const l = mvFlat();
  if (!l.length) return;
  if (mvSelIdx < 0 || mvSelIdx >= l.length) mvSelIdx = d > 0 ? 0 : l.length - 1;
  else mvSelIdx = Math.max(0, Math.min(l.length - 1, mvSelIdx + d));
  mvHighlight();
  const x = l[mvSelIdx];
  if (x) x.el.scrollIntoView({ block: 'nearest' });
}

function selNext() { if (activeKeyCtx() === KCTX_MOVIE) mvSelMove(1); else libSelMove(1); }
function selPrev() { if (activeKeyCtx() === KCTX_MOVIE) mvSelMove(-1); else libSelMove(-1); }
function selOpen() {
  if (activeKeyCtx() === KCTX_LIBRARY) {
    const cards = document.querySelectorAll('#grid .card');
    if (libSel >= 0 && libSel < cards.length) cards[libSel].click();
    return;
  }
  const x = mvFlat()[mvSelIdx];
  if (!x) return;
  if (x.kind === 'content') {
    const t = items.find(i => String(i.id) === String(x.el.dataset.id));
    if (t && t.state !== '_pending' && t.state !== 'connecting' && t.state !== 'error') playTorrent(t);
  } else {
    const add = x.el.querySelector('button.btn');
    if (add && !add.disabled) add.click();
  }
}
function selToggleDl() {
  const x = mvFlat()[mvSelIdx];
  if (!x || x.kind !== 'content') return;
  const btn = x.el.dataset.state === 'paused'
    ? x.el.querySelector('.ibtn.primary')
    : x.el.querySelector('.ibtn:not(.primary):not(.danger)');
  if (btn) btn.click();
}

/* True for elements where the user is actually typing/editing text. */
const ksIsText = (t) => {
  if (!t || !t.tagName) return false;
  const tag = t.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if (tag === 'INPUT') return !['range', 'checkbox', 'radio', 'button', 'submit', 'file', 'hidden'].includes(t.type);
  return !!t.isContentEditable;
};

document.addEventListener('keydown', (e) => {
  // Escape always closes whichever overlay is open — even when the focus is
  // inside a text input (e.g. the add-to-library search box), which would
  // otherwise be swallowed by the typing guard below.
  if (e.key === 'Escape' && activeKeyCtx() === KCTX_MODAL) {
    e.preventDefault();
    const b = KEYBIND.find(x => x.ctx === KCTX_MODAL && x.code === e.code && modMatch(x, e));
    if (b) b.fn();
    return;
  }
  if (ksIsText(e.target)) return;                       // typing untouched
  if (e.ctrlKey || e.metaKey || e.altKey) return;        // browser shortcuts
  if (/^F\d+$/.test(e.key)) return;                      // F1…F12 pass through
  if (e.key === 'Escape' && fsIsOn()) return;            // native fullscreen exit
  e.preventDefault();                                    // every key does nothing by default
  const ctx = activeKeyCtx();
  if (!ctx) return;
  const b = KEYBIND.find(x => x.ctx === ctx && x.code === e.code && modMatch(x, e));
  if (b) b.fn();
});

/* ---------- settings (keybinding remap) ---------- */
let kbRec = null, kbPending = null, kbSeq = 100;
function stopKbRec(restore) {
  if (!kbRec) return;
  const el = kbRec.el;
  el.classList.remove('rec');
  el.placeholder = '';
  if (restore) el.value = kbRec.binding ? prettyKey(kbRec.binding) : kbRec.orig;
  kbRec = null; kbPending = null;
}
function startKbRec(el, binding) {
  if (kbRec) stopKbRec(true);
  kbRec = { el, binding, orig: el.value };
  el.classList.add('rec');
  el.value = '';
  el.placeholder = 'Press keys…';
  el.focus();
}
function prettyPending() {
  const m = (kbPending.mods || []).join('+');
  const c = kbPending.code ? prettyCode(kbPending.code) : (kbPending ? '…' : '');
  return m ? m + '+' + c : c;
}
document.addEventListener('keydown', (e) => {
  // capture-phase recorder: register the combo, Enter saves, Esc cancels
  if (!kbRec) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { stopKbRec(true); return; }
  const mods = modsFor(e);
  if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) { kbPending = { mods, code: null }; kbRec.el.value = prettyPending(); return; }
  kbPending = { mods, code: e.code };
  kbRec.el.value = prettyPending();
}, true);
function kbConflict(b) {
  return KEYBIND.some(x => x !== b && x.ctx === b.ctx && x.code === b.code && modsEq(x.mods || [], b.mods || []));
}
function nextKbId() {
  while (KEYBIND.some(b => b.id === 'c' + kbSeq)) kbSeq++;
  return 'c' + kbSeq++;
}
function commitKbRec() {
  const cur = kbRec;
  if (!cur) return;
  if (!kbPending || !kbPending.code) return;
  const isNew = !cur.binding;
  const ctx = $('nb-ctx').value, act = $('nb-action').value;
  // New bindings need a context and an action picked; with either missing,
  // Enter does nothing (keep recording, no error).
  if (isNew && (!ctx || !act)) return;
  const b = isNew
    ? { id: nextKbId(), ctx, label: act, fn: actionFor(ctx, act) }
    : cur.binding;
  b.code = kbPending.code;
  b.mods = kbPending.mods;
  if (kbConflict(b)) {
    kbRec = null; kbPending = null;
    resetNbKey();
    renderKbSettings();
    return;
  }
  if (isNew) KEYBIND.push(b);
  saveKeybinds();
  kbRec = null; kbPending = null;
  resetNbKey();
  if (isNew) resetNbFields();
  renderKbSettings();
}
function resetNbFields() {
  const c = $('nb-ctx');
  c.value = '';
  c.classList.add('placeholder');
  fillNbActions();
}
function resetNbKey() {
  const el = $('nb-key');
  el.classList.remove('rec');
  el.value = '+ new key';
  el.placeholder = '';
}
let kbSort = { col: 'key', dir: 1 };
function kbGet(b) {
  const col = kbSort ? kbSort.col : 'key';
  if (col === 'ctx') return KCTX_NAMES[b.ctx] || b.ctx;
  if (col === 'action') return b.label;
  return prettyKey(b);
}
function sortKb() {
  const rows = [...KEYBIND];
  if (!kbSort) return rows;
  rows.sort((a, b) => {
    const x = kbGet(a).toLowerCase(), y = kbGet(b).toLowerCase();
    return x < y ? -kbSort.dir : x > y ? kbSort.dir : 0;
  });
  return rows;
}
function syncSortInd() {
  document.querySelectorAll('.kb-table th[data-sort]').forEach(th => {
    if (kbSort && th.dataset.sort === kbSort.col) th.dataset.dir = kbSort.dir > 0 ? 'asc' : 'desc';
    else delete th.dataset.dir;
  });
}
function fillNbActions() {
  const sel = $('nb-action');
  sel.innerHTML = '';
  const ph = document.createElement('option'); ph.value = ''; ph.textContent = 'Action'; sel.appendChild(ph);
  sel.classList.add('placeholder');
  const ctx = $('nb-ctx').value;
  if (!ctx) return;
  for (const l of actionsForCtx(ctx)) {
    const o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o);
  }
}
function renderKbSettings() {
  fillNbActions();
  const tbody = $('kb-tbody');
  tbody.innerHTML = '';
  for (const b of sortKb()) {
    const tr = document.createElement('tr');
    const key = document.createElement('input');
    key.className = 'kb-key'; key.readOnly = true; key.value = prettyKey(b);
    key.title = 'Click, then press the new keys';
    key.addEventListener('click', () => startKbRec(key, b));
    const tdKey = document.createElement('td'); tdKey.appendChild(key);
    const tdCtx = document.createElement('td'); tdCtx.className = 'kb-ctx';
    tdCtx.textContent = KCTX_NAMES[b.ctx] || b.ctx;
    const tdAct = document.createElement('td'); tdAct.className = 'kb-label'; tdAct.textContent = b.label;
    tr.appendChild(tdKey); tr.appendChild(tdCtx); tr.appendChild(tdAct);
    const tdDel = document.createElement('td'); tdDel.className = 'kb-del';
    const del = document.createElement('button');
    del.className = 'ibtn';
    del.innerHTML = IC_BIN;
    del.title = 'Delete keybinding';
    del.onclick = () => {
      stopKbRec(true);
      KEYBIND = KEYBIND.filter(x => x !== b);
      tombKb(b.id);
      saveKeybinds();
      renderKbSettings();
    };
    tdDel.appendChild(del);
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  }
  syncSortInd();
}
function openSettings() {
  $('settings-modal').hidden = false;
  resetNbFields();
  renderKbSettings();
}
function closeSettings() {
  stopKbRec(true);
  $('settings-modal').hidden = true;
}
/* Close whichever overlay is open. Drives the KEYBIND "modal" context's
 * single action (label 'Close'), so e.g. Escape closes the confirm-delete
 * dialog instead of letting the movie/library binding underneath fire. */
function closeModal() {
  if (!$('settings-modal').hidden) { closeSettings(); return; }
  if (!$('add-modal').hidden) { closeAdd(); return; }
  if (!$('confirm-modal').hidden) { $('cf-cancel').click(); return; }
}
$('btn-settings').addEventListener('click', openSettings);
$('st-close').addEventListener('click', closeSettings);
$('settings-modal').addEventListener('click', (e) => { if (e.target === $('settings-modal')) closeSettings(); });
$('nb-key').addEventListener('click', () => startKbRec($('nb-key'), null));
$('nb-add').addEventListener('click', () => commitKbRec());
$('nb-ctx').addEventListener('change', (e) => {
  e.target.classList.toggle('placeholder', !e.target.value);
  fillNbActions();
  renderKbSettings();
});
$('nb-action').addEventListener('change', (e) => e.target.classList.toggle('placeholder', !e.target.value));
document.querySelectorAll('.kb-table th[data-sort]').forEach(th =>
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (kbSort && kbSort.col === col) kbSort.dir *= -1;
    else kbSort = { col, dir: 1 };
    renderKbSettings();
  }));
$('kb-restore').addEventListener('click', () => {
  stopKbRec(true);
  KEYBIND = defaultKeybinds();
  untombAllKb();
  saveKeybinds();
  renderKbSettings();
});

/* ---------- misc ---------- */
function fmtClock(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
  const ss = String(s).padStart(2, '0');
  return (h > 0 ? h + ':' : '') + mm + ':' + ss;
}

function fmtBytes(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(2) + ' MB';
  if (b >= 1e3) return (b / 1e3).toFixed(1) + ' KB';
  return b + ' B';
}

function fmtSpeed(bps) {
  if (bps >= 1e6) return (bps / 1e6).toFixed(1) + ' MB/s';
  if (bps >= 1e3) return (bps / 1e3).toFixed(0) + ' KB/s';
  return bps + ' B/s';
}

function fmtEta(sec) {
  if (!isFinite(sec) || sec < 0) return '—';
  sec = Math.round(sec);
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'm ' + (sec % 60) + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

async function pollDownloads() {
  if (pollBusy) return;
  if (!currentMovie) return;
  pollBusy = 1;
  try {
    for (const row of document.querySelectorAll('#mv-torrents .row[data-id]')) {
      const st = row.dataset.state;
      if (st !== 'downloading' && st !== 'paused') continue;
      try {
        const s = await api('/api/library/' + row.dataset.id + '/status');
        if (s.state && s.state !== st) {
          row.dataset.state = s.state;
          refreshLibrary();
          continue;
        }
        const p = await api('/api/library/' + row.dataset.id + '/pieces');
        applyDlRow(row, row.dataset.id, p, s);
      } catch (e) { /* torrent may be gone; keep row as-is */ }
    }
  } finally { pollBusy = 0; }
}

updVol();
refreshLibrary();
setInterval(pollDownloads, 1000);
setInterval(refreshLibrary, 3000);
</script>
